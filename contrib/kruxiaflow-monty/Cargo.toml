[package]
name = "kruxiaflow-monty"
version = "0.12.5"
edition = "2024"
# monty-pool needs Rust 1.98 or newer; the engine itself does not
rust-version = "1.98"
authors = ["Sean Harrison <sah@kruxia.com>"]
license = "Apache-2.0"
description = "Sandboxed Python (run_code) for Kruxia Flow: an add-on worker on Pydantic Monty"
repository = "https://github.com/kruxia/kruxiaflow"
homepage = "https://kruxiaflow.com"
readme = "README.md"
keywords = ["workflow", "sandbox", "python", "llm", "worker"]
categories = ["asynchronous", "development-tools"]

# Its own workspace: Monty's toolchain and exact pins stay out of the engine's
[workspace]

[dependencies]
kruxiaflow-worker = { path = "../../worker-sdk", version = "0.12" }
# Exact pins: Monty's crates pin each other exactly, and the host must match
# the `monty` worker binary's version (checked at start-up)
monty-pool = "=1.6.0"
monty-types = "=1.6.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v7", "serde"] }

[dev-dependencies]
# The end-to-end test runs the engine (API and orchestrator) in-process
kruxiaflow-api = { path = "../../api" }
kruxiaflow-core = { path = "../../core" }
kruxiaflow-oauth = { path = "../../oauth" }
axum = { version = "0.7", features = ["ws"] }
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-rustls", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
tokio-util = "0.7"
