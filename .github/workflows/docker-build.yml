name: Docker Build

# Reusable multi-arch image BUILD stage. Each platform builds NATIVELY on its
# own runner (arm64 on ubuntu-24.04-arm — free for public repos) instead of
# under QEMU emulation, which made the Rust release build take >1 hour. Each
# build pushes by digest only and records the digest as a run artifact
# (digests-<platform>). Nothing here applies a tag, so this stage is safe to
# run before the checks finish: an untagged digest is not pullable by name.
#
# docker-merge.yml is the publish stage: it stitches the digests into a single
# multi-arch manifest list carrying the caller-supplied tags, so no tag ever
# points at a partial image. The two are separate workflows so the caller can
# gate the merge on jobs this stage does not wait for.
#
# GHA layer cache is scoped per platform so the two arches don't evict each
# other. Tag runs can restore caches written on main (the default branch), so
# rolling builds on main keep both platform caches warm for releases.

on:
  workflow_call:

env:
  # Keep in sync with docker-merge.yml
  IMAGE: kruxia/kruxiaflow

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # linux/amd64 -> linux-amd64 for use in cache scopes and artifact names
      - name: Sanitize platform name
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only — tags are applied by the merge job on the manifest list
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deploy
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
