name: Docker Merge

# Reusable multi-arch image PUBLISH stage. Stitches the per-platform digests
# that docker-build.yml pushed earlier in the SAME run (artifacts
# digests-<platform>) into a single multi-arch manifest list carrying the
# caller-supplied tags, so no tag ever points at a partial image.
#
# This is the step that makes an image pullable by name (and, on releases,
# moves :latest), so the caller gates it on the checks; the build stage is
# not gated and runs alongside them.

on:
  workflow_call:
    inputs:
      tags:
        description: docker/metadata-action tags spec for the merged manifest
        required: true
        type: string

env:
  # Keep in sync with docker-build.yml
  IMAGE: kruxia/kruxiaflow

jobs:
  merge:
    name: Merge manifest list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
