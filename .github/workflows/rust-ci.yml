name: Rust CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  SQLX_OFFLINE: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Lints and tests the optional mcp-server feature, which the default-feature
  # jobs don't compile. Its #[sqlx::test] tests need a PostgreSQL server; each
  # creates and migrates its own database. nextest runs each test in its own
  # process, so no other test in the binary can remove DATABASE_URL.
  # Runs alongside the lint jobs (no `needs`), like `test` below.
  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: kruxiaflow
          POSTGRES_PASSWORD: kruxiaflow_test
          POSTGRES_DB: kruxiaflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mcp
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy with the mcp-server feature
        run: cargo clippy -p kruxiaflow --features mcp-server --all-targets -- -D warnings

      - name: Test the MCP server
        run: cargo nextest run -p kruxiaflow --features mcp-server --bins -E 'test(mcp)'
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow

  test:
    name: Test with Coverage
    # Runs alongside the lint jobs (no `needs`), so a run takes as long as its
    # slowest job instead of lint + tests. The cost is that a commit failing
    # the lints still spends this job.
    runs-on: ubuntu-latest
    # id-token enables the Codecov OIDC upload (also requires the same grant
    # on the caller job — reusable workflows only get what the caller allows)
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: kruxiaflow
          POSTGRES_PASSWORD: kruxiaflow_test
          POSTGRES_DB: kruxiaflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Prebuilt binaries instead of `cargo install` (which compiles from
      # source on every run — minutes of CI time per tool).
      - name: Install cargo-llvm-cov, cargo-nextest, and sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,sqlx-cli

      - name: Create test database
        run: psql -h localhost -U kruxiaflow -c "CREATE DATABASE kruxiaflow_test;"
        env:
          PGPASSWORD: kruxiaflow_test

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow_test

      - name: Run tests with coverage
        run: ./scripts/test.sh --coverage-ci --skip-db-setup
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # OIDC instead of a CODECOV_TOKEN secret: nothing to rotate. Needs
          # id-token: write here AND on the caller job (main-ci.yml `rust:`),
          # plus the Codecov GitHub App installed on the repo.
          use_oidc: true
          # Flip to true once the first upload succeeds, so upload regressions
          # are visible instead of silently green.
          fail_ci_if_error: false

  # The kruxiaflow-monty add-on (contrib/kruxiaflow-monty: run_code,
  # sandboxed Python on Pydantic Monty) is its own Cargo workspace, which the
  # jobs above don't build. This job lints it and runs its tests against the
  # real `monty` worker binary, pinned to exactly the version of its
  # monty-pool pin (the worker refuses a mismatch at start-up). Keep
  # MONTY_VERSION here, the add-on's Dockerfile ARG and MONTY_VERSION in
  # contrib/kruxiaflow-monty/src/run_code/config.rs in step.
  monty-addon:
    name: Monty add-on (run_code)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contrib/kruxiaflow-monty
    env:
      MONTY_VERSION: "1.6.0"
      # The end-to-end test compiles the engine crates; their query data is
      # the engine's
      SQLX_OFFLINE_DIR: ${{ github.workspace }}/.sqlx
    # For the Example 16a end-to-end test (the engine's API and orchestrator
    # in-process, and this worker). #[sqlx::test] creates its own per-test
    # databases on this server.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: kruxiaflow
          POSTGRES_PASSWORD: kruxiaflow_test
          POSTGRES_DB: kruxiaflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contrib/kruxiaflow-monty
          cache-on-failure: true

      # monty-runtime publishes no prebuilt binaries, so the worker is built
      # from source once per version and cached
      - name: Cache the monty worker binary
        id: monty-cache
        uses: actions/cache@v4
        with:
          path: ~/monty-bin
          key: monty-runtime-${{ env.MONTY_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the monty worker binary
        if: steps.monty-cache.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_RELEASE_STRIP=symbols cargo install monty-runtime \
            --version "$MONTY_VERSION" --locked --root ~/monty-bin

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests, the sandbox integration tests against real Monty workers,
      # and the Example 16a end-to-end test (needs the database)
      - name: Test
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow
        run: |
          export KRUXIAFLOW_MONTY_BINARY="$HOME/monty-bin/bin/monty"
          "$KRUXIAFLOW_MONTY_BINARY" --version
          cargo nextest run
