name: Rust CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  SQLX_OFFLINE: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test with Coverage
    # Don't spend the expensive test/coverage job on commits that fail the
    # fast lint checks
    needs: [clippy, fmt]
    runs-on: ubuntu-latest
    # id-token enables the Codecov OIDC upload (also requires the same grant
    # on the caller job — reusable workflows only get what the caller allows)
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: kruxiaflow
          POSTGRES_PASSWORD: kruxiaflow_test
          POSTGRES_DB: kruxiaflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Prebuilt binaries instead of `cargo install` (which compiles from
      # source on every run — minutes of CI time per tool).
      - name: Install cargo-llvm-cov, cargo-nextest, and sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,sqlx-cli

      - name: Create test database
        run: psql -h localhost -U kruxiaflow -c "CREATE DATABASE kruxiaflow_test;"
        env:
          PGPASSWORD: kruxiaflow_test

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow_test

      - name: Run tests with coverage
        run: ./scripts/test.sh --coverage-ci --skip-db-setup
        env:
          DATABASE_URL: postgres://kruxiaflow:kruxiaflow_test@localhost:5432/kruxiaflow_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # OIDC instead of a CODECOV_TOKEN secret: nothing to rotate. Needs
          # id-token: write here AND on the caller job (main-ci.yml `rust:`),
          # plus the Codecov GitHub App installed on the repo.
          use_oidc: true
          # Flip to true once the first upload succeeds, so upload regressions
          # are visible instead of silently green.
          fail_ci_if_error: false

  # The optional `monty` feature (std.run_code, sandboxed Python on Pydantic
  # Monty) is not compiled by the jobs above, which build default features.
  # This job lints it and runs its tests against the real `monty` worker
  # binary. The binary is pinned to the exact version of the monty-pool pin in
  # worker/Cargo.toml (the worker refuses a mismatch at start-up); keep
  # MONTY_VERSION here, the Dockerfile ARG and MONTY_VERSION in
  # worker/src/activities/run_code/config.rs in step.
  monty:
    name: Monty (run_code)
    needs: [clippy, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MONTY_VERSION: "1.6.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: monty
          cache-on-failure: true

      # monty-runtime publishes no prebuilt binaries, so the worker is built
      # from source once per version and cached
      - name: Cache the monty worker binary
        id: monty-cache
        uses: actions/cache@v4
        with:
          path: ~/monty-bin
          key: monty-runtime-${{ env.MONTY_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the monty worker binary
        if: steps.monty-cache.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_RELEASE_STRIP=symbols cargo install monty-runtime \
            --version "$MONTY_VERSION" --locked --root ~/monty-bin

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy with the monty feature
        run: cargo clippy -p kruxiaflow -p kruxiaflow-std-worker --features kruxiaflow/monty --all-targets -- -D warnings

      # run_code needs no database: its unit tests, the worker-level
      # integration tests against real Monty workers, and the CLI flag tests
      - name: Test run_code
        run: |
          export KRUXIAFLOW_MONTY_BINARY="$HOME/monty-bin/bin/monty"
          "$KRUXIAFLOW_MONTY_BINARY" --version
          cargo nextest run -p kruxiaflow-std-worker --features monty --lib --test run_code_integration_tests \
            -E 'test(run_code) | binary(run_code_integration_tests)'
          cargo nextest run -p kruxiaflow --features monty --bins -E 'test(monty)'
