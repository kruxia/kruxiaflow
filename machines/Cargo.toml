[package]
name = "kruxiaflow-machine-shop"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The machine shop: small workflows run against a real engine. A developer tool, not part of the engine."

# The runner is the integration test `tests/machine_shop.rs`; the library is
# empty and exists only because a package needs one target of its own.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[dev-dependencies]
kruxiaflow-api = { path = "../api" }
kruxiaflow-core = { path = "../core" }
kruxiaflow-oauth = { path = "../oauth" }
kruxiaflow-std-worker = { path = "../worker" }
axum.workspace = true
bcrypt.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
