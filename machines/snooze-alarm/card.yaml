name: Snooze alarm
kind: compound
picture: >
  The alarm rings and waits for someone to switch it off. Left alone, it
  snoozes and rings again, three rings in all, then gives up. Someone can
  snooze it by hand, or switch it off, and then the bedroom is quiet.
functions:
  - a wait_for_signal step in a self-loop waits again in every round
  - "on_timeout: continue in every round of a loop: each round's wait times out on its own"
  - each round takes its own signal; between rounds a signal finds no wait
  - the loop's exit step runs once, after the round that exits
trap:
  issues: [27, 29, 32, 37]
  broken_looks_like: >
    The alarm's templates read {{ACTIVITY.iteration}}, never set before
    #32's fix, and {{SIGNAL.off}}, undefined before #37's fix. On main
    those template errors land on bedtime, which is marked failed although
    it ran (#19), the alarm never rings, and the workflow stays running.
    Before #29's fix a signaled round fails, and a wait in a loop can't
    take a second round's signal or timeout. Before #27's fix, quiet is
    skipped for good after the first ring doesn't exit the loop.
runs:
  - name: nobody switches it off
    timeout_seconds: 15
    expect:
      status: completed
      steps:
        bedtime: { status: completed, runs: 1 }
        alarm: { status: completed, runs: 3 }
        quiet: { status: completed, runs: 1 }
      outputs:
        - step: quiet
          output: echo
          equals: { rings: 3, switched_off: false }
  - name: snoozed once, then switched off
    timeout_seconds: 15
    signals:
      - step: alarm
        event: switch
        data: { off: false }
      - step: alarm
        event: switch
        data: { off: true }
    expect:
      status: completed
      steps:
        bedtime: { status: completed, runs: 1 }
        alarm: { status: completed, runs: 2 }
        quiet: { status: completed, runs: 1 }
      outputs:
        - step: quiet
          output: echo
          equals: { rings: 2, switched_off: true }
  - name: switched off at the first ring
    timeout_seconds: 15
    signals:
      - step: alarm
        event: switch
        data: { off: true }
    expect:
      status: completed
      steps:
        bedtime: { status: completed, runs: 1 }
        alarm: { status: completed, runs: 1 }
        quiet: { status: completed, runs: 1 }
      outputs:
        - step: quiet
          output: echo
          equals: { rings: 1, switched_off: true }
