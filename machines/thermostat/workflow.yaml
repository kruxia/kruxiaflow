# Thermostat: the dial gives the room's temperature and the setpoint, both
# in the workflow's input. The heater warms the room one degree a round, and
# keeps going while the room is below the setpoint.
#
# The heater's condition reads INPUT and {{heater.iteration}}, the rounds it
# has run so far; its parameters read them too.
#
# There is no "heating off" run, with the heater behind a condition that's
# false: a loop whose way in is skipped or false isn't skipped itself (it
# runs anyway, or waits for ever), whether or not INPUT can be read. That's
# a separate bug from the one this machine traps.
name: machine_thermostat

activities:
  - key: dial
    worker: std
    activity_name: echo
    parameters:
      room: "{{ INPUT.room }}"
      setpoint: "{{ INPUT.setpoint }}"
    outputs:
      - echo

  - key: heater
    worker: std
    activity_name: echo
    iteration_limit: 10
    parameters:
      round: "{{ heater.iteration + 1 }}"
      room: "{{ INPUT.room + heater.iteration + 1 }}"
    outputs:
      - echo
    depends_on:
      - dial
      - activity_key: heater
        conditions:
          - "{{ INPUT.room + heater.iteration < INPUT.setpoint }}"
