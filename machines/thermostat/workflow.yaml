# Thermostat: the dial gives the room's temperature and the setpoint, both
# in the workflow's input. The heater warms the room one degree a round, and
# keeps going while the room is below the setpoint.
#
# The heater's condition reads INPUT and {{heater.iteration}}, the rounds it
# has run so far; its parameters read them too.
#
# The heater only switches on when the dial shows the room below the
# setpoint: that's the condition on its way in, its dependency on the dial.
# On a warm morning the heater is skipped, and the workflow completes.
name: machine_thermostat

activities:
  - key: dial
    worker: std
    activity_name: echo
    parameters:
      room: "{{ INPUT.room }}"
      setpoint: "{{ INPUT.setpoint }}"
    outputs:
      - echo

  - key: heater
    worker: std
    activity_name: echo
    iteration_limit: 10
    parameters:
      round: "{{ heater.iteration + 1 }}"
      room: "{{ INPUT.room + heater.iteration + 1 }}"
    outputs:
      - echo
    depends_on:
      - activity_key: dial
        conditions:
          - "{{ dial.echo.room < dial.echo.setpoint }}"
      - activity_key: heater
        conditions:
          - "{{ INPUT.room + heater.iteration < INPUT.setpoint }}"
