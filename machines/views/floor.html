<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Machine Shop Floor</title>
<!--
  The Shop Floor: every machine at once, each drawn as a schematic of its
  own workflow, with every step lit by what it did in the chosen results.
  Written for edge developers: each machine's edge reading, what each run
  cost (its footprint), where it ran (its host), and, in plug mode, whether
  a twin with the plug pulled partway came out the same.

  A prototype, to compare with stack.html. The runner fills in the data
  marker below and writes this page next to the results; see
  machines/README.md. Everything is in this file: no network, no build.
  Colours and type follow the engine dashboard (dashboard/assets/
  dashboard.html), so the two read as one family, but nothing is shared.
-->
<style>
  /* Layout: a sticky control bar and andon board, then the floor: a grid of bays, one machine per bay. */
  :root {
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --ink:            #0b0b0b;
    --ink-secondary:  #52514e;
    --ink-muted:      #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11, 11, 11, 0.10);
    --series:         #2a78d6;
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical:#d03b3b;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-secondary: #c3c2b7; --ink-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255, 255, 255, 0.10); --series: #3987e5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-secondary: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255, 255, 255, 0.10); --series: #3987e5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.5 var(--sans);
    color: var(--ink);
    background: var(--page);
  }
  a { color: var(--series); }
  button, select { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .wrap {
    max-width: 1280px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* control bar */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header .wrap { padding-block: 12px; display: grid; gap: 10px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { color: var(--ink-muted); font-weight: 400; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; }
  .controls label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-secondary); }
  select { background: var(--surface); border: 1px solid var(--baseline); border-radius: 6px; padding: 4px 6px; max-width: 220px; }
  .controls .check { cursor: pointer; }
  .meta { font-size: 12px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
  .meta code { font-family: var(--mono); font-size: 11.5px; }

  /* andon board: one lamp per machine */
  .andon { display: flex; flex-wrap: wrap; gap: 6px; }
  .lamp-link {
    display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px 3px 6px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--page);
    color: var(--ink); text-decoration: none; font-size: 12px;
  }
  .lamp-link:hover { border-color: var(--baseline); }
  .lamp { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--ink-muted); }
  .lamp.works, .lamp.fixed { background: var(--status-good); }
  .lamp.known_broken { background: var(--status-warning); }
  .lamp.broken { background: var(--status-critical); box-shadow: 0 0 0 3px color-mix(in srgb, var(--status-critical) 25%, transparent); }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--border); background: var(--surface);
    white-space: nowrap;
  }
  .chip b { font-weight: 650; }
  .chip.works, .chip.fixed { border-color: color-mix(in srgb, var(--status-good) 45%, transparent); }
  .chip.known_broken { border-color: color-mix(in srgb, var(--status-warning) 60%, transparent); }
  .chip.broken { border-color: var(--status-critical); color: var(--status-critical); }
  .chip.changed { border-color: var(--series); color: var(--series); }

  /* the floor */
  main {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    min-height: 60vh;
  }
  main .wrap { padding-block: 20px 40px; }
  .floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start; }
  .bay {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    display: grid; gap: 10px; padding: 14px; min-width: 0; scroll-margin-top: 140px;
  }
  .bay.trap { border-style: dashed; border-color: var(--baseline); }
  .bay.dim { opacity: 0.45; }
  .bay-head { display: flex; align-items: flex-start; gap: 10px; }
  .bay-head .lamp { width: 14px; height: 14px; margin-top: 3px; }
  .bay-head .names { display: grid; gap: 1px; min-width: 0; flex: 1; }
  .bay-head h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .bay-head .kind { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .verdict { font-size: 12px; text-align: right; display: grid; gap: 2px; justify-items: end; }
  .verdict .secs { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .trapchip { font-size: 12px; }
  .runs { display: flex; flex-wrap: wrap; gap: 4px; }
  .runs button {
    border: 1px solid var(--border); background: var(--page); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .runs button[aria-pressed="true"] { border-color: var(--ink-secondary); background: var(--surface); font-weight: 600; }
  .runs .lamp { width: 8px; height: 8px; }

  .schematic { overflow-x: auto; }
  .schematic svg { display: block; max-width: none; height: auto; }
  @media (min-width: 840px) { .bay.wide { grid-column: span 2; } }
  .schematic text { font-family: var(--sans); }
  .link { fill: none; stroke: var(--baseline); stroke-width: 1.5; }
  .link.gated { stroke-dasharray: 4 3; }
  .gate { fill: var(--surface); stroke: var(--ink-muted); stroke-width: 1.2; }
  .arrow { fill: var(--baseline); }
  .part rect.body { stroke-width: 1.2; }
  .part.completed rect.body { fill: color-mix(in srgb, var(--status-good) 16%, var(--surface)); stroke: color-mix(in srgb, var(--status-good) 70%, var(--surface)); }
  .part.failed rect.body { fill: color-mix(in srgb, var(--status-critical) 18%, var(--surface)); stroke: var(--status-critical); }
  .part.running rect.body, .part.scheduled rect.body { fill: color-mix(in srgb, var(--status-warning) 22%, var(--surface)); stroke: var(--status-warning); }
  .part.skipped rect.body { fill: url(#hatch); stroke: var(--ink-muted); }
  .part.idle rect.body { fill: var(--surface); stroke: var(--ink-muted); stroke-dasharray: 3 3; }
  .hatch-bg { fill: var(--surface); }
  .hatch-line { stroke: var(--grid); stroke-width: 3; }
  .part .key { font-size: 11.5px; fill: var(--ink); font-weight: 600; }
  .part .state { font-size: 10.5px; fill: var(--ink-secondary); }
  .part .miss { fill: none; stroke: var(--status-critical); stroke-width: 2.5; }
  .part .delta { fill: none; stroke: var(--series); stroke-width: 1.5; stroke-dasharray: 2 2; }
  .badge { font-size: 10px; font-weight: 700; }
  .badge-bg.miss { fill: var(--status-critical); }
  .badge-bg.delta { fill: var(--series); }
  .badge-text { fill: #ffffff; }

  .problems { margin: 0; padding: 8px 10px 8px 26px; border-radius: 6px; font-size: 12.5px;
    background: color-mix(in srgb, var(--status-critical) 8%, var(--surface)); }
  .problems.known { background: color-mix(in srgb, var(--status-warning) 12%, var(--surface)); }
  .problems li + li { margin-top: 2px; }
  .ok { margin: 0; font-size: 12.5px; color: var(--ink-secondary); }
  .changes { margin: 0; font-size: 12.5px; color: var(--series); }

  details { border-top: 1px solid var(--border); padding-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: var(--ink-secondary); }
  details[open] summary { margin-bottom: 8px; }
  .story { margin: 0 0 8px; max-width: 62ch; color: var(--ink-secondary); }
  .functions { margin: 0 0 10px; padding-left: 18px; font-size: 13px; }
  .scroll { overflow-x: auto; }
  details + details { margin-top: 8px; }
  .bay details { min-width: 0; max-width: 100%; }
  .part[data-step] { cursor: pointer; }
  .part[data-step]:hover rect.body, .part[data-step]:focus-visible rect.body { stroke-width: 2.4; }
  .part[data-step]:focus { outline: none; }
  .source { position: relative; }
  .source code { display: inline-block; min-width: 100%; }
  .source .ln { display: block; padding: 0 6px; margin: 0 -6px; }
  .source .ln.hl { background: color-mix(in srgb, var(--series) 16%, var(--page)); box-shadow: inset 3px 0 var(--series); }
  .src-hint { margin: 0 0 6px; font-size: 12px; color: var(--ink-secondary); }
  .source { box-sizing: border-box; max-width: 100%; margin: 0; padding: 10px 12px; overflow-x: auto; max-height: 28rem; overflow-y: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.5; tab-size: 2;
    background: var(--page); border: 1px solid var(--border); border-radius: 4px; }
  table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; width: 100%; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); vertical-align: top; white-space: nowrap; }
  th { font-weight: 600; color: var(--ink-secondary); }

  /* at the edge: the machine where the network, the power or the operator can't be trusted */
  .edge { margin: 0; font-size: 13px; color: var(--ink-secondary); max-width: 66ch; }
  .edge b { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-right: 6px; }

  /* pull the plug: one mark per twin, coloured by how it came out */
  .plug { display: inline-block; width: 12px; height: 12px; flex: none; vertical-align: -1px; }
  .plug path, .plug rect { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .plug rect { fill: currentColor; }
  .plug.identical { color: var(--status-good); }
  .plug.different { color: var(--status-critical); }
  .plug.hung { color: var(--status-serious); }
  .plug.missed { color: var(--ink-muted); }
  .chip.plugged { gap: 6px; }
  .chip.different { border-color: var(--status-critical); color: var(--status-critical); }
  .chip.hung { border-color: var(--status-serious); }
  .twin { margin: 0; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; display: grid; gap: 4px;
    background: color-mix(in srgb, var(--ink-muted) 7%, var(--surface)); }
  .twin.different { background: color-mix(in srgb, var(--status-critical) 8%, var(--surface)); }
  .twin.hung { background: color-mix(in srgb, var(--status-serious) 12%, var(--surface)); }
  .twin p { margin: 0; }
  .twin ul { margin: 0; padding-left: 18px; }

  /* footprint: this run, and the machine's runs together */
  .foot { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .foot dt { color: var(--ink-muted); }
  .foot dd { margin: 0; color: var(--ink-secondary); min-width: 0; overflow-wrap: anywhere; }
  .hosts { display: flex; flex-wrap: wrap; gap: 4px; }
  .hosts .chip { font-size: 11.5px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-secondary); align-items: center; }
  .notes { margin: 10px 0 0; display: grid; gap: 2px; font-size: 12px; color: var(--ink-secondary); max-width: 90ch; }
  .notes p { margin: 0; }
  .notes b { color: var(--ink); font-weight: 600; }
  .legend svg { vertical-align: middle; margin-right: 4px; }
  .empty { max-width: 60ch; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .empty code { font-family: var(--mono); font-size: 12px; }
  /* one machine maximized: the bay fills the floor; its card and source sit beside it when there's room */
  .maxbtn { flex: none; width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; background: var(--page); color: var(--ink-secondary); }
  .maxbtn:hover, .maxbtn:focus-visible { border-color: var(--ink-secondary); color: var(--ink); }
  .maxbtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bay-main, .panels { display: grid; gap: 10px; min-width: 0; align-content: start; }
  .panels { gap: 0; }
  .panels:empty { display: none; }
  .back { margin: 0 0 10px; font-size: 13px; color: var(--ink-secondary); }
  .back kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .bay.max { grid-column: 1 / -1; }
  .floor > .back { grid-column: 1 / -1; }
  .bay.max .bay-head h2 { font-size: 19px; }
  .bay.max .schematic svg { width: min(100%, calc(var(--w) * 2px)); }
  .bay.max .source { max-height: calc(100vh - 220px); }
  @media (min-width: 1100px) {
    .bay.max { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); column-gap: 20px; align-items: start; }
  }
  @media (max-width: 560px) {
    header { position: static; }
    .controls { margin-left: 0; }
    .bay { scroll-margin-top: 8px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="6" height="6"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/>
    </pattern>
  </defs>
</svg>
<header>
  <div class="wrap">
    <div class="bar">
      <h1>Machine shop <span>· shop floor</span></h1>
      <div class="controls" id="controls"></div>
    </div>
    <div class="bar">
      <div class="tally" id="tally"></div>
      <div class="meta" id="meta"></div>
    </div>
    <nav class="andon" id="andon" aria-label="Machines"></nav>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="legend" id="legend"></div>
    <div class="notes" id="notes"></div>
    <div class="floor" id="floor" style="margin-top:14px"></div>
  </div>
</main>

<script id="shop-data" type="application/json">__MACHINE_SHOP_DATA__</script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------

let DATA = null;
try { DATA = JSON.parse(document.getElementById("shop-data").textContent); } catch (e) { DATA = null; }
const MACHINES = DATA ? DATA.machines : [];
const SETS = DATA ? DATA.results.map((s, i) => ({ ...s, id: i })) : [];
const ISSUE_URL = "https://github.com/kruxia/kruxiaflow/issues/";
/** Every issue a card's trap names: `issues: [29, 37]`, or `issue: 25` */
function trapIssues(t) {
  if (!t) return [];
  if (Array.isArray(t.issues) && t.issues.length) return t.issues;
  return t.issue != null ? [t.issue] : [];
}
/** A run's trap issues: `trap_issues`, or the single `trap` of older results files */
function runIssues(r) {
  if (!r) return [];
  if (Array.isArray(r.trap_issues) && r.trap_issues.length) return r.trap_issues;
  return r.trap ? [r.trap] : [];
}
/** #29, #37 as plain text */
function issueText(ns, sep) { return ns.map(n => `#${n}`).join(sep); }
/** Each issue as a link to it */
function issueLinks(ns) {
  return ns.map(n => `<a href="${ISSUE_URL}${encodeURIComponent(n)}" target="_blank" rel="noopener">#${esc(n)}</a>`).join(", ");
}

const RESULT_TEXT = { works: "Works", broken: "Broken", known_broken: "Known broken", fixed: "Fixed" };
const RESULT_RANK = { broken: 3, known_broken: 2, fixed: 1, works: 0 };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso || "";
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
/** Where a set ran; results files before machine-shop-results/2 don't say */
function hostOf(s) { return s && s.host ? s.host : "host not recorded"; }
const HOSTS = [...new Set(SETS.map(hostOf))];
const MULTI_HOST = HOSTS.length > 1;
function setName(s) {
  const same = SETS.filter(o => o.tree.label === s.tree.label && o.mode === s.mode && hostOf(o) === hostOf(s) && !o.plug === !s.plug).length;
  return `${s.tree.label} · ${s.mode}` + (MULTI_HOST ? ` · ${hostOf(s)}` : "") + (s.plug ? " · plug" : "") +
    (same > 1 ? ` · ${when(s.started_at)}` : "");
}
function runIn(set, dir, run) { return set ? set.runs.find(r => r.machine === dir && r.run === run) : undefined; }
function worst(rs) { return rs.length ? rs.reduce((a, b) => (RESULT_RANK[b.result] > RESULT_RANK[a.result] ? b : a)) : null; }
function resultLabel(r) {
  if (!r) return "Not run";
  const issues = runIssues(r);
  return (RESULT_TEXT[r.result] || r.result) + (issues.length ? ` · ${issueText(issues, ", ")}` : "");
}

// Pull the plug: a run's twin, and how it came out against the run
const TWIN_TEXT = { identical: "Identical", different: "Different", hung: "Hung", missed: "Missed" };
const TWIN_RANK = { hung: 3, different: 2, identical: 1, missed: 0 };
const TWIN_MEANS = {
  identical: "the twin came out the same as the uninterrupted run",
  different: "the twin came out differently",
  hung: "the twin never finished, though the uninterrupted run did",
  missed: "the twin finished before the plug was pulled",
};
const PLUG_SIMULATES = "Pulling the plug aborts the engine's in-process tasks (API server, orchestrator and std worker) at once, " +
  "which drops their connections and rolls back their open transactions. It is not a process kill and not a database power loss: " +
  "PostgreSQL keeps running throughout.";
function twinOf(r) { return r && r.twin ? r.twin : null; }
function worstTwin(rs) {
  const ts = rs.map(twinOf).filter(Boolean);
  return ts.length ? ts.reduce((a, b) => (TWIN_RANK[b.outcome] > TWIN_RANK[a.outcome] ? b : a)) : null;
}
function hasTwins(s) { return !!s && s.runs.some(r => r.twin); }
/** A plug, coloured by the twin's outcome; the words go in `label` */
function plugMark(outcome, label) {
  return `<svg class="plug ${esc(outcome)}" viewBox="0 0 12 12" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>` +
    `<path d="M4.5 1v3M7.5 1v3M6 8.5V11"/><rect x="2.5" y="4" width="7" height="4.5" rx="1.2"/></svg>`;
}
function twinLabel(t) { return t ? `Pull the plug: ${TWIN_TEXT[t.outcome] || t.outcome}, ${TWIN_MEANS[t.outcome] || ""}` : ""; }

// Footprint: what a run cost the engine
function secs(n) { return `${Number(n).toFixed(2)} s`; }
function bytes(n) { return n < 1000 ? `${n} B` : `${(n / 1000).toFixed(1)} kB`; }
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
function footText(f) {
  const parts = [plural(f.events, "event", "events"), `${bytes(f.payload_bytes)} of event payload`, plural(f.queue_rows, "queue row", "queue rows")];
  if (f.peak_engine_connections != null) parts.push(`${f.peak_engine_connections} engine connections at most`);
  return parts.join(" · ");
}
/** The machine's runs in `set`, added up: the runner's own sums, or the same sums made here */
function machineFoot(set, dir) {
  if (set.machine_footprints && set.machine_footprints[dir]) return set.machine_footprints[dir];
  const rs = set.runs.filter(r => r.machine === dir);
  const measured = rs.filter(r => r.footprint);
  if (!measured.length) return null;
  const sum = k => measured.reduce((a, r) => a + r.footprint[k], 0);
  const peaks = measured.map(r => r.footprint.peak_engine_connections).filter(n => n != null);
  return { runs: rs.length, measured: measured.length, seconds: rs.reduce((a, r) => a + r.seconds, 0),
    seconds_max: Math.max(...rs.map(r => r.seconds)), events: sum("events"), payload_bytes: sum("payload_bytes"),
    queue_rows: sum("queue_rows"), peak_engine_connections: peaks.length ? Math.max(...peaks) : null };
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const state = { set: null, compare: null, onlyChanged: false, run: {}, max: null };
if (SETS.length) {
  const last = SETS[SETS.length - 1];
  state.set = last.id;
  const other = [...SETS].reverse().find(s => s.mode === last.mode && s.tree.label !== last.tree.label);
  state.compare = other ? other.id : null;
}
for (const m of MACHINES) state.run[m.dir] = m.card.runs[0] ? m.card.runs[0].name : null;
const cur = () => (state.set === null ? null : SETS[state.set]);
const cmp = () => (state.compare === null ? null : SETS[state.compare]);

/** Did this run's result, or any step, differ from the compare set? */
function changed(dir, run) {
  const a = runIn(cmp(), dir, run), b = runIn(cur(), dir, run);
  if (!cmp() || !a || !b) return false;
  if (a.result !== b.result) return true;
  return Object.keys({ ...a.steps, ...b.steps }).some(k =>
    (a.steps[k] || {}).status !== (b.steps[k] || {}).status || (a.steps[k] || {}).runs !== (b.steps[k] || {}).runs);
}

// ---------------------------------------------------------------------------
// Schematic: steps in columns by depth, each depends_on drawn as a link
// ---------------------------------------------------------------------------

const W = 100, H = 40, GX = 24, GY = 14, PAD = 10;

function layout(steps) {
  const byKey = Object.fromEntries(steps.map(s => [s.key, s]));
  const depth = {};
  const visit = (k, seen = new Set()) => {
    if (depth[k] !== undefined) return depth[k];
    if (seen.has(k)) return 0;
    seen.add(k);
    const deps = (byKey[k] ? byKey[k].depends_on : []).filter(d => byKey[d.step]);
    depth[k] = deps.length ? 1 + Math.max(...deps.map(d => visit(d.step, seen))) : 0;
    return depth[k];
  };
  steps.forEach(s => visit(s.key));
  const cols = [];
  steps.forEach(s => (cols[depth[s.key]] ||= []).push(s.key));
  const rows = Math.max(...cols.map(c => c.length));
  const pos = {};
  cols.forEach((c, x) => c.forEach((k, i) => {
    const offset = (rows - c.length) * (H + GY) / 2;
    pos[k] = { x: PAD + x * (W + GX), y: PAD + offset + i * (H + GY) };
  }));
  return { pos, width: PAD * 2 + cols.length * W + (cols.length - 1) * GX, height: PAD * 2 + rows * H + (rows - 1) * GY };
}

function stateClass(status) {
  if (status === "completed") return "completed";
  if (status === "failed") return "failed";
  if (status === "skipped") return "skipped";
  // In flight: queued, running, or waiting for a signal
  if (["running", "scheduled", "pending", "waiting"].includes(status)) return "running";
  return "idle";
}
function stateText(st) {
  if (!st) return "not run";
  const status = st.status === "not_scheduled" || st.status === "absent" ? "never ran" : st.status.replace(/_/g, " ");
  return st.runs > 1 ? `${status} · ran ${st.runs}×` : status;
}

let uid = 0;
function schematic(m, run, spec) {
  const steps = m.workflow.steps;
  const { pos, width, height } = layout(steps);
  const id = `s${uid++}`;
  const prev = runIn(cmp(), m.dir, spec.name);
  let links = "", parts = "";
  for (const s of steps) {
    for (const d of s.depends_on) {
      const a = pos[d.step], b = pos[s.key];
      if (!a || !b) continue;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 4, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      const gated = d.conditions && d.conditions.length;
      links += `<path class="link${gated ? " gated" : ""}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" marker-end="url(#${id}-arrow)"/>`;
      if (gated) {
        const gx = mx, gy = (y1 + y2) / 2;
        links += `<g><title>Only if ${esc(d.conditions.join(" and "))}</title><path class="gate" d="M${gx} ${gy - 6} L${gx + 6} ${gy} L${gx} ${gy + 6} L${gx - 6} ${gy} Z"/></g>`;
      }
    }
  }
  for (const s of steps) {
    const p = pos[s.key];
    const got = run ? run.steps[s.key] : null;
    const want = spec.expect.steps[s.key];
    const miss = run && want && (!got || got.status !== want.status || (want.runs != null && got.runs !== want.runs));
    const was = prev ? prev.steps[s.key] : null;
    const delta = run && prev && was && got && (was.status !== got.status || was.runs !== got.runs);
    const tip = [`${s.key}: ${s.activity || "?"} on ${s.worker || "?"}`,
      got ? `now: ${stateText(got)}` : "", want ? `card expects: ${want.status}${want.runs != null ? `, ${want.runs} run${want.runs === 1 ? "" : "s"}` : ""}` : "",
      delta ? `in ${setName(cmp())}: ${stateText(was)}` : ""].filter(Boolean).join("\n");
    const cls = got ? stateClass(got.status) : "idle";
    let badges = "", bx = p.x + W - 8;
    if (miss) { badges += `<circle class="badge-bg miss" cx="${bx}" cy="${p.y}" r="7"/><text class="badge badge-text" x="${bx}" y="${p.y + 3.5}" text-anchor="middle">!</text>`; bx -= 16; }
    if (delta) { badges += `<circle class="badge-bg delta" cx="${bx}" cy="${p.y}" r="7"/><text class="badge badge-text" x="${bx}" y="${p.y + 3.5}" text-anchor="middle">Δ</text>`; }
    parts += `<g class="part ${cls}" data-step="${esc(s.key)}" tabindex="0" role="button" aria-label="${esc(`${s.key}: show its source`)}"><title>${esc(tip)}
Click to see its source</title>
      ${delta ? `<rect class="delta" x="${p.x - 4}" y="${p.y - 4}" width="${W + 8}" height="${H + 8}" rx="8"/>` : ""}
      <rect class="body" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5"/>
      ${miss ? `<rect class="miss" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5"/>` : ""}
      <text class="key" x="${p.x + 9}" y="${p.y + 17}">${esc(s.key.length > 14 ? s.key.slice(0, 13) + "…" : s.key)}</text>
      <text class="state" x="${p.x + 9}" y="${p.y + 31}">${esc(stateText(got))}</text>
      ${badges}</g>`;
  }
  return `<svg viewBox="-2 -9 ${width + 4} ${height + 11}" width="${width + 4}" style="--w:${width + 4}" role="img" aria-label="Schematic of ${esc(m.card.name)}">
    <defs>
      <marker id="${id}-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 Z"/></marker>
    </defs>${links}${parts}</svg>`;
}

// ---------------------------------------------------------------------------
// Page
// ---------------------------------------------------------------------------

function controls() {
  if (!SETS.length) return "";
  const opts = (sel, none) => (none ? `<option value=""${sel === null ? " selected" : ""}>Nothing</option>` : "") +
    SETS.map(s => `<option value="${s.id}"${s.id === sel ? " selected" : ""}>${esc(setName(s))}</option>`).join("");
  return `<label for="pick-set">Results <select id="pick-set">${opts(state.set)}</select></label>
    <label for="pick-cmp">Compare with <select id="pick-cmp">${opts(state.compare, true)}</select></label>
    <label class="check" for="only-changed"><input type="checkbox" id="only-changed"${state.onlyChanged ? " checked" : ""}${cmp() ? "" : " disabled"}> Only what changed</label>`;
}

function tally() {
  const s = cur();
  if (!s) return "";
  const c = { works: 0, broken: 0, known_broken: 0, fixed: 0 };
  s.runs.forEach(r => (c[r.result] = (c[r.result] || 0) + 1));
  let html = Object.entries(c).map(([k, n]) => `<span class="chip ${k}${n ? "" : " zero"}"><span class="lamp ${k}"></span>${RESULT_TEXT[k]} <b>${n}</b></span>`).join("");
  if (cmp()) {
    const n = MACHINES.reduce((acc, m) => acc + m.card.runs.filter(r => changed(m.dir, r.name)).length, 0);
    html += `<span class="chip changed">Δ Changed since ${esc(setName(cmp()))} <b>${n}</b></span>`;
  }
  if (hasTwins(s)) {
    const t = { identical: 0, different: 0, hung: 0, missed: 0 };
    s.runs.forEach(r => { if (r.twin) t[r.twin.outcome] = (t[r.twin.outcome] || 0) + 1; });
    html += Object.entries(t).map(([k, n]) =>
      `<span class="chip plugged ${k}" title="${esc(TWIN_MEANS[k] || "")}">${plugMark(k, TWIN_TEXT[k])}${TWIN_TEXT[k]} <b>${n}</b></span>`).join("");
  }
  return html;
}

function meta() {
  const s = cur();
  if (!s) return "";
  return `<code>${esc(s.tree.branch)} @ ${esc(s.tree.commit)}</code> · ${esc(s.runner)} runner · ${esc(s.mode)} mode · ran on <code>${esc(hostOf(s))}</code> · ${esc(when(s.started_at))} · ${s.runs.length} runs in ${Number(s.seconds).toFixed(1)}s` +
    (s.footprint && s.footprint.peak_engine_connections != null ? ` · at most ${s.footprint.peak_engine_connections} of ${s.footprint.engine_pool_max_connections} engine connections` : "") +
    (s.plug ? ` · plug seed ${esc(s.plug.seed)}` : "");
}

function andon() {
  return MACHINES.map(m => {
    const rs = (cur() ? cur().runs : []).filter(x => x.machine === m.dir);
    const r = worst(rs), t = worstTwin(rs);
    return `<a class="lamp-link" href="#${state.max ? "max-" : ""}${esc(m.dir)}" title="${esc(resultLabel(r))}"><span class="lamp ${r ? r.result : ""}"></span>${esc(m.card.name)}${t ? plugMark(t.outcome, twinLabel(t)) : ""}</a>`;
  }).join("");
}

function legend() {
  const box = (cls, extra = "") => `<svg width="22" height="14" viewBox="0 0 22 14"><g class="part ${cls}"><rect class="body" x="1" y="1" width="20" height="12" rx="3"/>${extra}</g></svg>`;
  return `<span>${box("completed")}completed</span>
    <span>${box("skipped")}skipped</span>
    <span>${box("idle")}never ran</span>
    <span>${box("failed")}failed</span>
    <span><svg width="22" height="14" viewBox="0 0 22 14"><circle class="badge-bg miss" cx="7" cy="7" r="6"/><text class="badge badge-text" x="7" y="10.5" text-anchor="middle">!</text></svg>not what the card expects</span>
    ${cmp() ? `<span><svg width="22" height="14" viewBox="0 0 22 14"><circle class="badge-bg delta" cx="7" cy="7" r="6"/><text class="badge badge-text" x="7" y="10.5" text-anchor="middle">Δ</text></svg>different in ${esc(setName(cmp()))}</span>` : ""}
    <span><svg width="22" height="14" viewBox="0 0 22 14"><path class="link gated" d="M0 7 H22"/><path class="gate" d="M11 2 L16 7 L11 12 L6 7 Z"/></svg>runs only if a condition holds</span>
    ${hasTwins(cur()) ? Object.keys(TWIN_TEXT).map(k => `<span>${plugMark(k, TWIN_TEXT[k])} ${esc(TWIN_MEANS[k])}</span>`).join("") : ""}`;
}

/** Shop mode pulls the plug once for every twin: when, and for how long */
function shopPull(s) {
  if (!s || s.mode !== "shop" || !s.plug) return "";
  const p = s.runs.map(r => r.twin && r.twin.plug).find(Boolean);
  const share = s.plug.shop_fraction != null ? `, when they together had ${Math.round(s.plug.shop_fraction * 100)}% of the uninterrupted runs' events in` : "";
  return ` In shop mode the twins ran together, and the plug was pulled once for all of them${share}${p ? `; the engine was down for ${secs(p.down_seconds)}` : ""}.`;
}

function notes() {
  return (hasTwins(cur()) ? `<p><b>Pull the plug.</b> Each run has a twin, and partway through it the engine was stopped and restarted on the same database.${esc(shopPull(cur()))} ${esc(PLUG_SIMULATES)}</p>` : "") +
    `<p><b>Works offline.</b> This page loads nothing from the network: the machines and every results set are inside the file.</p>
    <p><b>Only PostgreSQL.</b> The engine under test needs nothing else: these runs used its API server, orchestrator and std worker, with no cache, broker or other service.</p>`;
}

/** Where the plug was pulled on a twin, and how it came out, in words */
function twinBlock(set, run) {
  if (!set || !set.plug || !run) return "";
  const t = twinOf(run);
  if (!t) {
    const why = !run.footprint ? "its workflow wasn't deployed" : "the run had too few events to pull the plug partway through";
    return `<div class="twin"><p>No twin: ${esc(why)}.</p></div>`;
  }
  const p = t.plug;
  let where;
  if (!p) where = "The plug was never pulled: the twin finished first.";
  else if (p.after_event != null) where = `Pulled the plug after event ${p.after_event} of ${p.of_events}; ${plural(p.events_at_plug, "event was", "events were")} in when the engine stopped, and it was down for ${secs(p.down_seconds)}.`;
  else where = `When the plug was pulled, this twin had ${p.events_at_plug} of the uninterrupted run's ${p.of_events} events in.`;
  if (p && p.settled_before) where += " The twin had already finished.";
  const came = `The twin took ${secs(t.seconds)}, against ${secs(run.seconds)} uninterrupted: ${TWIN_TEXT[t.outcome] || t.outcome}, ${TWIN_MEANS[t.outcome] || ""}.`;
  const diffs = t.differences && t.differences.length ? `<ul>${t.differences.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : "";
  return `<div class="twin ${esc(t.outcome)}"><p>${plugMark(t.outcome, twinLabel(t))} ${esc(where)}</p><p>${esc(came)}</p>${diffs}</div>`;
}

/** The footprint of the chosen run, and of the machine's runs together */
function footBlock(set, m, run) {
  if (!set || !run) return "";
  if (!run.footprint) {
    const why = run.status === "not_deployed" ? "the workflow wasn't deployed, so nothing ran"
      : `this results set has no footprints (${esc(set.schema || "machine-shop-results/1")})`;
    return `<dl class="foot"><dt>Footprint</dt><dd>None: ${why}.</dd></dl>`;
  }
  const mf = machineFoot(set, m.dir);
  const all = mf && mf.runs > 1
    ? `<dt>All ${mf.runs} runs</dt><dd>${secs(mf.seconds)} in all, longest ${secs(mf.seconds_max)} · ${esc(footText(mf))}</dd>` : "";
  const twin = run.twin && run.twin.footprint ? `<dt>Its twin</dt><dd>${secs(run.twin.seconds)} · ${esc(footText(run.twin.footprint))}</dd>` : "";
  return `<dl class="foot"><dt>This run</dt><dd>${secs(run.seconds)} · ${esc(footText(run.footprint))}</dd>${twin}${all}</dl>`;
}

/** With results from several hosts: the machine's latest result on each, for the chosen set's mode */
function hostsBlock(m) {
  const s = cur();
  if (!MULTI_HOST || !s) return "";
  const chips = HOSTS.map(h => {
    const sets = SETS.filter(o => hostOf(o) === h && o.mode === s.mode);
    const pick = [...sets].reverse().find(o => o.tree.label === s.tree.label) || sets[sets.length - 1];
    if (!pick) return "";
    const rs = pick.runs.filter(r => r.machine === m.dir);
    const r = worst(rs), t = worstTwin(rs);
    return `<span class="chip" title="${esc(setName(pick))}: ${esc(resultLabel(r))}"><span class="lamp ${r ? r.result : ""}"></span>${esc(h)}${t ? plugMark(t.outcome, twinLabel(t)) : ""}</span>`;
  }).join("");
  return chips ? `<div class="hosts" aria-label="By host">${chips}</div>` : "";
}

function bay(m) {
  const c = m.card;
  const spec = c.runs.find(r => r.name === state.run[m.dir]) || c.runs[0];
  const run = runIn(cur(), m.dir, spec.name);
  const anyChanged = c.runs.some(r => changed(m.dir, r.name));
  const mark = rr => (twinOf(rr) ? plugMark(rr.twin.outcome, twinLabel(rr.twin)) : "");
  const tabs = c.runs.length > 1 ? `<div class="runs" role="group" aria-label="Runs">${c.runs.map(r => {
    const rr = runIn(cur(), m.dir, r.name);
    return `<button type="button" data-machine="${esc(m.dir)}" data-run="${esc(r.name)}" aria-pressed="${r.name === spec.name}"><span class="lamp ${rr ? rr.result : ""}"></span>${esc(r.name)}${changed(m.dir, r.name) ? " Δ" : ""}${mark(rr)}</button>`;
  }).join("")}</div>` : `<div class="runs"><span class="meta">Run: ${esc(spec.name)}</span>${mark(run)}</div>`;

  let findings = "";
  if (!run) findings = `<p class="ok">Not run in ${esc(setName(cur()))}.</p>`;
  else if (run.problems.length) findings = `<ul class="problems${run.result === "known_broken" ? " known" : ""}">${run.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  else findings = `<p class="ok">Did what its card says.${run.result === "fixed" ? ` Trap ${esc(issueText(runIssues(run), ", "))} now passes: take the trap label off.` : ""}</p>`;
  const prev = runIn(cmp(), m.dir, spec.name);
  if (run && prev && prev.result !== run.result) {
    findings += `<p class="changes">Δ ${esc(setName(cmp()))}: ${esc(resultLabel(prev))} → ${esc(setName(cur()))}: ${esc(resultLabel(run))}</p>`;
  }

  const recent = SETS.slice(-4);
  const matrix = `<div class="scroll"><table><thead><tr><th>Run</th>${recent.map(s => `<th>${esc(setName(s))}</th>`).join("")}</tr></thead><tbody>${
    c.runs.map(r => `<tr><td>${esc(r.name)}</td>${recent.map(s => {
      const x = runIn(s, m.dir, r.name);
      return `<td><span class="lamp ${x ? x.result : ""}" style="display:inline-block;width:8px;height:8px;margin-right:5px"></span>${esc(resultLabel(x))}${x ? ` · ${Number(x.seconds).toFixed(2)}s` : ""}${x && x.footprint ? ` · ${plural(x.footprint.events, "event", "events")}` : ""} ${mark(x)}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;

  const wide = layout(m.workflow.steps).width > 370;
  const isMax = state.max === m.dir;
  const maxBtn = `<button type="button" class="maxbtn" data-max="${esc(m.dir)}" aria-label="${isMax ? "Back to the floor" : `Maximize ${esc(c.name)}`}" title="${isMax ? "Back to the floor (Esc)" : "Maximize this machine"}">${isMax ? ICON_RESTORE : ICON_MAX}</button>`;
  const fsBtn = isMax && document.fullscreenEnabled ? `<button type="button" class="maxbtn" data-fullscreen aria-label="Full screen" title="Full screen (F)">${ICON_FULL}</button>` : "";
  return `<section class="bay${wide ? " wide" : ""}${isMax ? " max" : ""}${c.trap ? " trap" : ""}${state.onlyChanged && cmp() && !anyChanged && !isMax ? " dim" : ""}" id="${esc(m.dir)}" aria-label="${esc(c.name)}">
    <div class="bay-main">
    <div class="bay-head">
      <span class="lamp ${run ? run.result : ""}" title="${esc(resultLabel(run))}"></span>
      <div class="names"><h2>${esc(c.name)}</h2><span class="kind">${esc(c.kind)} machine · ${m.workflow.steps.length} steps</span></div>
      <div class="verdict"><span>${esc(resultLabel(run))}</span>${run ? `<span class="secs">${Number(run.seconds).toFixed(2)}s</span>` : ""}
        ${trapIssues(c.trap).length ? `<span class="trapchip">Trap · ${issueLinks(trapIssues(c.trap))}</span>` : ""}</div>
      ${fsBtn}${maxBtn}
    </div>
    ${c.edge ? `<p class="edge"><b>At the edge</b>${esc(c.edge)}</p>` : ""}
    ${hostsBlock(m)}
    ${tabs}
    <div class="schematic">${schematic(m, run, spec)}</div>
    ${findings}
    ${twinBlock(cur(), run)}
    ${footBlock(cur(), m, run)}
    </div>
    <div class="panels">
    <details><summary>Card: story, engine functions, recent results</summary>
      <p class="story">${esc(c.picture)}</p>
      ${c.trap ? `<p class="story"><b>When the bug is there:</b> ${esc(c.trap.broken_looks_like)}</p>` : ""}
      <ul class="functions">${c.functions.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      ${matrix}
    </details>
    <details data-part="source"><summary>Workflow source: machines/${esc(m.dir)}/workflow.yaml</summary>
      <p class="src-hint">Click a step in the schematic to highlight its activity here.</p>
      <pre class="source"><code>${sourceLines(m.workflow.source || "")}</code></pre>
    </details>
    </div>
  </section>`;
}

/** The lines of one activity in workflow.yaml, [start, end): its `- key:` line, any comment
 *  lines just above it, and everything indented under it */
function stepLines(src, step) {
  const lines = src.split("\n");
  const indentOf = l => l.match(/^ */)[0].length;
  let start = lines.findIndex(l => {
    const m = l.match(/^\s*- key:\s*["']?([^"'\s#]+)["']?\s*(#.*)?$/);
    return m && m[1] === step;
  });
  if (start < 0) return null;
  const indent = indentOf(lines[start]);
  let end = start + 1;
  for (; end < lines.length; end++) {
    const l = lines[end];
    if (!l.trim()) continue;
    if (indentOf(l) <= indent) break;
  }
  while (end - 1 > start && !lines[end - 1].trim()) end--;
  while (start > 0 && /^\s*#/.test(lines[start - 1]) && indentOf(lines[start - 1]) === indent) start--;
  return [start, end];
}
function sourceLines(src) {
  return src.replace(/\n$/, "").split("\n").map(l => `<span class="ln">${esc(l) || " "}</span>`).join("");
}
/** Open a bay's source and highlight one step's activity in it */
function showStepSource(bay, step) {
  const d = bay.querySelector('details[data-part="source"]');
  const m = MACHINES.find(x => x.dir === bay.id);
  if (!d || !m) return;
  d.open = true;
  const range = stepLines(m.workflow.source || "", step);
  const lines = [...d.querySelectorAll(".source .ln")];
  lines.forEach((ln, i) => ln.classList.toggle("hl", !!range && i >= range[0] && i < range[1]));
  const pre = d.querySelector(".source"), first = range && lines[range[0]];
  if (first) pre.scrollTop = Math.max(0, first.offsetTop - 24);
  d.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
document.addEventListener("click", e => {
  const g = e.target.closest && e.target.closest(".bay [data-step]");
  if (g) showStepSource(g.closest(".bay"), g.dataset.step);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest && e.target.closest(".bay [data-step]");
  if (g) { e.preventDefault(); showStepSource(g.closest(".bay"), g.dataset.step); }
});

// ---------------------------------------------------------------------------
// One machine maximized: `#max-<machine>` in the URL, so a link opens it
// ---------------------------------------------------------------------------

const ICON_MAX = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2h4.5v4.5M14 2l-5 5M6.5 14H2V9.5M2 14l5-5"/></svg>`;
const ICON_RESTORE = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 6.5H9.5V2.5M9.5 6.5l5-5M2.5 9.5h4v4M6.5 9.5l-5 5"/></svg>`;
const ICON_FULL = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>`;
const MAX_PREFIX = "max-";
let floorScroll = 0;

function maxFromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (_) { h = ""; }
  const dir = h.startsWith(MAX_PREFIX) ? h.slice(MAX_PREFIX.length) : "";
  return MACHINES.some(m => m.dir === dir) ? dir : null;
}
/** A newly maximized bay opens its source, unless one of its panels is already open */
function openMaxSource() {
  const b = state.max && document.getElementById(state.max);
  const src = b && b.querySelector('details[data-part="source"]');
  if (src && !b.querySelector("details[open]")) src.open = true;
}
function applyHash() {
  const next = maxFromHash();
  if (next === state.max) return;
  const was = state.max;
  if (!was) floorScroll = window.scrollY;
  state.max = next;
  render();
  if (next) { openMaxSource(); window.scrollTo(0, 0); return; }
  const b = was && document.getElementById(was);
  if (floorScroll) window.scrollTo(0, floorScroll);
  else if (b) b.scrollIntoView({ block: "start" });
}
function toggleFullscreen() {
  try {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (_) { /* full screen isn't available here */ }
}
window.addEventListener("hashchange", applyHash);
document.addEventListener("keydown", e => {
  if (!state.max || (e.target.closest && e.target.closest("input, select, textarea"))) return;
  if (e.key === "Escape" && !document.fullscreenElement) location.hash = "";
  else if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) toggleFullscreen();
});

function render() {
  if (!DATA) {
    document.getElementById("floor").innerHTML = `<div class="empty"><p>This is the page template, with no results in it yet. Run the machine shop and open the page it writes:</p>
      <p><code>cargo test -p kruxiaflow-api --test machine_shop</code></p><p>The page is written to <code>target/tmp/machine-shop/floor.html</code>.</p></div>`;
    return;
  }
  const open = new Set([...document.querySelectorAll(".bay details[open]")].map(d => `${d.closest(".bay").id}|${d.dataset.part || "card"}`));
  document.getElementById("controls").innerHTML = controls();
  document.getElementById("tally").innerHTML = tally();
  document.getElementById("meta").innerHTML = meta();
  document.getElementById("andon").innerHTML = andon();
  document.getElementById("legend").innerHTML = legend();
  document.getElementById("notes").innerHTML = notes();
  uid = 0;
  const shown = state.max ? MACHINES.filter(m => m.dir === state.max) : MACHINES;
  document.getElementById("floor").innerHTML =
    (state.max ? `<p class="back"><a href="#">← Back to the floor</a> · or press <kbd>Esc</kbd>${document.fullscreenEnabled ? "; <kbd>F</kbd> for full screen" : ""}</p>` : "") +
    shown.map(bay).join("");
  open.forEach(key => {
    const [id, part] = key.split("|");
    const d = document.querySelector(`#${CSS.escape(id)} details${part === "card" ? ":not([data-part])" : `[data-part="${part}"]`}`);
    if (d) d.open = true;
  });

  const ps = document.getElementById("pick-set"), pc = document.getElementById("pick-cmp"), oc = document.getElementById("only-changed");
  if (ps) ps.onchange = () => { state.set = Number(ps.value); render(); };
  if (pc) pc.onchange = () => { state.compare = pc.value === "" ? null : Number(pc.value); render(); };
  if (oc) oc.onchange = () => { state.onlyChanged = oc.checked; render(); };
}

document.getElementById("floor").addEventListener("click", e => {
  const mx = e.target.closest("button[data-max]");
  if (mx) { location.hash = state.max === mx.dataset.max ? "" : MAX_PREFIX + mx.dataset.max; return; }
  if (e.target.closest("button[data-fullscreen]")) { toggleFullscreen(); return; }
  const b = e.target.closest("button[data-run]");
  if (!b) return;
  state.run[b.dataset.machine] = b.dataset.run;
  render();
});

state.max = maxFromHash();
render();
openMaxSource();
</script>
</body>
</html>
