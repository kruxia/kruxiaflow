<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Machine Shop Stack</title>
<!--
  The Stack: the machine shop as a stack of cards, one card per machine,
  in homage to HyperCard (the look, not Apple's artwork, names or fonts).

  For electrical and old-school engineers: each machine card has a
  datasheet, a ladder-logic sheet and a logic-analyzer timing sheet, each
  with a drafting title block, and a legend card explains the symbols.

  The runner fills in the data marker below and writes this page next to
  the results; see machines/README.md. Everything is in this file: no
  network, no build.
-->
<style>
  /* Layout: one card in a window on a dithered desk; a tool bar under it. 1-bit: ink on paper, inverted in dark mode. */
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --page: var(--paper);
    --surface: var(--paper);
    --border: var(--ink);
    --body: Geneva, Verdana, "DejaVu Sans", sans-serif;
    --mono: Monaco, Menlo, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #000000; --ink: #ffffff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #000000; --ink: #ffffff; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.45 var(--body);
    color: var(--ink);
    /* the desk: a 25% dither */
    background:
      repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 100%) 0 0 / 4px 4px,
      var(--paper);
    background-color: var(--paper);
    min-height: 100vh;
    padding-block: 24px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .px { display: inline-block; vertical-align: middle; max-width: 100%; height: auto; }

  .window {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .titlebar {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: 26px;
    border-bottom: 2px solid var(--ink);
    background:
      repeating-linear-gradient(to bottom, var(--ink) 0 1px, var(--paper) 1px 3px) 0 4px / 100% 18px no-repeat,
      var(--paper);
  }
  .titlebar .label { background: var(--paper); padding: 0 10px; line-height: 0; }
  .titlebar .box {
    position: absolute; left: 10px; top: 5px; width: 13px; height: 13px;
    border: 1px solid var(--ink); background: var(--paper);
  }

  .card { position: relative; min-height: 420px; }
  .card > .inner { padding: 20px; background: var(--paper); min-height: inherit; }
  /* a trap card: a dithered frame, so traps stand out as you flip */
  .card.trap { padding: 10px; background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 2px 2px; }
  .card.trap > .inner { border: 2px solid var(--ink); min-height: 400px; }
  @media (prefers-reduced-motion: no-preference) {
    .card.flip { animation: dissolve 240ms steps(4) both; }
  }
  @keyframes dissolve { from { opacity: 0.35; } to { opacity: 1; } }

  .head { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .frame { border: 2px solid var(--ink); padding: 4px; line-height: 0; background: var(--paper); color: var(--ink); }
  .picture { display: block; image-rendering: pixelated; }
  .head .text { flex: 1 1 260px; min-width: 0; display: grid; gap: 8px; }
  .kind { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .traplabel {
    display: inline-block; justify-self: start;
    background: var(--ink); color: var(--paper);
    padding: 2px 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none;
  }
  .traplabel a { color: inherit; text-decoration: none; }
  .traplabel a:hover { text-decoration: underline; }

  /* a "shadow" field, as HyperCard drew them */
  .field {
    border: 1px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    padding: 8px 10px;
    background: var(--paper);
    min-width: 0;
  }
  .field + .field, .section { margin-top: 18px; }
  h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 6px; font-weight: bold; }
  .story { margin: 0; max-width: 62ch; }
  ul.functions { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  ul.functions li { padding-left: 18px; position: relative; }
  ul.functions li::before {
    content: ""; position: absolute; left: 2px; top: 0.45em; width: 7px; height: 7px; border: 1px solid var(--ink);
  }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: bold; }
  th .sub { display: block; font-weight: normal; text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 11px; }
  td .secs { display: block; font-size: 11px; margin-top: 3px; font-family: var(--mono); }

  /* rubber stamps */
  .stamp {
    display: inline-block; white-space: nowrap;
    padding: 1px 6px; border: 2px solid var(--ink);
    font: bold 11px/1.4 var(--body); letter-spacing: 0.08em; text-transform: uppercase;
    transform: rotate(-2deg);
  }
  .stamp.broken { background: var(--ink); color: var(--paper); }
  .stamp.known_broken {
    background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 2px 2px;
  }
  .stamp.known_broken span { background: var(--paper); padding: 0 3px; }
  .stamp.fixed { border-style: double; border-width: 4px; padding: 0 5px; }
  .stamp.none { border-style: dotted; font-weight: normal; transform: none; }

  .notes { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; }
  .notes li + li { margin-top: 3px; }

  /* home card */
  .hero { display: grid; gap: 6px; margin-bottom: 18px; }
  .hero p { margin: 0; max-width: 60ch; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tile { display: grid; gap: 4px; }
  .tile .name { font-weight: bold; }
  .tile .meta { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .tile .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .mbutton {
    display: grid; justify-items: center; gap: 6px; padding: 10px 6px;
    background: var(--paper); border: 1px solid transparent; cursor: pointer; text-align: center;
  }
  .mbutton:hover, .mbutton:focus-visible { border-color: var(--ink); }
  .mbutton:active { background: var(--ink); color: var(--paper); }

  /* compare card */
  .pickers { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .pickers label { display: grid; gap: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  select, input[type="search"] {
    background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 4px 6px; max-width: 100%;
  }
  .arrow { font-family: var(--mono); padding: 0 6px; }

  /* tool bar */
  .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border-top: 2px solid var(--ink); padding: 8px 12px;
  }
  .tools button {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 3px 10px; line-height: 0; cursor: pointer; min-height: 30px;
  }
  .tools button:active { background: var(--ink); color: var(--paper); }
  .tools .where { font-size: 12px; margin-left: 4px; }
  .tools form { margin-left: auto; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .tools input { width: 160px; }
  .message { font-size: 12px; min-height: 1.4em; padding: 0 12px 8px; }

  /* sheets: each machine card has four, picked with buttons like the tool bar's */
  .sheets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .sheets button {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 2px 10px; cursor: pointer; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .sheets button[aria-current="true"] { background: var(--ink); color: var(--paper); }
  .pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 10px; }
  .pick label { display: grid; gap: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; min-width: 0; }
  .caption { font-size: 12px; margin: 6px 0 0; max-width: 70ch; }
  .none { font-family: var(--mono); font-size: 12px; margin: 0; padding: 8px 0; }

  /* diagrams: wide ones scroll inside their own box */
  .diagram { overflow-x: auto; overflow-y: hidden; border: 1px solid var(--ink); background: var(--paper); }
  .diagram svg { display: block; color: var(--ink); }
  .diagram svg path, .legend-sym path { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .diagram svg .rail { stroke-width: 3; }
  .diagram svg .thin { stroke-width: 1; }
  .diagram svg .grid { stroke-width: 1; stroke-dasharray: 1 3; }
  .diagram svg .z { stroke-dasharray: 3 2; }
  .diagram svg .solid { fill: currentColor; stroke: none; }
  .diagram svg text, .legend-sym text { font: 10px var(--mono); fill: currentColor; stroke: none; }
  .diagram svg text.d, .legend-sym text.d { font-size: 9px; }
  .diagram svg text.b { font-weight: bold; }
  .diagram svg text.c { font: italic 10px var(--body); }
  .legend-sym { display: block; color: var(--ink); }
  .run-trace + .run-trace { margin-top: 16px; }
  .run-trace h3 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .twin-trace { margin: 10px 0 0 12px; padding-left: 10px; border-left: 3px double var(--ink); }
  .twin-trace h4 { font-size: 12px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .twin-trace .caption { margin: 0 0 6px; }
  .twin-trace .notes { margin-top: 6px; }

  /* datasheet */
  .ds-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
  .ds-head .part { font-family: var(--mono); font-size: 12px; }
  table.ds td.num { text-align: right; font-family: var(--mono); }
  .foot { font-size: 11px; margin: 6px 0 0; }

  /* the drafting title block, at the foot of every machine sheet */
  .titleblock {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-top: 20px; border: 2px solid var(--ink); font: 11px/1.3 var(--mono);
  }
  .titleblock > div { border: 1px solid var(--ink); padding: 4px 6px; min-width: 0; overflow-wrap: anywhere; }
  .titleblock .k { display: block; font: 9px/1.3 var(--body); letter-spacing: 0.12em; text-transform: uppercase; }
  .titleblock .wide { grid-column: span 2; font-weight: bold; }

  .empty { max-width: 56ch; }
  .empty code { font-family: var(--mono); font-size: 12px; }
  @media (max-width: 520px) {
    .card > .inner { padding: 14px; }
    .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tools form { margin-left: 0; width: 100%; }
    .tools input { flex: 1; width: auto; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><span class="box" aria-hidden="true"></span><span class="label" id="title"></span></div>
  <main class="card" id="card" tabindex="-1"></main>
  <div class="tools">
    <button type="button" id="prev" aria-label="Previous card"></button>
    <button type="button" id="home" aria-label="Home card"></button>
    <button type="button" id="next" aria-label="Next card"></button>
    <span class="where" id="where"></span>
    <form id="find" role="search">
      <input type="search" id="find-text" placeholder="Find" aria-label="Find in the stack">
    </form>
  </div>
  <div class="message" id="message" role="status"></div>
</div>

<script id="shop-data" type="application/json">__MACHINE_SHOP_DATA__</script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------

let DATA = null;
try { DATA = JSON.parse(document.getElementById("shop-data").textContent); } catch (e) { DATA = null; }
const MACHINES = DATA ? DATA.machines : [];
const SETS = DATA ? DATA.results.map((s, i) => ({ ...s, id: i })) : [];
const ISSUE_URL = "https://github.com/kruxia/kruxiaflow/issues/";
/** Every issue a card's trap names: `issues: [29, 37]`, or `issue: 25` */
function trapIssues(t) {
  if (!t) return [];
  if (Array.isArray(t.issues) && t.issues.length) return t.issues;
  return t.issue != null ? [t.issue] : [];
}
/** A run's trap issues: `trap_issues`, or the single `trap` of older results files */
function runIssues(r) {
  if (!r) return [];
  if (Array.isArray(r.trap_issues) && r.trap_issues.length) return r.trap_issues;
  return r.trap ? [r.trap] : [];
}
/** #29, #37 as plain text */
function issueText(ns, sep) { return ns.map(n => `#${n}`).join(sep); }
/** Each issue as a link to it */
function issueLinks(ns) {
  return ns.map(n => `<a href="${ISSUE_URL}${encodeURIComponent(n)}" target="_blank" rel="noopener">#${esc(n)}</a>`).join(", ");
}

const RESULT_TEXT = { works: "Works", broken: "Broken", known_broken: "Known broken", fixed: "Fixed" };
const RESULT_RANK = { broken: 3, known_broken: 2, fixed: 1, works: 0 };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso || "";
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function setName(s) {
  const twins = SETS.filter(o => o.tree.label === s.tree.label && o.mode === s.mode).length;
  return `${s.tree.label} · ${s.mode}` + (twins > 1 ? ` · ${when(s.started_at)}` : "");
}
function runIn(set, dir, run) { return set.runs.find(r => r.machine === dir && r.run === run); }
function counts(set) {
  const c = { works: 0, broken: 0, known_broken: 0, fixed: 0 };
  for (const r of set.runs) c[r.result] = (c[r.result] || 0) + 1;
  return c;
}
/** The worst result for a machine in the newest set that ran it */
function latestFor(dir) {
  for (let i = SETS.length - 1; i >= 0; i--) {
    const rs = SETS[i].runs.filter(r => r.machine === dir);
    if (rs.length) return rs.reduce((a, b) => (RESULT_RANK[b.result] > RESULT_RANK[a.result] ? b : a));
  }
  return null;
}
function stamp(r) {
  if (!r) return `<span class="stamp none">not run</span>`;
  const issues = runIssues(r);
  const text = esc(RESULT_TEXT[r.result] || r.result) + (issues.length ? ` ${issueText(issues, " ")}` : "");
  return r.result === "known_broken"
    ? `<span class="stamp known_broken"><span>${text}</span></span>`
    : `<span class="stamp ${esc(r.result)}">${text}</span>`;
}

// Pull the plug: each run's twin, and how it came out
const TWIN_TEXT = { identical: "Identical", different: "Different", hung: "Hung", missed: "Missed" };
const TWIN_MEANS = {
  identical: "the twin came out the same as the uninterrupted run",
  different: "the twin came out differently",
  hung: "the twin never finished, though the uninterrupted run did",
  missed: "the twin finished before the plug was pulled",
};
const TWIN_STAMP = { identical: "", different: "broken", hung: "broken", missed: "none" };
function twinStamp(t) {
  return `<span class="stamp ${TWIN_STAMP[t.outcome] || ""}" title="${esc(TWIN_MEANS[t.outcome] || "")}">Plug: ${esc(TWIN_TEXT[t.outcome] || t.outcome)}</span>`;
}
function secs(n) { return `${Number(n).toFixed(2)} s`; }

// ---------------------------------------------------------------------------
// Pixel type: a 5×7 bitmap face drawn for this page
// ---------------------------------------------------------------------------

const FONT = {
  A: "01110 10001 10001 11111 10001 10001 10001", B: "11110 10001 10001 11110 10001 10001 11110",
  C: "01110 10001 10000 10000 10000 10001 01110", D: "11100 10010 10001 10001 10001 10010 11100",
  E: "11111 10000 10000 11110 10000 10000 11111", F: "11111 10000 10000 11110 10000 10000 10000",
  G: "01110 10001 10000 10111 10001 10001 01111", H: "10001 10001 10001 11111 10001 10001 10001",
  I: "111 010 010 010 010 010 111", J: "00111 00010 00010 00010 00010 10010 01100",
  K: "10001 10010 10100 11000 10100 10010 10001", L: "10000 10000 10000 10000 10000 10000 11111",
  M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 10001 11001 10101 10011 10001 10001",
  O: "01110 10001 10001 10001 10001 10001 01110", P: "11110 10001 10001 11110 10000 10000 10000",
  Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
  S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100",
  U: "10001 10001 10001 10001 10001 10001 01110", V: "10001 10001 10001 10001 10001 01010 00100",
  W: "10001 10001 10001 10101 10101 10101 01010", X: "10001 10001 01010 00100 01010 10001 10001",
  Y: "10001 10001 10001 01010 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
  0: "01110 10001 10011 10101 11001 10001 01110", 1: "010 110 010 010 010 010 111",
  2: "01110 10001 00001 00010 00100 01000 11111", 3: "11111 00010 00100 00010 00001 10001 01110",
  4: "00010 00110 01010 10010 11111 00010 00010", 5: "11111 10000 11110 00001 00001 10001 01110",
  6: "00110 01000 10000 11110 10001 10001 01110", 7: "11111 00001 00010 00100 01000 01000 01000",
  8: "01110 10001 10001 01110 10001 10001 01110", 9: "01110 10001 10001 01111 00001 00010 01100",
  " ": "000 000 000 000 000 000 000", "#": "01010 01010 11111 01010 11111 01010 01010",
  ".": "00 00 00 00 00 11 11", ":": "00 11 11 00 11 11 00", ",": "00 00 00 00 11 01 10",
  "-": "0000 0000 0000 1111 0000 0000 0000", "'": "1 1 0 0 0 0 0", "/": "00000 00001 00010 00100 01000 10000 00000",
  "(": "001 010 100 100 100 010 001", ")": "100 010 001 001 001 010 100",
  "?": "01110 10001 00001 00010 00100 00000 00100", "!": "1 1 1 1 1 0 1",
  "+": "00000 00100 00100 11111 00100 00100 00000",
  "<": "0001 0011 0111 1111 0111 0011 0001", ">": "1000 1100 1110 1111 1110 1100 1000",
  "^": "0001000 0010100 0100010 1111111 0100010 0101010 0111110",
};
function pixelText(text, scale = 2) {
  const s = String(text).toUpperCase();
  let x = 0, d = "";
  for (const ch of s) {
    const rows = (FONT[ch] || FONT["?"]).split(" ");
    rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) if (r[i] === "1") d += `M${x + i} ${y}h1v1h-1z`; });
    x += rows[0].length + 1;
  }
  const w = Math.max(x - 1, 1);
  return `<svg class="px" viewBox="0 0 ${w} 7" width="${w * scale}" height="${7 * scale}" role="img" aria-label="${esc(text)}" shape-rendering="crispEdges"><path d="${d}" fill="currentColor"/></svg>`;
}

// ---------------------------------------------------------------------------
// Pictures: 32×32, one per machine, drawn for this page. A machine without
// one gets the gear.
// ---------------------------------------------------------------------------

const PICTURES = {
  "domino-run": [
    "................................", "................................", "................................", "................................",
    "................................", "................................", "................................", ".........................#......",
    "........................#...#...", ".......................#...#....", "..........................#.....", "................................",
    "..#####..#####..................", "..#...#..#...#........###.......", "..#...#..#...#........#..##.....", "..#.#.#..#.#.#.......#....#.....",
    "..#...#..#...#.......#...#......", "..#...#..#...#......##...#......", "..#...#..#...#......#...#.......", "..#.#.#..#.#.#......#...#.......",
    "..#...#..#...#.....#....#.......", "..#...#..#...#.....##..#........", "..#...#..#...#.....#...#........", "..#.#.#..#.#.#....#...#.########",
    "..#...#..#...#....#...#.#.#..#.#", "..#...#..#...#...#...#..#......#", "..#####..#####...#####..########", "################################",
    "................................", "................................", "................................", "................................",
  ],
  "prism-and-funnel": [
    "................................", "................................", "................................", "................................",
    "................................", "................................", "................................", "........................#.......",
    "........................##......", "........................##......", "...........#..........###.#.....", "...........#.........#..#..#....",
    "..........#.#......##...#...#...", "..........#.#.....#.....#...#...", ".........#...#..##......#....#..", ".........#...#.#........#....#..",
    "........#.....#.........#....#..", "#######.#.....#.....#####....###", "........#.....#.####....#....#..", ".......#.......#........#....#..",
    ".......#.......#........#....#..", "......#........##.......#...#...", "......#.........###.....#...#...", ".....#...........#.##...#..#....",
    ".....#############...##.#.#.....", ".......................###......", "........................##......", "........................#.......",
    "................................", "................................", "................................", "................................",
  ],
  "railway-switch": [
    "................................", "................................", "................................", "...#...#.............#...#......",
    "....#...#...........#...#.......", "....#...#...........#...#.......", ".....#...#.........#...#........", ".....#...#.........#...#........",
    "......#...#.......#...#.........", "......#...#.......#...#.........", ".......#...#.....#...#..........", ".......#...#.....#...#..........",

// ---------------------------------------------------------------------------
// Sheets for engineers: ladder logic, timing diagrams, a datasheet, and a
// drafting title block. The runner works out the rungs, pins and ratings
// from workflow.yaml (machine_shop_stack.rs); this page draws them.

const SHEETS = [
  { id: "card", name: "Card" },
  { id: "datasheet", name: "Datasheet" },
  { id: "ladder", name: "Ladder" },
  { id: "timing", name: "Timing" },
];
let sheet = "card";
/** The result set the sheets show: null picks the newest that ran the machine */
let chosenSet = null;
/** The run the datasheet's timing diagram shows, per machine */
const chosenRun = {};

function setsFor(m) { return SETS.filter(s => s.runs.some(r => r.machine === m.dir)); }
function setFor(m) {
  const sets = setsFor(m);
  if (chosenSet !== null) { const s = sets.find(x => x.id === chosenSet); if (s) return s; }
  return sets.length ? sets[sets.length - 1] : null;
}
function setPicker(m, s) {
  const sets = setsFor(m);

  const opts = sets.map(x => `<option value="${x.id}"${s && x.id === s.id ? " selected" : ""}>${esc(setName(x))}${x.runs.some(r => r.machine === m.dir && Array.isArray(r.timeline)) ? "" : " (no timeline)"}</option>`).join("");
  return `<label for="sheet-set">Result set<select id="sheet-set">${opts}</select></label>`;
}

function sheetTabs(m) {

function isoDay(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toISOString().slice(0, 10); }

/** A drafting title block: drawing number, revision, drawn and checked by, date */
function titleBlock(m) {

// --- SVG helpers -----------------------------------------------------------

const CH = 6.2;   // width of a 10px monospace character
const LH = 11;    // label line height
let svgSeq = 0;
function txt(x, y, s, cls, anchor) {
  return `<text x="${+x.toFixed(1)}" y="${+y.toFixed(1)}" text-anchor="${anchor || "middle"}"${cls ? ` class="${cls}"` : ""}>${esc(s)}</text>`;
}
function wrap(s, max) {
  const lines = []; let cur = "";
  for (let w of String(s).split(/\s+/)) {
    while (w.length > max) { if (cur) { lines.push(cur); cur = ""; } lines.push(w.slice(0, max)); w = w.slice(max); }
    if (!w) continue;
    if (!cur) cur = w; else if ((cur + " " + w).length <= max) cur += " " + w; else { lines.push(cur); cur = w; }
  }
  if (cur || !lines.length) lines.push(cur);
  return lines;
}
function textW(lines) { return Math.max(0, ...lines.map(l => l.length)) * CH; }

// --- Ladder ----------------------------------------------------------------

const PP = 10;  // the stub at each end of a parallel branch
const BG = 6;   // the gap between parallel branches
const ACTION_TEXT = { run: "run", continue: "run, no signal", skip: "skip", fail: "fail" };

/** A drawable symbol for one rung element: a contact, coil, box or wire */
function symbol(el) {
  switch (el.type) {
    case "contact": return { kind: "contact", tag: [el.step], desc: el.state };
    case "condition": return { kind: "contact", tag: wrap(el.expr, 26), desc: "condition", mark: "cond" };
    case "first_round": return { kind: "contact", tag: ["1ST"], desc: "first round" };
    case "seal_in": return { kind: "contact", tag: [el.step], desc: "seal-in", mark: "seal" };
    case "shunt": return { kind: "wire", tag: [], desc: "shunt" };
    case "counter": return { kind: "box", title: "CTU", pv: `PV ${el.preset}`, tag: [`${el.step}.CTU`], desc: el.default ? "engine default" : "iteration_limit", q: "/Q" };
    case "delay": return { kind: "box", title: "TON", pv: `PT ${el.preset}`, tag: [`${el.step}.DLY`], desc: "delay", q: "Q" };
    case "interrupt": return { kind: "contact", tag: [`SIGNAL ${el.event}`], desc: "interrupt", mark: "int" };
    case "timer_done": return { kind: "contact", tag: [`${el.step}.TON`], desc: "done (DN)" };
    case "coil": return { kind: "coil", tag: [el.step], desc: ACTION_TEXT[el.action] || el.action };
    case "timer": return { kind: "box", title: "TON", pv: `PT ${el.seconds} s`, tag: [`${el.step}.TON`], desc: `waits for ${el.event}` };
    default: return { kind: "wire", tag: [], desc: el.type || "" };
  }
}
function measureSym(y) {
  const descW = y.desc.length * CH * 0.9 + 10;
  if (y.kind === "box") return { w: Math.max(76, textW(y.tag) + 14, descW), top: 22 + LH * y.tag.length, bot: 32 };
  if (y.kind === "wire") return { w: Math.max(44, descW), top: 8, bot: 24 };
  return { w: Math.max(60, textW(y.tag) + 14, descW), top: 14 + LH * y.tag.length, bot: 24 };
}
function drawSym(y, x, cy, w) {
  const cx = x + w / 2;
  let out = "";
  const tags = (above) => y.tag.map((t, i) => txt(cx, cy - above - LH * (y.tag.length - 1 - i), t)).join("");
  const desc = (below) => y.desc ? txt(cx, cy + below, y.desc, "d") : "";
  if (y.kind === "wire") return `<path d="M${x} ${cy}H${x + w}"/>` + desc(20);
  if (y.kind === "box") {
    const bx = cx - 30;
    out += `<path d="M${x} ${cy}H${bx}M${bx + 60} ${cy}H${x + w}"/><path d="M${bx} ${cy - 16}h60v32h-60z"/>`;
    out += txt(cx, cy - 4, y.title, "b") + txt(cx, cy + 10, y.pv, "d");
    if (y.q) out += txt(bx + 62, cy - 3, y.q, "d", "start");
    return out + tags(22) + desc(28);
  }
  if (y.kind === "coil") {
    out += `<path d="M${x} ${cy}H${cx - 9}M${cx + 9} ${cy}H${x + w}"/>`;
    out += `<path d="M${cx - 4} ${cy - 9}Q${cx - 12} ${cy} ${cx - 4} ${cy + 9}M${cx + 4} ${cy - 9}Q${cx + 12} ${cy} ${cx + 4} ${cy + 9}"/>`;
    return out + tags(14) + desc(21);
  }
  // a normally open contact: ─┤ ├─
  out += `<path d="M${x} ${cy}H${cx - 6}M${cx + 6} ${cy}H${x + w}M${cx - 6} ${cy - 9}V${cy + 9}M${cx + 6} ${cy - 9}V${cy + 9}"/>`;
  if (y.mark === "int") out += `<path class="thin" d="M${cx - 2} ${cy - 8}l3 5h-3l3 5"/>`;
  if (y.mark === "seal") out += `<path class="thin" d="M${cx - 3} ${cy}h6"/>`;
  if (y.mark === "cond") out += txt(cx, cy + 3.5, "?", "d");
  return out + tags(14) + desc(21);
}

function measure(el) {
  if (el.type === "parallel") {
    const bs = el.branches.map(measureSeries);
    let bot = bs[0].bot;
    for (let i = 1; i < bs.length; i++) bot += BG + bs[i].top + bs[i].bot;
    return { w: Math.max(...bs.map(b => b.w)) + 2 * PP, top: bs[0].top, bot, bs };
  }
  return measureSym(symbol(el));
}
function measureSeries(list) {
  if (!list.length) return { w: 24, top: 8, bot: 8 };
  let w = 0, top = 0, bot = 0;
  for (const e of list) { const k = measure(e); w += k.w; top = Math.max(top, k.top); bot = Math.max(bot, k.bot); }
  return { w, top, bot };
}
function drawSeries(list, x, cy, w) {
  let out = "", at = x;
  for (const e of list) { const k = measure(e); out += draw(e, at, cy, k); at += k.w; }
  if (at < x + w) out += `<path d="M${at} ${cy}H${x + w}"/>`;
  return out;
}
function draw(el, x, cy, k) {
  if (el.type !== "parallel") return drawSym(symbol(el), x, cy, k.w);
  let out = "", by = cy, last = cy;
  el.branches.forEach((b, i) => {
    if (i) by += k.bs[i - 1].bot + BG + k.bs[i].top;
    last = by;
    out += `<path d="M${x} ${by}H${x + PP}M${x + k.w - PP} ${by}H${x + k.w}"/>`;
    out += drawSeries(b, x + PP, by, k.w - 2 * PP);
  });
  return out + `<path d="M${x} ${cy}V${last}M${x + k.w} ${cy}V${last}"/>`;
}

/** The machine's ladder: one rung per step, between two rails */
function ladderDiagram(m) {
  const rungs = m.ladder || [];
  if (!rungs.length) return `<p class="none">No rungs: the workflow has no steps.</p>`;
  const X0 = 44, GAP = 14;
  const laid = rungs.map(r => {
    const s = measureSeries(r.series);
    const outs = r.outputs.map(o => {
      const c = o.contacts.length ? measureSeries(o.contacts) : { w: 0, top: 0, bot: 0 };
      const e = measureSym(symbol(o.end));
      return { c, e, w: c.w + e.w + 16, top: Math.max(c.top, e.top), bot: Math.max(c.bot, e.bot) };
    });
    let obot = outs[0].bot;
    for (let i = 1; i < outs.length; i++) obot += BG + outs[i].top + outs[i].bot;
    return { r, s, outs, w: s.w + GAP + Math.max(...outs.map(o => o.w)), top: Math.max(s.top, outs[0].top), bot: Math.max(s.bot, obot) };
  });
  const RX = X0 + Math.max(...laid.map(l => l.w)) + 12;
  let y = 8, body = "";
  laid.forEach((l, i) => {
    body += txt(X0 + 6, y + 10, `${l.r.step}: ${l.r.activity || "activity"}`, "c", "start");
    const cy = y + 18 + l.top;
    body += txt(X0 - 8, cy + 3, String(i).padStart(3, "0"), "d", "end");
    body += drawSeries(l.r.series, X0, cy, l.s.w);
    const jx = X0 + l.s.w;
    let oy = cy, lastY = cy;
    l.outs.forEach((o, j) => {
      if (j) oy += l.outs[j - 1].bot + BG + o.top;
      lastY = oy;
      const cs = l.r.outputs[j].contacts;
      if (!j) body += `<path d="M${jx} ${oy}H${jx + GAP}"/>`;
      if (cs.length) body += drawSeries(cs, jx + GAP, oy, o.c.w);
      const ex = RX - o.e.w;
      body += `<path d="M${jx + GAP + o.c.w} ${oy}H${ex}"/>` + drawSym(symbol(l.r.outputs[j].end), ex, oy, o.e.w);
    });
    if (l.outs.length > 1) body += `<path d="M${jx + GAP} ${cy}V${lastY}"/>`;
    y = cy + l.bot + 14;
  });
  const H = y;
  const rails = `<path class="rail" d="M${X0} 4V${H - 4}M${RX} 4V${H - 4}"/>`;
  return `<div class="diagram"><svg viewBox="0 0 ${RX + 8} ${H}" width="${RX + 8}" height="${H}" role="img" aria-label="Ladder diagram of ${esc(m.card.name)}">${rails}${body}</svg></div>`;
}

function ladderSheet(m) {
  return `<div class="field"><h2>Ladder logic</h2>
      <p class="caption">One rung per step, read from <code>workflow.yaml</code>. Contacts in series must all close: each <code>depends_on</code> entry is one, so a fan-in is an AND. Conditions sit on their own branches, in parallel where the engine runs a step when any entry applies. The coil is the step. <a href="#legend">The legend card</a> explains every symbol.</p></div>
    <div class="field">${ladderDiagram(m)}</div>`;
}

// --- Timing ----------------------------------------------------------------

/** One step's trace from its events: levels (H running, Z waiting for a signal, L idle) and marks */
function trace(events) {
  const segs = [], marks = [];
  let level = "L", since = 0;
  const go = (t, lv) => { if (lv === level) return; segs.push({ from: since, to: t, level }); level = lv; since = t; };
  for (const e of events) {
    switch (e.event) {
      case "ActivityScheduled":
        go(e.ms, "H");
        marks.push({ t: e.ms, kind: "start", round: e.round, attempt: e.attempt });
        break;
      case "ActivityWaiting": go(e.ms, "Z"); break;
      case "ActivitySignaled":
        if (e.reason === "timeout") {
          marks.push({ t: e.ms, kind: "timeout", text: e.on_timeout });
          if (e.on_timeout === "skip") go(e.ms, "L");
        } else marks.push({ t: e.ms, kind: "signal" });
        break;
      case "ActivityCompleted": go(e.ms, "L"); break;
      case "ActivityFailed":
        go(e.ms, "L");
        marks.push({ t: e.ms, kind: e.will_retry ? "retry" : "fail", text: e.reason });
        break;
      default: break;
    }
  }
  segs.push({ from: since, to: null, level });
  return { segs, marks };
}

/** A tick spacing near `target` ms: 1, 2 or 5 times a power of ten */
function niceStep(target) {
  const p = Math.pow(10, Math.floor(Math.log10(target)));
  for (const f of [1, 2, 5, 10]) if (f * p >= target) return f * p;
  return 10 * p;
}
function fmtTime(ms, step) {
  if (step >= 1000) return `${(ms / 1000).toFixed(step % 1000 ? (step % 100 ? 2 : 1) : 0)} s`;
  return `${ms.toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : 2)} ms`;
}

/** A run as a logic analyzer shows it: one channel per step, a run line, and an interrupt line for signals.
 *  `plug`, for a twin: `{at, back, down}`, when the plug was pulled and the API answered again, in ms on its timeline */
function timingDiagram(m, r, plug) {
  if (!r) return `<p class="none">This run isn't in the result set.</p>`;
  if (!Array.isArray(r.timeline)) return `<p class="none">No timeline in this result set.</p>`;
  if (!r.timeline.length) return `<p class="none">No events: nothing ran.</p>`;
  const T = r.timeline;
  // A little past the last event, so a level that holds to the end shows it
  const end = Math.max(1, ...T.map(e => e.ms), plug ? plug.back : 0) * 1.04;
  const keys = m.workflow.steps.map(s => s.key);
  for (const e of T) if (e.step && !keys.includes(e.step)) keys.push(e.step);
  const traces = keys.map(k => ({ key: k, ...trace(T.filter(e => e.step === k)) }));
  const waits = (m.pins || []).filter(p => p.kind === "signal");
  const signals = traces.flatMap(t => t.marks.filter(x => x.kind === "signal").map(x => ({ ...x, step: t.key })));

  // Scale: thin pulses get a few pixels each, within reason
  const widths = traces.flatMap(t => t.segs.filter(s => s.level === "H" && s.to !== null).map(s => s.to - s.from)).filter(w => w > 0);
  const minW = widths.length ? Math.min(...widths) : end;
  const k = Math.max(440 / end, Math.min(3 / minW, 3000 / end));
  const LW = 110, RW = 100, PW = end * k;
  const X = t => LW + t * k;
  const CHH = 34;
  const id = `dither${++svgSeq}`, hatch = `hatch${svgSeq}`;
  let y = plug ? 26 : 14, body = "";

  const channel = (label, sub, segs, marks, right) => {
    const yc = y + CHH / 2, hi = yc - 9, lo = yc + 9;
    const lv = l => (l === "H" ? hi : l === "L" ? lo : yc);
    let out = txt(8, yc - 1, label, "b", "start") + (sub ? txt(8, yc + 10, sub, "d", "start") : "");
    let prev = null;
    for (const s of segs) {
      const x1 = X(s.from), x2 = s.to === null ? X(end) : Math.max(X(s.to), s.level === "H" ? X(s.from) + 2 : X(s.to));
      if (prev !== null && prev !== s.level) out += `<path d="M${x1} ${lv(prev)}V${lv(s.level)}"/>`;
      if (s.level === "H") out += `<rect x="${x1}" y="${hi}" width="${x2 - x1}" height="${lo - hi}" fill="url(#${id})"/>`;
      out += `<path${s.level === "Z" ? ' class="z"' : ""} d="M${x1} ${lv(s.level)}H${x2}"/>`;
      prev = s.level;
    }
    let free = -Infinity;  // where the last round label ends: a dense train labels what fits
    for (const mk of marks) {
      const x = X(mk.t);
      if (mk.kind === "start" && mk.label && x >= free) { out += txt(x + 1, hi - 3, mk.label, "d", "start"); free = x + mk.label.length * CH * 0.9 + 6; }
      if (mk.kind === "signal") out += `<path class="solid" d="M${x - 4} ${hi - 9}h8l-4 7z"/>`;
      if (mk.kind === "timeout") out += `<path class="thin" d="M${x} ${hi - 4}V${lo + 4}"/>` + txt(x + 2, hi - 3, "T/O", "d", "start");
      if (mk.kind === "fail" || mk.kind === "retry") {
        out += `<path d="M${x - 5} ${yc - 5}l10 10m0 -10l-10 10"/>` + txt(x + 7, lo + 9, mk.kind === "retry" ? "retry" : (mk.text === "SIGNAL_TIMEOUT" ? "T/O fail" : "fail"), "d", "start");
      }
    }
    if (right) out += txt(LW + PW + 10, yc + 3, right, "d", "start");
    body += out;
    y += CHH;
  };

  // Run line: the workflow, from created to completed or failed
  const wf = T.filter(e => !e.step);
  const wsegs = [], wmarks = [];
  { let since = 0, level = "H";
    for (const e of wf) {
      if (e.event === "WorkflowCompleted" || e.event === "WorkflowFailed") {
        wsegs.push({ from: since, to: e.ms, level }); level = "L"; since = e.ms;
        if (e.event === "WorkflowFailed") wmarks.push({ t: e.ms, kind: "fail" });
      }
    }
    wsegs.push({ from: since, to: null, level });
  }
  channel("RUN", "workflow", wsegs, wmarks, r.status);

  // Interrupt line, active low: a dip for each signal the step took
  if (waits.length || signals.length) {
    const isegs = [], imarks = [];
    let since = 0;
    for (const sg of signals) {
      isegs.push({ from: since, to: sg.t, level: "H" });
      isegs.push({ from: sg.t, to: sg.t + 3 / k, level: "L" });
      since = sg.t + 3 / k;
      imarks.push({ t: sg.t, kind: "start", label: sg.step });
    }
    isegs.push({ from: since, to: null, level: "H" });
    channel("/INT", "signals", isegs, imarks, `${signals.length} taken`);
  }

  for (const t of traces) {
    const starts = t.marks.filter(x => x.kind === "start");
    starts.forEach((x, i) => {
      const parts = [];
      if (starts.length > 1) parts.push(`#${x.round != null ? x.round + 1 : i + 1}`);
      if (x.attempt > 1) parts.push(`try ${x.attempt}`);
      x.label = parts.join(" ");
    });
    const st = r.steps && r.steps[t.key];
    channel(t.key, "", t.segs, t.marks, st ? `${st.status} ×${st.runs}` : "");
  }

  // Time axis, with a grid through every channel
  const step = niceStep(end / Math.max(2, PW / 90));
  const top = 10, axis = y + 6;
  let grid = "";
  for (let t = 0; t <= end + 1e-9; t += step) {
    const x = X(t);
    grid += `<path class="grid" d="M${x} ${top}V${axis}"/><path class="thin" d="M${x} ${axis}v5"/>` + txt(x, axis + 16, fmtTime(t, step));
  }
  grid += `<path class="thin" d="M${LW} ${axis}H${LW + PW}"/>`;
  // The engine down: hatched from the plug pulled to the API answering again
  if (plug) {
    const x1 = X(plug.at), x2 = Math.max(X(plug.back), x1 + 2);
    grid += `<rect x="${x1}" y="${top}" width="${x2 - x1}" height="${axis - top}" fill="url(#${hatch})"/>` +
      `<path d="M${x1} ${top}V${axis}"/>` + txt(x1 + 3, top + 9, `PLUG · down ${secs(plug.down)}`, "b", "start");
  }
  const H = axis + 24, W = LW + PW + RW;
  const defs = `<defs><pattern id="${id}" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"/></pattern>` +
    `<pattern id="${hatch}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="5" fill="currentColor"/></pattern></defs>`;
  const label = `Timing diagram of ${m.card.name}, ${r.run}${plug ? `, with the plug pulled at ${plug.at.toFixed(1)} ms` : ""}`;
  return `<div class="diagram"><svg viewBox="0 0 ${W.toFixed(0)} ${H}" width="${W.toFixed(0)}" height="${H}" role="img" aria-label="${esc(label)}">${defs}${grid}${body}</svg></div>`;
}

/** A run's twin, drawn under it: where the plug was pulled, how it came out, and its own timeline */
function twinTrace(m, r) {
  const t = r && r.twin;
  if (!t) return "";
  const p = t.plug;
  let where;
  if (!p) where = "The plug was never pulled: the twin finished first.";
  else if (p.after_event != null) where = `Pulled after event ${p.after_event} of ${p.of_events}; ${p.events_at_plug} ${p.events_at_plug === 1 ? "event was" : "events were"} in when the engine stopped.`;
  else where = `When the plug was pulled, this twin had ${p.events_at_plug} of the uninterrupted run's ${p.of_events} events in.`;
  if (p && p.settled_before) where += " The twin had already finished.";
  const band = p && p.at_ms != null ? { at: p.at_ms, back: p.back_ms, down: p.down_seconds } : null;
  const diagram = Array.isArray(t.timeline)
    ? timingDiagram(m, { run: `${r.run}, twin`, timeline: t.timeline, steps: t.steps, status: t.status }, band)
    : `<p class="none">This result set doesn't record the twin's timeline.</p>`;
  const diffs = t.differences && t.differences.length ? `<ul class="notes">${t.differences.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : "";
  return `<div class="twin-trace"><h4>Its twin ${twinStamp(t)}<span class="secs">${secs(t.seconds)}</span></h4>
    <p class="caption">${esc(where)}</p>${diagram}${diffs}</div>`;
}

function timingSheet(m) {
  const s = setFor(m);
  if (!s) return `<div class="field"><h2>Timing</h2><p>No results yet.</p></div>`;
  const runs = m.card.runs.map(run => {
    const r = runIn(s, m.dir, run.name);
    return `<div class="run-trace"><h3>${esc(run.name)} ${stamp(r)}${r ? `<span class="secs">${Number(r.seconds).toFixed(2)} s</span>` : ""}</h3>${timingDiagram(m, r)}${twinTrace(m, r)}</div>`;
  }).join("");
  const twins = s.runs.some(r => r.twin);
  const shopPull = twins && s.mode === "shop" && s.plug && s.plug.shop_fraction != null
    ? ` In shop mode the twins ran together, and the plug was pulled once for all of them, when they together had ${Math.round(s.plug.shop_fraction * 100)}% of the uninterrupted runs' events in.` : "";
  const plugNote = twins ? ` With the plug pulled, each run's twin is drawn under it: the engine was stopped partway through and restarted on the same database, and the hatched band is the engine down, from the plug pulled to the API answering again.${shopPull}` : "";
  return `<div class="field"><h2>Timing diagrams</h2>
      <div class="pick">${setPicker(m, s)}</div>
      <p class="caption">From the run's events in <code>workflow_events</code>, as the engine timed them; zero is the workflow's <code>created_at</code>. A step's line is high from scheduled to completed or failed, dashed in the middle while it waits for a signal. ▼ is a signal taken, T/O a wait that timed out, ✕ a failed attempt. A loop's rounds are a pulse train, numbered.${esc(plugNote)}</p></div>
    <div class="field">${runs}</div>`;
}

// --- Datasheet -------------------------------------------------------------

function stats(xs) {
  const s = xs.filter(x => Number.isFinite(x)).sort((a, b) => a - b);
  if (!s.length) return null;
  const n = s.length, mid = Math.floor(n / 2);
  return { min: s[0], typ: n % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2, max: s[n - 1], n };
}
/** Durations of a step's levels in a run's timeline: H (scheduled to done) and Z (waiting) */
function levelTimes(r, key, level) {
  if (!r || !Array.isArray(r.timeline)) return [];
  return trace(r.timeline.filter(e => e.step === key)).segs.filter(s => s.level === level && s.to !== null).map(s => s.to - s.from);
}

function pinout(m) {
  const pins = m.pins || [];
  const left = pins.filter(p => p.dir === "in"), right = pins.filter(p => p.dir === "out");
  const n = Math.max(left.length, right.length, 2);
  const name = p => p.kind === "input" ? `INPUT.${p.name}` : p.kind === "secret" ? `SECRET.${p.name}` : p.kind === "signal" ? `/INT ${p.name}` : `${p.step}.${p.name}`;
  const lw = Math.max(40, ...left.map(p => name(p).length * CH)) + 8;
  const rw = Math.max(40, ...right.map(p => name(p).length * CH)) + 8;
  const BW = 120, STUB = 22, PITCH = 22;
  const bx = lw + STUB, H = n * PITCH + 24, W = bx + BW + STUB + rw;
  let out = `<path d="M${bx} 8h${BW}v${H - 16}h-${BW}z"/><path d="M${bx + BW / 2 - 8} 8a8 8 0 0 0 16 0"/>`;
  out += txt(bx + BW / 2, H / 2 - 2, m.drawing || "", "b") + txt(bx + BW / 2, H / 2 + 11, m.workflow.name || "", "d");
  const table = [];
  for (let i = 0; i < n; i++) {
    const yy = 20 + i * PITCH + PITCH / 2;
    const p = left[i];
    const no = i + 1;
    out += `<path d="M${bx - STUB} ${yy}H${bx}"/>` + txt(bx + 4, yy + 3, String(no), "d", "start");
    out += txt(bx - STUB - 4, yy + 3, p ? name(p) : "NC", p ? "" : "d", "end");
    if (p) table.push({ no, p });
  }
  for (let i = 0; i < n; i++) {
    const yy = 20 + (n - 1 - i) * PITCH + PITCH / 2;
    const p = right[i];
    const no = n + i + 1;
    out += `<path d="M${bx + BW} ${yy}H${bx + BW + STUB}"/>` + txt(bx + BW - 4, yy + 3, String(no), "d", "end");
    out += txt(bx + BW + STUB + 4, yy + 3, p ? name(p) : "NC", p ? "" : "d", "start");
    if (p) table.push({ no, p });
  }
  const svg = `<div class="diagram"><svg viewBox="0 0 ${W.toFixed(0)} ${H}" width="${W.toFixed(0)}" height="${H}" role="img" aria-label="Pinout">${out}</svg></div>`;
  const values = key => {
    const seen = [];
    for (const run of m.card.runs) {
      const v = run.input && run.input[key];
      if (v !== undefined) { const j = JSON.stringify(v); if (!seen.includes(j)) seen.push(j); }
    }
    return seen;
  };
  const rows = table.sort((a, b) => a.no - b.no).map(({ no, p }) => {
    const type = { input: "In", signal: "In, interrupt", secret: "Supply", output: "Out" }[p.kind] || p.kind;
    let fn = "";
    if (p.kind === "input") { const v = values(p.name); fn = v.length ? `The workflow's input. Runs give ${v.join(", ")}` : "The workflow's input"; }
    if (p.kind === "signal") fn = `A signal named ${p.name}, taken by ${p.step} while it waits`;
    if (p.kind === "secret") fn = "A secret the orchestrator holds";
    if (p.kind === "output") fn = `Output of ${p.step}, which nothing depends on`;
    return `<tr><td class="num">${no}</td><td><code>${esc(name(p))}</code></td><td>${esc(type)}</td><td>${esc(fn)}</td></tr>`;
  }).join("");
  return svg + `<div class="scroll section"><table class="ds"><thead><tr><th>Pin</th><th>Name</th><th>Type</th><th>Function</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function ratingsTable(m) {
  const rs = m.ratings || [];
  if (!rs.length) return `<p>The workflow sets no limits of its own.</p>`;
  const rows = rs.map(x => `<tr><td>${esc(x.parameter)}</td><td><code>${esc(x.symbol)}</code></td><td class="num">${esc(x.value)}</td><td>${esc(x.unit)}</td><td>${esc(x.note || "")}</td></tr>`).join("");
  return `<div class="scroll"><table class="ds"><thead><tr><th>Parameter</th><th>Symbol</th><th>Value</th><th>Unit</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="foot">Limits the workflow sets. Past one, the engine ends the loop, ends the wait as <code>on_timeout</code> says, stops retrying, or stops on the budget.</p>`;
}

function characteristics(m) {
  const sets = setsFor(m);
  const all = sets.flatMap(s => s.runs.filter(r => r.machine === m.dir && r.status !== "not_deployed"));
  if (!all.length) return `<p>No results yet.</p>`;
  const rows = [];
  const row = (param, sym, st, unit, digits) => {
    if (!st) return;
    const f = v => v.toFixed(digits);
    rows.push(`<tr><td>${esc(param)}</td><td><code>${esc(sym)}</code></td><td class="num">${f(st.min)}</td><td class="num">${f(st.typ)}</td><td class="num">${f(st.max)}</td><td>${esc(unit)}</td><td class="num">${st.n}</td></tr>`);
  };
  m.card.runs.forEach((run, i) => row(`Run time, ${run.name}`, `t(${i + 1})`, stats(all.filter(r => r.run === run.name).map(r => Number(r.seconds))), "s", 2));
  for (const st of m.workflow.steps) {
    row(`Rounds, ${st.key}`, `N(${st.key})`, stats(all.map(r => r.steps && r.steps[st.key] ? Number(r.steps[st.key].runs) : NaN)), "rounds", 0);
  }
  for (const st of m.workflow.steps) {
    row(`Pulse width, ${st.key}`, `tH(${st.key})`, stats(all.flatMap(r => levelTimes(r, st.key, "H"))), "ms", 1);
    row(`Signal wait, ${st.key}`, `tZ(${st.key})`, stats(all.flatMap(r => levelTimes(r, st.key, "Z"))), "ms", 1);
  }
  const timed = all.filter(r => Array.isArray(r.timeline)).length;
  return `<div class="scroll"><table class="ds"><thead><tr><th>Parameter</th><th>Symbol</th><th>Min</th><th>Typ</th><th>Max</th><th>Unit</th><th>N</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    <p class="foot">Over ${all.length} run${all.length === 1 ? "" : "s"} of this machine in ${sets.length} result set${sets.length === 1 ? "" : "s"}; typ is the median, N the samples. Rounds count completions. Pulse widths and waits come from the ${timed} run${timed === 1 ? "" : "s"} with a timeline: a pulse is scheduled to completed or failed, so it includes queueing and any <code>delay</code>.</p>`;
}

function datasheetSheet(m) {
  const c = m.card;
  const s = setFor(m);
  const runName = chosenRun[m.dir] && c.runs.some(r => r.name === chosenRun[m.dir]) ? chosenRun[m.dir] : c.runs[0].name;
  const runOpts = c.runs.map(r => `<option${r.name === runName ? " selected" : ""}>${esc(r.name)}</option>`).join("");
  const r = s ? runIn(s, m.dir, runName) : null;
  return `<div class="ds-head"><div>${pixelText(c.name, 2)}<div class="part">${esc(m.drawing || "")} · ${esc(m.workflow.name || "")}</div></div>
      <div class="part">${esc(c.kind)} machine${c.trap ? ` · trap ${esc(issueText(trapIssues(c.trap), " "))}` : ""}<br>Kruxia Flow machine shop</div></div>
    <div class="field"><h2>Features</h2><ul class="functions">${c.functions.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="field"><h2>Pinout</h2>${pinout(m)}</div>
    <div class="field"><h2>Absolute maximum ratings</h2>${ratingsTable(m)}</div>
    <div class="field"><h2>Characteristics</h2>${characteristics(m)}</div>
    <div class="field"><h2>Timing diagram</h2>
      <div class="pick">${setPicker(m, s)}<label for="sheet-run">Run<select id="sheet-run">${runOpts}</select></label></div>
      ${s ? timingDiagram(m, r) : "<p>No results yet.</p>"}</div>`;
}

// --- Legend ----------------------------------------------------------------

function legendSymbol(el) {
  const k = measure(el);
  const w = k.w + 20, h = k.top + k.bot + 6;
  const body = `<path d="M0 ${k.top + 2}H10"/>` + draw(el, 10, k.top + 2, k) + `<path d="M${10 + k.w} ${k.top + 2}H${w}"/>`;
  return `<svg class="legend-sym" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${body}</svg>`;
}
function legendCard() {
  const rows = [
    [{ type: "contact", step: "dial", state: "completed" }, "Contact", "A <code>depends_on</code> entry with no conditions. Closed once that step has completed. Contacts in series must all close, so a fan-in is an AND."],
    [{ type: "contact", step: "lever", state: "finished" }, "Finished contact", "A <code>depends_on</code> entry with conditions. Closed once that step has finished: completed, failed or skipped. The step waits for every entry to finish before it decides."],
    [{ type: "condition", step: "lever", expr: "lever.echo.track == 'left'" }, "Condition", "A condition on a <code>depends_on</code> entry, labelled with its expression. Several on one entry are in series (AND)."],
    [{ type: "parallel", branches: [[{ type: "condition", step: "a", expr: "a.ok" }], [{ type: "condition", step: "b", expr: "b.ok" }]] }, "Branches in parallel", "Entries with conditions: the engine runs the step when any of them applies, so their conditions are in parallel (OR)."],
    [{ type: "shunt" }, "Shunt", "Beside an unconditional <code>depends_on</code> entry, the conditions on the others don't gate the step. The shunt shows that the OR is always closed."],
    [{ type: "first_round" }, "First round", "Closed only in a loop step's first round: the way into the loop."],
    [{ type: "seal_in", step: "heater" }, "Seal-in", "A loop's back-edge: the <code>depends_on</code> entry that closes the loop. Closed once that step has completed a round, so the coil runs again while its conditions hold. On a self-loop it is the coil's own contact."],
    [{ type: "counter", step: "heater", preset: 10, default: false }, "Counter (CTU)", "Counts a loop step's rounds. Its inverted output opens at the preset: <code>iteration_limit</code>, or the engine's default of 100."],
    [{ type: "delay", step: "butter", preset: "2s" }, "On-delay (TON)", "<code>settings.delay</code>: the step is scheduled once the delay has run."],
    [{ type: "timer", step: "toast", seconds: 2, event: "pop" }, "Signal wait timer (TON)", "<code>wait_for_signal</code>'s <code>timeout_seconds</code>. It times while the step waits."],
    [{ type: "interrupt", event: "pop" }, "Interrupt contact", "Closed by the signal the step waits for. It drives the coil with the signal's data."],
    [{ type: "timer_done", step: "toast" }, "Timer done", "Closed when the wait's time runs out. It drives what <code>on_timeout</code> says: run with no signal (<code>continue</code>), <code>skip</code> or <code>fail</code>."],
    [{ type: "coil", step: "heater", action: "run" }, "Coil", "The step itself. Energized, it is scheduled to run."],
  ].map(([el, name, what]) => `<tr><td>${legendSymbol(el)}</td><th scope="row">${esc(name)}</th><td>${what}</td></tr>`).join("");
  const traceRows = [
    ["High", "The step is scheduled, queued or running: from <code>ActivityScheduled</code> to <code>ActivityCompleted</code> or <code>ActivityFailed</code>. A loop's rounds are a pulse train, numbered #1, #2."],
    ["Dashed, middle", "Waiting for a signal (high impedance): from <code>ActivityWaiting</code> until the signal or the timeout."],
    ["Low", "Idle: not yet scheduled, done, or skipped."],
    ["▼", "A signal taken (<code>ActivitySignaled</code>). The /INT line dips for each one."],
    ["T/O", "A signal wait that timed out; the step then does what <code>on_timeout</code> says."],
    ["✕", "A failed attempt: <em>retry</em> when the engine tries again, <em>fail</em> when it doesn't."],
    ["RUN", "The workflow: high from <code>created_at</code> until <code>WorkflowCompleted</code> or <code>WorkflowFailed</code>."],
    ["PLUG", "On a twin's trace, hatched: the engine down, from the plug pulled to the restarted API answering. The stamp beside the twin says how it came out: identical, different, hung, or missed when it finished first."],
  ].map(([s, what]) => `<tr><th scope="row">${esc(s)}</th><td>${what}</td></tr>`).join("");
  return `${pixelText("Legend", 3)}
    <div class="field section"><h2>Ladder symbols</h2>
      <p class="caption">Each step is a rung between two rails, ending in its coil. Power flows left to right through closed contacts. The rungs follow the engine's dependency rules in <code>docs/conditional-branching.md</code> and <code>docs/loops-guide.md</code>: the drawing is what the workflow should do, and the timing diagrams show what it did.</p>
      <div class="scroll"><table><tbody>${rows}</tbody></table></div></div>
    <div class="field"><h2>Timing diagrams</h2><div class="scroll"><table><tbody>${traceRows}</tbody></table></div></div>
    <div class="field"><h2>Title block</h2><p class="story">Every machine sheet carries one. The drawing number stays with the machine. The revision is the tree and commit of the result set shown, which is the checker; drawn by is the Stack, from the machine's <code>workflow.yaml</code>.</p></div>`;
}

let current = 0;

function machineCard(m) {
  const body = sheet === "datasheet" ? datasheetSheet(m) : sheet === "ladder" ? ladderSheet(m) : sheet === "timing" ? timingSheet(m) : machineFront(m);
  return sheetTabs(m) + body + titleBlock(m);
}

function machineFront(m) {
  const c = m.card;
  const shown = SETS.slice(-4);
  const head = shown.map(s => `<th>${esc(setName(s))}<span class="sub">${esc(s.tree.commit)}</span></th>`).join("");
  const rows = c.runs.map(run => {
    const cells = shown.map(s => {
      const r = runIn(s, m.dir, run.name);
      return `<td>${stamp(r)}${r ? `<span class="secs">${Number(r.seconds).toFixed(2)}s</span>` : ""}</td>`;
    }).join("");
    return `<tr><th scope="row">${esc(run.name)}</th>${cells}</tr>`;
  }).join("");
  const notes = [];
  for (const s of shown) for (const run of c.runs) {
    const r = runIn(s, m.dir, run.name);
    if (r && r.problems && r.problems.length) {
      for (const p of r.problems) notes.push(`<li><b>${esc(setName(s))}</b>, ${esc(run.name)}: ${esc(p)}</li>`);
    }
  }
  const issues = trapIssues(c.trap);
  const trap = issues.length
    ? `<span class="traplabel">Trap · ${issues.length > 1 ? "issues" : "issue"} ${issueLinks(issues)}</span>`

  return `
    <div class="head">
      <div class="frame">${picture(m.dir, 128)}</div>
      <div class="text">
        ${pixelText(c.name, 3)}
        <span class="kind">${esc(c.kind)} machine</span>

      </div>

    ${c.trap ? `<div class="field"><h2>When the bug is there</h2><p class="story">${esc(c.trap.broken_looks_like)}</p></div>` : ""}
    <div class="field"><h2>Engine functions</h2><ul class="functions">${c.functions.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="field"><h2>Runs</h2>
      ${shown.length ? `<div class="scroll"><table><thead><tr><th>Run</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>` : "<p>No results yet.</p>"}
    </div>
    ${notes.length ? `<div class="field"><h2>Notes</h2><ul class="notes">${notes.join("")}</ul></div>` : ""}`;
}

let cmpA = null, cmpB = null;
function compareCard() {
  if (SETS.length < 2) return `${pixelText("Compare", 3)}<div class="field section">Compare needs two results sets. There ${SETS.length === 1 ? "is one" : "are none"}.</div>`;
  if (cmpA === null || cmpB === null) {
    const last = SETS[SETS.length - 1];
    const other = [...SETS].reverse().find(s => s.mode === last.mode && s.tree.label !== last.tree.label);
    cmpB = last.id; cmpA = other ? other.id : SETS[SETS.length - 2].id;
  }
  const opts = sel => SETS.map(s => `<option value="${s.id}"${s.id === sel ? " selected" : ""}>${esc(setName(s))}</option>`).join("");
  const A = SETS[cmpA], B = SETS[cmpB];
  const rows = [];
  for (const m of MACHINES) for (const run of m.card.runs) {
    const a = runIn(A, m.dir, run.name), b = runIn(B, m.dir, run.name);
    if ((a && a.result) !== (b && b.result)) {
      rows.push(`<tr><th scope="row"><a href="#${esc(m.dir)}">${esc(m.card.name)}</a></th><td>${esc(run.name)}</td><td>${stamp(a)}</td><td>${stamp(b)}</td></tr>`);
    }
  }
  return `${pixelText("Compare", 3)}
    <div class="field section"><div class="pickers">
      <label for="cmp-a">From<select id="cmp-a">${opts(cmpA)}</select></label>
      <span class="arrow" aria-hidden="true">→</span>
      <label for="cmp-b">To<select id="cmp-b">${opts(cmpB)}</select></label>
    </div></div>
    <div class="field"><h2>Runs whose result changed</h2>
      ${rows.length
        ? `<div class="scroll"><table><thead><tr><th>Machine</th><th>Run</th><th>${esc(setName(A))}</th><th>${esc(setName(B))}</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : "<p>No run's result changed between these two sets.</p>"}
    </div>`;
}

const cardEl = document.getElementById("card");
function show(i, focus, still) {
  current = (i + CARDS.length) % CARDS.length;
  const id = CARDS[current];
  const m = MACHINES.find(x => x.dir === id);
  cardEl.className = "card" + (m && m.card.trap ? " trap" : "");
  cardEl.innerHTML = `<div class="inner">${id === "home" ? homeCard() : id === "compare" ? compareCard() : id === "legend" ? legendCard() : machineCard(m)}</div>`;
  if (!still) { void cardEl.offsetWidth; cardEl.classList.add("flip"); }
  document.getElementById("where").textContent = `Card ${current + 1} of ${CARDS.length}`;
  const hash = m && sheet !== "card" ? `${id}/${sheet}` : id;
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  if (focus) cardEl.focus({ preventScroll: true });
  const a = document.getElementById("cmp-a"), b = document.getElementById("cmp-b");
  if (a) a.onchange = () => { cmpA = Number(a.value); show(current, false, true); };
  if (b) b.onchange = () => { cmpB = Number(b.value); show(current, false, true); };
  const ss = document.getElementById("sheet-set"), sr = document.getElementById("sheet-run");
  if (ss) ss.onchange = () => { chosenSet = Number(ss.value); show(current, false, true); };
  if (sr && m) sr.onchange = () => { chosenRun[m.dir] = sr.value; show(current, false, true); };
}

/** `#thermostat/ladder` as the card's index, choosing the sheet */
function fromHash() {
  const [id, sh] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (SHEETS.some(x => x.id === sh)) sheet = sh;
  else if (id) sheet = "card";
  return CARDS.indexOf(id);
}

document.getElementById("title").innerHTML = pixelText("Machine shop", 2);
document.getElementById("prev").innerHTML = pixelText("<", 2);
document.getElementById("home").innerHTML = pixelText("^", 2);
document.getElementById("next").innerHTML = pixelText(">", 2);
document.getElementById("prev").onclick = () => show(current - 1, true);
document.getElementById("next").onclick = () => show(current + 1, true);
document.getElementById("home").onclick = () => show(0, true);
cardEl.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) show(Number(go.dataset.go), true);
  const sh = e.target.closest("[data-sheet]");
  if (sh) { sheet = sh.dataset.sheet; show(current, false, true); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea")) return;
  if (e.key === "ArrowRight") show(current + 1);
  else if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === "Home") show(0);
});
window.addEventListener("hashchange", () => {
  const before = sheet;
  const i = fromHash();
  if (i >= 0 && (i !== current || sheet !== before)) show(i);
});

// Find: the next card, after this one, whose words include the text
function words(id) {
  const m = MACHINES.find(x => x.dir === id);
  if (id === "legend") return "legend symbols ladder contact condition shunt seal-in counter CTU TON timer interrupt coil timing title block";
  if (!m) return id;
  const c = m.card;
  return [c.name, c.kind, c.picture, m.drawing || "", ...(c.functions || []), ...c.runs.map(r => r.name),
    ...m.workflow.steps.map(s => s.key), c.trap ? `${issueText(trapIssues(c.trap), " ")} ${c.trap.broken_looks_like}` : ""].join(" ");
}
document.getElementById("find").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("find-text").value.trim().toLowerCase();
  const msg = document.getElementById("message");
  if (!q) { msg.textContent = ""; return; }
  for (let k = 1; k <= CARDS.length; k++) {
    const i = (current + k) % CARDS.length;
    if (words(CARDS[i]).toLowerCase().includes(q)) {
      show(i);
      msg.textContent = `Found “${q}” on ${i === 0 ? "the home card" : CARDS[i] === "compare" ? "the compare card" : CARDS[i] === "legend" ? "the legend card" : MACHINES[i - 1].card.name}.`;
      return;
    }
  }
  msg.textContent = `“${q}” isn't on any card.`;
});

show(Math.max(0, fromHash()), false, true);
</script>
