<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Machine Shop Stack</title>
<!--
  The Stack: the machine shop as a stack of cards, one card per machine,
  in homage to HyperCard (the look, not Apple's artwork, names or fonts).

  For electrical and old-school engineers: each machine card has a
  datasheet, a ladder-logic sheet and a logic-analyzer timing sheet, each
  with a drafting title block, and a legend card explains the symbols.

  The runner fills in the data marker below and writes this page next to
  the results; see machines/README.md. Everything is in this file: no
  network, no build.
-->
<style>
  /* Layout: one card in a window on a dithered desk; a tool bar under it. 1-bit: ink on paper, inverted in dark mode. */
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --page: var(--paper);
    --surface: var(--paper);
    --border: var(--ink);
    --body: Geneva, Verdana, "DejaVu Sans", sans-serif;
    --mono: Monaco, Menlo, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #000000; --ink: #ffffff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #000000; --ink: #ffffff; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.45 var(--body);
    color: var(--ink);
    /* the desk: a 25% dither */
    background:
      repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 100%) 0 0 / 4px 4px,
      var(--paper);
    background-color: var(--paper);
    min-height: 100vh;
    padding-block: 24px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .px { display: inline-block; vertical-align: middle; max-width: 100%; height: auto; }

  .window {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .titlebar {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    height: 26px;
    border-bottom: 2px solid var(--ink);
    background:
      repeating-linear-gradient(to bottom, var(--ink) 0 1px, var(--paper) 1px 3px) 0 4px / 100% 18px no-repeat,
      var(--paper);
  }
  .titlebar .label { background: var(--paper); padding: 0 10px; line-height: 0; }
  .titlebar .box {
    position: absolute; left: 10px; top: 5px; width: 13px; height: 13px;
    border: 1px solid var(--ink); background: var(--paper);
  }

  .card { position: relative; min-height: 420px; }
  .card > .inner { padding: 20px; background: var(--paper); min-height: inherit; }
  /* a trap card: a dithered frame, so traps stand out as you flip */
  .card.trap { padding: 10px; background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 2px 2px; }
  .card.trap > .inner { border: 2px solid var(--ink); min-height: 400px; }
  @media (prefers-reduced-motion: no-preference) {
    .card.flip { animation: dissolve 240ms steps(4) both; }
  }
  @keyframes dissolve { from { opacity: 0.35; } to { opacity: 1; } }

  .head { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .frame { border: 2px solid var(--ink); padding: 4px; line-height: 0; background: var(--paper); color: var(--ink); }
  .picture { display: block; image-rendering: pixelated; }
  .head .text { flex: 1 1 260px; min-width: 0; display: grid; gap: 8px; }
  .kind { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .traplabel {
    display: inline-block; justify-self: start;
    background: var(--ink); color: var(--paper);
    padding: 2px 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none;
  }
  .traplabel a { color: inherit; text-decoration: none; }
  .traplabel a:hover { text-decoration: underline; }

  /* a "shadow" field, as HyperCard drew them */
  .field {
    border: 1px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    padding: 8px 10px;
    background: var(--paper);
    min-width: 0;
  }
  .field + .field, .section { margin-top: 18px; }
  h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 6px; font-weight: bold; }
  .story { margin: 0; max-width: 62ch; }
  ul.functions { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  ul.functions li { padding-left: 18px; position: relative; }
  ul.functions li::before {
    content: ""; position: absolute; left: 2px; top: 0.45em; width: 7px; height: 7px; border: 1px solid var(--ink);
  }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: bold; }
  th .sub { display: block; font-weight: normal; text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 11px; }
  td .secs { display: block; font-size: 11px; margin-top: 3px; font-family: var(--mono); }

  /* rubber stamps */
  .stamp {
    display: inline-block; white-space: nowrap;
    padding: 1px 6px; border: 2px solid var(--ink);
    font: bold 11px/1.4 var(--body); letter-spacing: 0.08em; text-transform: uppercase;
    transform: rotate(-2deg);
  }
  .stamp.broken { background: var(--ink); color: var(--paper); }
  .stamp.known_broken {
    background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 2px 2px;
  }
  .stamp.known_broken span { background: var(--paper); padding: 0 3px; }
  .stamp.fixed { border-style: double; border-width: 4px; padding: 0 5px; }
  .stamp.none { border-style: dotted; font-weight: normal; transform: none; }

  .notes { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; }
  .notes li + li { margin-top: 3px; }

  /* home card */
  .hero { display: grid; gap: 6px; margin-bottom: 18px; }
  .hero p { margin: 0; max-width: 60ch; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tile { display: grid; gap: 4px; }
  .tile .name { font-weight: bold; }
  .tile .meta { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  .tile .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .mbutton {
    display: grid; justify-items: center; gap: 6px; padding: 10px 6px;
    background: var(--paper); border: 1px solid transparent; cursor: pointer; text-align: center;
  }
  .mbutton:hover, .mbutton:focus-visible { border-color: var(--ink); }
  .mbutton:active { background: var(--ink); color: var(--paper); }

  /* compare card */
  .pickers { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .pickers label { display: grid; gap: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  select, input[type="search"] {
    background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 4px 6px; max-width: 100%;
  }
  .arrow { font-family: var(--mono); padding: 0 6px; }

  /* tool bar */
  .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border-top: 2px solid var(--ink); padding: 8px 12px;
  }
  .tools button {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 3px 10px; line-height: 0; cursor: pointer; min-height: 30px;
  }
  .tools button:active { background: var(--ink); color: var(--paper); }
  .tools .where { font-size: 12px; margin-left: 4px; }
  .tools form { margin-left: auto; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .tools input { width: 160px; }
  .message { font-size: 12px; min-height: 1.4em; padding: 0 12px 8px; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* terms: marked when "Explain terms" (?) is on; each opens a card, and the legend card lists them all */
  .term { text-decoration: underline dotted var(--ink); text-underline-offset: 3px; cursor: help; }
  .term:hover, .term:focus-visible { background: var(--ink); color: var(--paper); text-decoration: none; outline: none; }
  .term:hover code, .term:focus-visible code { color: var(--paper); }
  .tip { position: absolute; z-index: 30; box-sizing: border-box; padding: 8px 10px; font: 12px/1.45 var(--body);
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .tip p { margin: 4px 0 0; }
  .tip p.head { margin: 0; font-family: var(--mono); }
  .tip .k, .glossary h3 { font: bold 10px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
  .tip .k { margin-left: 8px; }
  .tip .an, .glossary .an { font-style: italic; }
  .tip a, .glossary a { color: var(--ink); }
  .glossary h3 { margin: 12px 0 4px; }
  .glossary dl { margin: 0; display: grid; grid-template-columns: minmax(0, 10rem) minmax(0, 1fr); gap: 4px 12px; font-size: 12px; }
  .glossary dt { font-weight: bold; }
  .glossary dd { margin: 0; }
  @media (max-width: 560px) { .glossary dl { grid-template-columns: minmax(0, 1fr); } .glossary dd { margin-bottom: 6px; } }

  /* sheets: each machine card has five, picked with buttons like the tool bar's */
  .sheets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .sheets button {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 2px 10px; cursor: pointer; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .sheets button[aria-current="true"] { background: var(--ink); color: var(--paper); }
  .pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 10px; }
  .pick label { display: grid; gap: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; min-width: 0; }
  .caption { font-size: 12px; margin: 6px 0 0; max-width: 70ch; }
  .none { font-family: var(--mono); font-size: 12px; margin: 0; padding: 8px 0; }

  /* diagrams: wide ones scroll inside their own box */
  .diagram { overflow-x: auto; overflow-y: hidden; border: 1px solid var(--ink); background: var(--paper); }
  .diagram svg { display: block; color: var(--ink); }
  .diagram svg path, .legend-sym path { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .diagram svg .rail { stroke-width: 3; }
  .diagram svg .thin { stroke-width: 1; }
  .diagram svg .grid { stroke-width: 1; stroke-dasharray: 1 3; }
  .diagram svg .z { stroke-dasharray: 3 2; }
  .diagram svg .solid { fill: currentColor; stroke: none; }
  .diagram svg text, .legend-sym text { font: 10px var(--mono); fill: currentColor; stroke: none; }
  .diagram svg text.d, .legend-sym text.d { font-size: 9px; }
  .diagram svg text.b { font-weight: bold; }
  .diagram svg text.c { font: italic 10px var(--body); }
  .legend-sym { display: block; color: var(--ink); }
  .run-trace + .run-trace { margin-top: 16px; }
  .run-trace h3 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .diagram svg .hit { fill: transparent; stroke: none; }
  .diagram svg .src-link { cursor: pointer; }
  .diagram svg .src-link:hover .hit, .diagram svg .src-link:focus-visible .hit { fill: url(#src-dots); }
  .diagram svg .src-link:focus { outline: none; }
  dialog.src { max-width: min(92vw, 760px); width: 100%; padding: 0; border: 3px double var(--ink); background: var(--paper); color: var(--ink); }
  dialog.src::backdrop { background: color-mix(in srgb, var(--ink) 35%, transparent); }
  dialog.src header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 2px solid var(--ink); font: bold 12px var(--mono); }
  dialog.src header button { font: bold 12px var(--body); border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 2px 10px; cursor: pointer; }
  dialog.src pre { margin: 0; padding: 10px 12px; max-height: 70vh; overflow: auto; position: relative; font: 12px/1.5 var(--mono); }
  dialog.src pre code { display: inline-block; min-width: 100%; }
  dialog.src .ln { display: block; padding: 0 6px; margin: 0 -6px; }
  dialog.src .ln.hl { background: var(--ink); color: var(--paper); }
  dialog.src header .acts { display: flex; gap: 6px; }
  /* the code sheet: the machine's whole workflow.yaml, one block per activity */
  pre.code { position: relative; margin: 0; padding: 10px 12px; max-height: 75vh; overflow: auto; border: 1px solid var(--ink); background: var(--paper); font: 12px/1.5 var(--mono); tab-size: 2; }
  pre.code code { display: inline-block; min-width: 100%; }
  pre.code .ln { display: block; padding: 0 6px; margin: 0 -6px; }
  pre.code .act { display: block; cursor: pointer; }
  pre.code .act:hover .ln { box-shadow: inset 3px 0 var(--ink); }
  pre.code .act.hl .ln { background: var(--ink); color: var(--paper); }
  .twin-trace { margin: 10px 0 0 12px; padding-left: 10px; border-left: 3px double var(--ink); }
  .twin-trace h4 { font-size: 12px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .twin-trace .caption { margin: 0 0 6px; }
  .twin-trace .notes { margin-top: 6px; }

  /* datasheet */
  .ds-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
  .ds-head .part { font-family: var(--mono); font-size: 12px; }
  table.ds td.num { text-align: right; font-family: var(--mono); }
  .foot { font-size: 11px; margin: 6px 0 0; }

  /* the drafting title block, at the foot of every machine sheet */
  .titleblock {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-top: 20px; border: 2px solid var(--ink); font: 11px/1.3 var(--mono);
  }
  .titleblock > div { border: 1px solid var(--ink); padding: 4px 6px; min-width: 0; overflow-wrap: anywhere; }
  .titleblock .k { display: block; font: 9px/1.3 var(--body); letter-spacing: 0.12em; text-transform: uppercase; }
  .titleblock .wide { grid-column: span 2; font-weight: bold; }

  .empty { max-width: 56ch; }
  .empty code { font-family: var(--mono); font-size: 12px; }
  @media (max-width: 520px) {
    .card > .inner { padding: 14px; }
    .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tools form { margin-left: 0; width: 100%; }
    .tools input { flex: 1; width: auto; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><span class="box" aria-hidden="true"></span><span class="label" id="title"></span></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="src-dots" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="currentColor"/></pattern></defs></svg>
  <main class="card" id="card" tabindex="-1"></main>
  <div class="tools">
    <button type="button" id="prev" aria-label="Previous card"></button>
    <button type="button" id="home" aria-label="Home card"></button>
    <button type="button" id="next" aria-label="Next card"></button>
    <button type="button" id="terms" aria-pressed="false" aria-label="Explain terms" title="Explain terms"></button>
    <span class="where" id="where"></span>
    <form id="find" role="search">
      <input type="search" id="find-text" placeholder="Find" aria-label="Find in the stack">
    </form>
  </div>
  <div class="message" id="message" role="status"></div>
</div>

<script id="shop-data" type="application/json">{"machines":[{"card":{"edge":"Two-person sign-off on a pharmacy's controlled-drugs cabinet: two staff approve, in either order, and it opens once both have. If one never approves, the opening fails instead of going ahead on one key.\n","functions":["two wait_for_signal steps in parallel branches, waiting at once for the same event_name","a signal ends only the wait of the step it names, whichever is signaled first","a join of two waiting branches and a plain one waits for all three and runs once","on_timeout: fail in one branch, while the other was signaled: the join is skipped and the workflow fails"],"kind":"compound","name":"Bank vault","picture":"Dual control: the manager and the teller each hold a key, and the vault door opens only when both have turned theirs, in either order, while the guard logs the opening. If the teller never comes, the teller's key is never turned, the door stays shut, and the opening fails.\n","runs":[{"expect":{"outputs":[{"equals":{"log":"opening Vault A","manager":"Mrs Okafor","opened":"Vault A","teller":"Mr Lind"},"output":"echo","step":"vault_door"}],"status":"completed","steps":{"arrive":{"runs":1,"status":"completed"},"log_entry":{"runs":1,"status":"completed"},"manager_key":{"runs":1,"status":"completed"},"teller_key":{"runs":1,"status":"completed"},"vault_door":{"runs":1,"status":"completed"}}},"input":{"vault":"Vault A"},"name":"manager first, then teller","signals":[{"data":{"name":"Mrs Okafor"},"event":"turn","step":"manager_key"},{"data":{"name":"Mr Lind"},"event":"turn","step":"teller_key"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"log":"opening Vault B","manager":"Mrs Okafor","opened":"Vault B","teller":"Mr Lind"},"output":"echo","step":"vault_door"}],"status":"completed","steps":{"arrive":{"runs":1,"status":"completed"},"log_entry":{"runs":1,"status":"completed"},"manager_key":{"runs":1,"status":"completed"},"teller_key":{"runs":1,"status":"completed"},"vault_door":{"runs":1,"status":"completed"}}},"input":{"vault":"Vault B"},"name":"teller first, then manager","signals":[{"data":{"name":"Mr Lind"},"event":"turn","step":"teller_key"},{"data":{"name":"Mrs Okafor"},"event":"turn","step":"manager_key"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"turned_by":"Mrs Okafor"},"output":"echo","step":"manager_key"}],"status":"failed","steps":{"arrive":{"runs":1,"status":"completed"},"log_entry":{"runs":1,"status":"completed"},"manager_key":{"runs":1,"status":"completed"},"teller_key":{"runs":0,"status":"failed"},"vault_door":{"runs":0,"status":"skipped"}}},"input":{"vault":"Vault C"},"name":"the teller never comes","signals":[{"data":{"name":"Mrs Okafor"},"event":"turn","step":"manager_key"}],"timeout_seconds":10}],"trap":{"broken_looks_like":"Before #37's fix, the keys' {{SIGNAL.name}} is undefined when they become ready, so neither waits. On main that template error lands on arrive, which is marked failed although it ran (#19); both keys and the log are skipped, the door stays not_scheduled, and the workflow stays running. Before #29's fix, each key fails as soon as it's turned.\n","issues":[29,37]}},"dir":"bank-vault","drawing":"MS-45986","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"arrive","type":"coil"}}],"series":[],"step":"arrive"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"turn","seconds":3,"step":"manager_key","type":"timer"}},{"contacts":[{"event":"turn","type":"interrupt"}],"end":{"action":"run","step":"manager_key","type":"coil"}},{"contacts":[{"step":"manager_key","type":"timer_done"}],"end":{"action":"fail","step":"manager_key","type":"coil"}}],"series":[{"state":"completed","step":"arrive","type":"contact"}],"step":"manager_key"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"turn","seconds":3,"step":"teller_key","type":"timer"}},{"contacts":[{"event":"turn","type":"interrupt"}],"end":{"action":"run","step":"teller_key","type":"coil"}},{"contacts":[{"step":"teller_key","type":"timer_done"}],"end":{"action":"fail","step":"teller_key","type":"coil"}}],"series":[{"state":"completed","step":"arrive","type":"contact"}],"step":"teller_key"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"log_entry","type":"coil"}}],"series":[{"state":"completed","step":"arrive","type":"contact"}],"step":"log_entry"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"vault_door","type":"coil"}}],"series":[{"state":"completed","step":"manager_key","type":"contact"},{"state":"completed","step":"teller_key","type":"contact"},{"state":"completed","step":"log_entry","type":"contact"}],"step":"vault_door"}],"pins":[{"dir":"in","kind":"input","name":"vault"},{"dir":"in","kind":"signal","name":"turn","step":"manager_key"},{"dir":"in","kind":"signal","name":"turn","step":"teller_key"},{"dir":"out","kind":"output","name":"echo","step":"vault_door"}],"ratings":[{"note":"on_timeout: fail","parameter":"Signal wait, manager_key (turn)","symbol":"tW(manager_key)","unit":"s","value":3},{"note":"on_timeout: fail","parameter":"Signal wait, teller_key (turn)","symbol":"tW(teller_key)","unit":"s","value":3}],"workflow":{"name":"machine_bank_vault","source":"# Bank vault: dual control. The manager and the teller each hold a key, and\n# the vault door opens only when both have turned theirs; meanwhile the\n# guard writes the opening in the log. The two keys are turned in either\n# order. If the teller never comes, their key's wait times out and fails,\n# and the door stays shut.\n#\n# manager_key and teller_key wait in parallel branches, for the same\n# event_name: a signal names its step, so it ends only that step's wait.\n# vault_door depends on both keys and the log with no conditions, so it\n# waits for all three and runs once.\nname: machine_bank_vault\n\nactivities:\n  - key: arrive\n    worker: std\n    activity_name: echo\n    parameters:\n      vault: \"{{ INPUT.vault }}\"\n    outputs:\n      - echo\n\n  - key: manager_key\n    worker: std\n    activity_name: echo\n    parameters:\n      turned_by: \"{{ SIGNAL.name }}\"\n    settings:\n      wait_for_signal:\n        event_name: turn\n        timeout_seconds: 3\n        on_timeout: fail\n    outputs:\n      - echo\n    depends_on:\n      - arrive\n\n  - key: teller_key\n    worker: std\n    activity_name: echo\n    parameters:\n      turned_by: \"{{ SIGNAL.name }}\"\n    settings:\n      wait_for_signal:\n        event_name: turn\n        timeout_seconds: 3\n        on_timeout: fail\n    outputs:\n      - echo\n    depends_on:\n      - arrive\n\n  - key: log_entry\n    worker: std\n    activity_name: echo\n    parameters:\n      entry: \"opening {{ arrive.echo.vault }}\"\n    outputs:\n      - echo\n    depends_on:\n      - arrive\n\n  - key: vault_door\n    worker: std\n    activity_name: echo\n    parameters:\n      opened: \"{{ arrive.echo.vault }}\"\n      manager: \"{{ manager_key.echo.turned_by }}\"\n      teller: \"{{ teller_key.echo.turned_by }}\"\n      log: \"{{ log_entry.echo.entry }}\"\n    outputs:\n      - echo\n    depends_on:\n      - manager_key\n      - teller_key\n      - log_entry\n","steps":[{"activity":"echo","depends_on":[],"key":"arrive","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"arrive"}],"key":"manager_key","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"arrive"}],"key":"teller_key","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"arrive"}],"key":"log_entry","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"manager_key"},{"conditions":[],"step":"teller_key"},{"conditions":[],"step":"log_entry"}],"key":"vault_door","worker":"std"}]}},{"card":{"edge":"An operator-presence check on a remote pump: the operator must confirm within seconds, or the run fails and a safe-stop step runs instead. A confirmation that comes after the timeout is refused.\n","functions":["on_timeout: fail, when nobody signals: the step fails, and so does the workflow","a step that depends on the failed step with no condition is skipped","a step whose condition picks the failure ({{<step>.status == 'failed'}}) runs","a signal that arrives after the wait has timed out is refused"],"kind":"compound","name":"Dead man's switch","picture":"A train departs, and the driver has a few seconds to press the vigilance pedal. Pressed, the train runs on to the next station. If the driver doesn't press it in time, the switch trips: the brakes go on and the run ends as failed. A press that comes after the switch has tripped is too late, and changes nothing.\n","runs":[{"expect":{"outputs":[{"equals":{"arrived":"Night mail","driver":"Agnes"},"output":"echo","step":"next_station"}],"status":"completed","steps":{"brakes":{"runs":0,"status":"skipped"},"depart":{"runs":1,"status":"completed"},"next_station":{"runs":1,"status":"completed"},"vigilance":{"runs":1,"status":"completed"}}},"input":{"train":"Night mail"},"name":"the driver presses the pedal","signals":[{"data":{"driver":"Agnes"},"event":"press","step":"vigilance"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"stopped":"Milk train"},"output":"echo","step":"brakes"}],"status":"failed","steps":{"brakes":{"runs":1,"status":"completed"},"depart":{"runs":1,"status":"completed"},"next_station":{"runs":0,"status":"skipped"},"vigilance":{"runs":0,"status":"failed"}}},"input":{"train":"Milk train"},"name":"the driver is asleep","timeout_seconds":10},{"expect":{"outputs":[{"equals":{"stopped":"Sleeper"},"output":"echo","step":"brakes"}],"status":"failed","steps":{"brakes":{"runs":1,"status":"completed"},"depart":{"runs":1,"status":"completed"},"next_station":{"runs":0,"status":"skipped"},"vigilance":{"runs":0,"status":"failed"}}},"input":{"train":"Sleeper"},"name":"the driver wakes too late","signals":[{"data":{"driver":"Agnes"},"event":"press","late":true,"step":"vigilance"}],"timeout_seconds":10}],"trap":{"broken_looks_like":"Before #37's fix, vigilance's {{SIGNAL.*}} template is undefined when the step becomes ready, so it never waits. On main that template error lands on depart, which is marked failed although it ran (#19); vigilance is skipped, nothing is signaled or times out, brakes and next_station stay not_scheduled, and the workflow stays running. Before #29's fix, a pressed pedal fails vigilance as soon as it's signaled.\n","issues":[29,37]}},"dir":"dead-mans-switch","drawing":"MS-99442","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"depart","type":"coil"}}],"series":[],"step":"depart"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"press","seconds":2,"step":"vigilance","type":"timer"}},{"contacts":[{"event":"press","type":"interrupt"}],"end":{"action":"run","step":"vigilance","type":"coil"}},{"contacts":[{"step":"vigilance","type":"timer_done"}],"end":{"action":"fail","step":"vigilance","type":"coil"}}],"series":[{"state":"completed","step":"depart","type":"contact"}],"step":"vigilance"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"next_station","type":"coil"}}],"series":[{"state":"completed","step":"vigilance","type":"contact"}],"step":"next_station"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"brakes","type":"coil"}}],"series":[{"state":"finished","step":"vigilance","type":"contact"},{"expr":"vigilance.status == 'failed'","step":"vigilance","type":"condition"}],"step":"brakes"}],"pins":[{"dir":"in","kind":"input","name":"train"},{"dir":"in","kind":"signal","name":"press","step":"vigilance"},{"dir":"out","kind":"output","name":"echo","step":"next_station"},{"dir":"out","kind":"output","name":"echo","step":"brakes"}],"ratings":[{"note":"on_timeout: fail","parameter":"Signal wait, vigilance (press)","symbol":"tW(vigilance)","unit":"s","value":2}],"workflow":{"name":"machine_dead_mans_switch","source":"# Dead man's switch: a train departs, and the driver must press the\n# vigilance pedal within a few seconds to show they're awake. Pressed, the\n# train runs on to the next station. Not pressed, the switch trips: the\n# vigilance step fails, the brakes go on, and the run ends failed.\n#\n# vigilance waits with on_timeout: fail. next_station depends on it with no\n# condition, so a failed vigilance step skips it; brakes depends on it with\n# a condition on its status, so it runs only when vigilance failed.\nname: machine_dead_mans_switch\n\nactivities:\n  - key: depart\n    worker: std\n    activity_name: echo\n    parameters:\n      train: \"{{ INPUT.train }}\"\n    outputs:\n      - echo\n\n  - key: vigilance\n    worker: std\n    activity_name: echo\n    parameters:\n      train: \"{{ depart.echo.train }}\"\n      pressed_by: \"{{ SIGNAL.driver | coalesce('nobody') }}\"\n    settings:\n      wait_for_signal:\n        event_name: press\n        timeout_seconds: 2\n        on_timeout: fail\n    outputs:\n      - echo\n    depends_on:\n      - depart\n\n  - key: next_station\n    worker: std\n    activity_name: echo\n    parameters:\n      arrived: \"{{ vigilance.echo.train }}\"\n      driver: \"{{ vigilance.echo.pressed_by }}\"\n    outputs:\n      - echo\n    depends_on:\n      - vigilance\n\n  - key: brakes\n    worker: std\n    activity_name: echo\n    parameters:\n      stopped: \"{{ depart.echo.train }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: vigilance\n        conditions:\n          - \"{{ vigilance.status == 'failed' }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"depart","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"depart"}],"key":"vigilance","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"vigilance"}],"key":"next_station","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ vigilance.status == 'failed' }}"],"step":"vigilance"}],"key":"brakes","worker":"std"}]}},{"card":{"edge":"A gateway passes a sens nd":"output","name":"echo","step":"domino_4"}],"ratings":[],"workflow":{"name":"machine_domino_run","source":"# Domino run: four dominoes in a line. Each one reads how many have fallen\n# before it, adds itself, and passes the count and the trail on.\nname: machine_domino_run\n\nactivities:\n  - key: domino_1\n    worker: std\n    activity_name: echo\n    parameters:\n      fallen: \"{{ INPUT.start + 1 }}\"\n      trail: \"tip\"\n    outputs:\n      - echo\n\n  - key: domino_2\n    worker: std\n    activity_name: echo\n    parameters:\n      fallen: \"{{ domino_1.echo.fallen + 1 }}\"\n      trail: \"{{ domino_1.echo.trail }} tip\"\n    outputs:\n      - echo\n    depends_on:\n      - domino_1\n\n  - key: domino_3\n    worker: std\n    activity_name: echo\n    parameters:\n      fallen: \"{{ domino_2.echo.fallen + 1 }}\"\n      trail: \"{{ domino_2.echo.trail }} tip\"\n    outputs:\n      - echo\n    depends_on:\n      - domino_2\n\n  - key: domino_4\n    worker: std\n    activity_name: echo\n    parameters:\n      fallen: \"{{ domino_3.echo.fallen + 1 }}\"\n      trail: \"{{ domino_3.echo.trail }} tip\"\n    outputs:\n      - echo\n    depends_on:\n      - domino_3\n","steps":[{"activity":"echo","depends_on":[],"key":"domino_1","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"domino_1"}],"key":"domino_2","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"domino_2"}],"key":"domino_3","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"domino_3"}],"key":"domino_4","worker":"std"}]}},{"card":{"edge":"A store's price override waits for a manager to send the new price. If the manager sends none, or never answers, the register goes ahead with the standard price after a short wait.\n","functions":["wait_for_signal: a step waits until it is signaled through the API","{{SIGNAL}} in the resumed step's parameters: the signal's data, or null","on_timeout: continue, when nobody signals","the coalesce filter, so a template renders when SIGNAL is null","a later step reads the resumed step's output"],"kind":"compound","name":"Drawbridge","picture":"A boat arrives at a closed drawbridge. The bridge keeper signals \"raise\", saying how high to raise it; the bridge lifts by that much and the boat passes underneath. If the keeper gives no height, or never answers, the bridge lifts its standard 3 metres after a short wait.\n","runs":[{"expect":{"outputs":[{"equals":{"boat":"Marigold","keeper_said":{"height":6},"raised_by":6},"output":"echo","step":"bridge"},{"equals":{"clearance":6,"passed":"Marigold"},"output":"echo","step":"boat_passes"}],"status":"completed","steps":{"boat_arrives":{"runs":1,"status":"completed"},"boat_passes":{"runs":1,"status":"completed"},"bridge":{"runs":1,"status":"completed"}}},"input":{"boat":"Marigold"},"name":"keeper raises it 6 metres","signals":[{"data":{"height":6},"event":"raise","step":"bridge"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"boat":"Heron","keeper_said":null,"raised_by":3},"output":"echo","step":"bridge"},{"equals":{"clearance":3,"passed":"Heron"},"output":"echo","step":"boat_passes"}],"status":"completed","steps":{"boat_arrives":{"runs":1,"status":"completed"},"boat_passes":{"runs":1,"status":"completed"},"bridge":{"runs":1,"status":"completed"}}},"input":{"boat":"Heron"},"name":"keeper gives no height","signals":[{"event":"raise","step":"bridge"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"boat":"Night ferry","keeper_said":null,"raised_by":3},"output":"echo","step":"bridge"},{"equals":{"clearance":3,"passed":"Night ferry"},"output":"echo","step":"boat_passes"}],"status":"completed","steps":{"boat_arrives":{"runs":1,"status":"completed"},"boat_passes":{"runs":1,"status":"completed"},"bridge":{"runs":1,"status":"completed"}}},"input":{"boat":"Night ferry"},"name":"no keeper, the wait times out","timeout_seconds":12}],"trap":{"broken_looks_like":"Before #37's fix the bridge never waits: its {{SIGNAL.*}} template is undefined when the step becomes ready, so no signal can reach it. On main that template error lands on boat_arrives, which is marked failed (#19); the bridge is skipped and the workflow stays running. Before #29's fix, a bridge that does wait fails as soon as the keeper signals (\"Subscription already exists\"). Either way the boat never passes.\n","issues":[29,37]}},"dir":"drawbridge","drawing":"MS-75050","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"boat_arrives","type":"coil"}}],"series":[],"step":"boat_arrives"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"raise","seconds":4,"step":"bridge","type":"timer"}},{"contacts":[{"event":"raise","type":"interrupt"}],"end":{"action":"run","step":"bridge","type":"coil"}},{"contacts":[{"step":"bridge","type":"timer_done"}],"end":{"action":"continue","step":"bridge","type":"coil"}}],"series":[{"state":"completed","step":"boat_arrives","type":"contact"}],"step":"bridge"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"boat_passes","type":"coil"}}],"series":[{"state":"completed","step":"bridge","type":"contact"}],"step":"boat_passes"}],"pins":[{"dir":"in","kind":"input","name":"boat"},{"dir":"in","kind":"signal","name":"raise","step":"bridge"},{"dir":"out","kind":"output","name":"echo","step":"boat_passes"}],"ratings":[{"note":"on_timeout: continue","parameter":"Signal wait, bridge (raise)","symbol":"tW(bridge)","unit":"s","value":4}],"workflow":{"name":"machine_drawbridge","source":"# Drawbridge: a boat arrives at a closed bridge. The bridge waits for the\n# keeper's \"raise\" signal, which says how high to raise it, then lifts and\n# the boat passes. With no height, or no keeper at all (the wait times out\n# and continues), the bridge lifts its standard 3 metres.\n#\n# The bridge's parameters read {{SIGNAL}}, the data the signal carried. It is\n# null when the signal carried none, or when the wait timed out, so the\n# height falls back through `coalesce`.\nname: machine_drawbridge\n\nactivities:\n  - key: boat_arrives\n    worker: std\n    activity_name: echo\n    parameters:\n      boat: \"{{ INPUT.boat }}\"\n    outputs:\n      - echo\n\n  - key: bridge\n    worker: std\n    activity_name: echo\n    parameters:\n      boat: \"{{ boat_arrives.echo.boat }}\"\n      raised_by: \"{{ SIGNAL.height | coalesce(3) }}\"\n      keeper_said: \"{{ SIGNAL }}\"\n    settings:\n      wait_for_signal:\n        event_name: raise\n        timeout_seconds: 4\n        on_timeout: continue\n    outputs:\n      - echo\n    depends_on:\n      - boat_arrives\n\n  - key: boat_passes\n    worker: std\n    activity_name: echo\n    parameters:\n      passed: \"{{ bridge.echo.boat }}\"\n      clearance: \"{{ bridge.echo.raised_by }}\"\n    outputs:\n      - echo\n    depends_on:\n      - bridge\n","steps":[{"activity":"echo","depends_on":[],"key":"boat_arrives","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"boat_arrives"}],"key":"bridge","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"bridge"}],"key":"boat_passes","worker":"std"}]}},{"card":{"edge":"A line controller cycles load, process and unload a fixed number of times, and each cycle runs its steps in that order, never unloading before loading.\n","functions":["a three-step loop whose back-edge is chosen by the order the steps are written, not by their keys"],"kind":"simple","name":"Ferris wheel","picture":"Riders step into a gondola, the wheel goes round, and they alight at the bottom; then the next riders step in. The wheel turns three times, and nobody alights before they've stepped in.\n","runs":[{"expect":{"outputs":[{"equals":{"turn":3},"output":"echo","step":"alight"}],"status":"completed","steps":{"alight":{"runs":3,"status":"completed"},"go_round":{"runs":3,"status":"completed"},"step_in":{"runs":3,"status":"completed"}}},"name":"three turns","timeout_seconds":10}],"trap":{"broken_looks_like":"The back-edge search starts from the alphabetically first key, alight, so alight's dependency on go_round is taken as the back-edge. On main the validator then rejects the wheel: it finds a cycle from go_round to alight with no exit mechanism, although step_in has an iteration_limit and a condition, so the definition never deploys.\n","issue":26}},"dir":"ferris-wheel","drawing":"MS-20022","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"step_in","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"}],[{"step":"alight","type":"seal_in"},{"expr":"alight.status == 'completed'","step":"alight","type":"condition"}]],"type":"parallel"},{"default":false,"preset":3,"step":"step_in","type":"counter"}],"step":"step_in"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"go_round","type":"coil"}}],"series":[{"state":"completed","step":"step_in","type":"contact"}],"step":"go_round"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"alight","type":"coil"}}],"series":[{"state":"completed","step":"go_round","type":"contact"}],"step":"alight"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"alight"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of step_in","symbol":"N(step_in)","unit":"rounds","value":3}],"workflow":{"name":"machine_ferris_wheel","source":"# Ferris wheel: riders step in, the wheel goes round, and they alight at the\n# bottom. Then the next riders step in: three turns in all.\n#\n# The steps are written in the order they run, step_in first, but their keys\n# sort the other way round (alight, go_round, step_in). The loop must start\n# at step_in, the first step written, whatever the keys are: its dependency\n# on alight is the back-edge. Don't rename the steps into alphabetical\n# order; that would hide the bug this machine traps.\nname: machine_ferris_wheel\n\nactivities:\n  - key: step_in\n    worker: std\n    activity_name: echo\n    iteration_limit: 3\n    parameters:\n      turn: \"{{ (alight.echo.turn + 1) if alight.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: alight\n        conditions:\n          - \"{{ alight.status == 'completed' }}\"\n\n  - key: go_round\n    worker: std\n    activity_name: echo\n    parameters:\n      turn: \"{{ step_in.echo.turn }}\"\n    outputs:\n      - echo\n    depends_on:\n      - step_in\n\n  - key: alight\n    worker: std\n    activity_name: echo\n    parameters:\n      turn: \"{{ go_round.echo.turn }}\"\n    outputs:\n      - echo\n    depends_on:\n      - go_round\n","steps":[{"activity":"echo","depends_on":[{"conditions":["{{ alight.status == 'completed' }}"],"step":"alight"}],"key":"step_in","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"step_in"}],"key":"go_round","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"go_round"}],"key":"alight","worker":"std"}]}},{"card":{"edge":"A cell-site controller polls twelve radios at once, and writes one status report, once, only after all twelve have answered.\n","functions":["wide fan-out with dependency_of: one step starts twelve in parallel","wide fan-in with depends_on, no conditions: a step waits for all twelve and runs exactly once","one template reads all twelve outputs"],"kind":"simple","name":"Galley","picture":"The drummer beats the stroke, and twelve oarsmen pull at once, each on their own oar. The coxswain counts the stroke once, when every oar has pulled: a full stroke of all twelve.\n","runs":[{"expect":{"outputs":[{"equals":{"beat":1,"stroke":78},"output":"echo","step":"cox"}],"status":"completed","steps":{"cox":{"runs":1,"status":"completed"},"drum":{"runs":1,"status":"completed"},"oar_1":{"runs":1,"status":"completed"},"oar_10":{"runs":1,"status":"completed"},"oar_11":{"runs":1,"status":"completed"},"oar_12":{"runs":1,"status":"completed"},"oar_2":{"runs":1,"status":"completed"},"oar_3":{"runs":1,"status":"completed"},"oar_4 tact"},{"state":"completed","step":"oar_11","type":"contact"},{"state":"completed","step":"oar_12","type":"contact"}],"step":"cox"}],"pins":[{"dir":"in","kind":"input","name":"beat"},{"dir":"out","kind":"output","name":"echo","step":"cox"}],"ratings":[],"workflow":{"name":"machine_galley","source":"# Galley: the drummer beats the stroke, and twelve oarsmen pull at once,\n# each on their own oar. The coxswain counts the stroke only when every oar\n# has pulled: oar 1 pulls with a weight of 1, oar 12 with 12, so a full\n# stroke weighs 78.\n#\n# The drum fans out to the oars with dependency_of; the coxswain fans in\n# with depends_on, no conditions, so it waits for all twelve.\nname: machine_galley\n\nactivities:\n  - key: drum\n    worker: std\n    activity_name: echo\n    parameters:\n      beat: \"{{ INPUT.beat }}\"\n    outputs:\n      - echo\n    dependency_of:\n      - oar_1\n      - oar_2\n      - oar_3\n      - oar_4\n      - oar_5\n      - oar_6\n      - oar_7\n      - oar_8\n      - oar_9\n      - oar_10\n      - oar_11\n      - oar_12\n\n  - key: oar_1\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 1\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_2\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 2\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_3\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 3\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_4\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 4\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_5\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 5\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_6\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 6\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_7\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 7\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_8\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 8\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_9\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 9\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_10\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 10\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_11\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 11\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: oar_12\n    worker: std\n    activity_name: echo\n    parameters:\n      weight: 12\n      beat: \"{{ drum.echo.beat }}\"\n    outputs:\n      - echo\n\n  - key: cox\n    worker: std\n    activity_name: echo\n    parameters:\n      beat: \"{{ oar_12.echo.beat }}\"\n      stroke: \"{{ oar_1.echo.weight + oar_2.echo.weight + oar_3.echo.weight + oar_4.echo.weight + oar_5.echo.weight + oar_6.echo.weight + oar_7.echo.weight + oar_8.echo.weight + oar_9.echo.weight + oar_10.echo.weight + oar_11.echo.weight + oar_12.echo.weight }}\"\n    outputs:\n      - echo\n    depends_on:\n      - oar_1\n      - oar_2\n      - oar_3\n      - oar_4\n      - oar_5\n      - oar_6\n      - oar_7\n      - oar_8\n      - oar_9\n      - oar_10\n      - oar_11\n      - oar_12\n","steps":[{"activity":"echo","depends_on":[],"key":"drum","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"drum"}],"key":"oar_1","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"drum"}],"key":"oar_2","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"drum"}],"key":"oar_3","worker":"std"},{"activity":"echo","depends_on":[{"condit uns":0,"status":"failed"},"motor":{"runs":1,"status":"completed"}}},"name":"the gear jams","timeout_seconds":10}],"trap":{"broken_looks_like":"The gear's template error is raised while the motor's completion is processed. That event is retried and dropped, the motor is marked failed although it succeeded, the gear never runs or fails, and the workflow stays running.\n","issue":19}},"dir":"jammed-gear","drawing":"MS-91157","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"motor","type":"coil"}}],"series":[],"step":"motor"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"gear","type":"coil"}}],"series":[{"state":"completed","step":"motor","type":"contact"}],"step":"gear"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"belt","type":"coil"}}],"series":[{"state":"completed","step":"gear","type":"contact"}],"step":"belt"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"belt"}],"ratings":[],"workflow":{"name":"machine_jammed_gear","source":"# Jammed gear: a motor turns a gear, which drives a belt. The gear is wired\n# wrong: it reads the belt's speed, but the belt comes after it and hasn't\n# run, so the gear's template can't be resolved.\n#\n# The broken template is the gear's own, so the gear fails, the belt behind\n# it never runs, and the workflow fails. The motor did its job and stays\n# completed.\nname: machine_jammed_gear\n\nactivities:\n  - key: motor\n    worker: std\n    activity_name: echo\n    parameters:\n      rpm: 1200\n    outputs:\n      - echo\n\n  - key: gear\n    worker: std\n    activity_name: echo\n    parameters:\n      rpm: \"{{ motor.echo.rpm }}\"\n      belt_speed: \"{{ belt.echo.speed }}\"\n    outputs:\n      - echo\n    depends_on:\n      - motor\n\n  - key: belt\n    worker: std\n    activity_name: echo\n    parameters:\n      speed: \"{{ gear.echo.rpm }}\"\n    outputs:\n      - echo\n    depends_on:\n      - gear\n","steps":[{"activity":"echo","depends_on":[],"key":"motor","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"motor"}],"key":"gear","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"gear"}],"key":"belt","worker":"std"}]}},{"card":{"edge":"A greenhouse heater controller reads the temperature and adds heat round by round until it reaches the target. Then the next stage runs, once.\n","functions":["a three-step loop that ends through a condition, not its iteration_limit","a step after the loop (unload) waits while the loop runs, and runs once when it exits","the stoker doesn't run in the round where the loop exits, and keeps its last round's result"],"kind":"compound","name":"Kiln","picture":"A pottery kiln heats up, a pyrometer reads the temperature, and the stoker adds fuel until the pots are fired at 1200 degrees. Then the kiln is unloaded. The first reading is too cool, and so is the second.\n","runs":[{"expect":{"outputs":[{"equals":{"ready":true,"temp":1200},"output":"echo","step":"pyrometer"},{"equals":{"fired_at":1200},"output":"echo","step":"unload"}],"status":"completed","steps":{"heat":{"runs":3,"status":"completed"},"pyrometer":{"runs":3,"status":"completed"},"stoke":{"runs":2,"status":"completed"},"unload":{"runs":1,"status":"completed"}}},"name":"a firing to 1200 degrees","timeout_seconds":10}],"trap":{"broken_looks_like":"unload is skipped after the first reading (600 degrees, not ready) and stays skipped, so the pots are never unloaded. On main the loop is broken too (#18): the pyrometer reads once, the stoker runs 100 times on that reading, and the workflow completes without unloading.\n","issue":27}},"dir":"kiln","drawing":"MS-57171","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"heat","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"}],[{"step":"stoke","type":"seal_in"},{"expr":"stoke.status == 'completed'","step":"stoke","type":"condition"}]],"type":"parallel"},{"default":false,"preset":5,"step":"heat","type":"counter"}],"step":"heat"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"pyrometer","type":"coil"}}],"series":[{"state":"completed","step":"heat","type":"contact"}],"step":"pyrometer"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"stoke","type":"coil"}}],"series":[{"state":"finished","step":"pyrometer","type":"contact"},{"expr":"not pyrometer.echo.ready","step":"pyrometer","type":"condition"}],"step":"stoke"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"unload","type":"coil"}}],"series":[{"state":"finished","step":"pyrometer","type":"contact"},{"expr":"pyrometer.echo.ready","step":"pyrometer","type":"condition"}],"step":"unload"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"stoke"},{"dir":"out","kind":"output","name":"echo","step":"unload"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of heat","symbol":"N(heat)","unit":"rounds","value":5}],"workflow":{"name":"machine_kiln","source":"# Kiln: the kiln heats, the pyrometer reads the temperature, and while the\n# pots aren't fired yet the stoker adds fuel and the kiln heats again. When\n# the pyrometer reads 1200 degrees, the kiln is unloaded.\n#\n# The first heat reaches 600 degrees and each round adds 300, so the kiln is\n# ready on the third round. unload depends on the loop without being part of\n# it: it must wait for the loop, not be skipped by the first reading.\nname: machine_kiln\n\nactivities:\n  - key: heat\n    worker: std\n    activity_name: echo\n    iteration_limit: 5\n    parameters:\n      temp: \"{{ (stoke.echo.temp + 300) if stoke.status == 'completed' else 600 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: stoke\n        conditions:\n          - \"{{ stoke.status == 'completed' }}\"\n\n  - key: pyrometer\n    worker: std\n    activity_name: echo\n    parameters:\n      temp: \"{{ heat.echo.temp }}\"\n      ready: \"{{ heat.echo.temp >= 1200 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - heat\n\n  - key: stoke\n    worker: std\n    activity_name: echo\n    parameters:\n      temp: \"{{ pyrometer.echo.temp }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: pyrometer\n        conditions:\n          - \"{{ not pyrometer.echo.ready }}\"\n\n  - key: unload\n    worker: std\n    activity_name: echo\n    parameters:\n      fired_at: \"{{ pyrometer.echo.temp }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: pyrometer\n        conditions:\n          - \"{{ pyrometer.echo.ready }}\"\n","steps":[{"activity":"echo","depends_on":[{"conditions":["{{ stoke.status == 'completed' }}"],"step":"stoke"}],"key":"heat","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"heat"}],"key":"pyrometer","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ not pyrometer.echo.ready }}"],"step":"pyrometer"}],"key":"stoke","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ pyrometer.echo.ready }}"],"step":"pyrometer"}],"key":"unload","worker":"std"}]}},{"card":{"edge":"A gateway skips its alarm step when the sensor reports nothing, and the all-clear report, which runs because the alarm was skipped, must still go out.\n","functions":["a condition on a dependency, reading its output (the branch is skipped)","a condition on a dependency's status (\"run this because that was skipped\")","a step made ready by a skip, with no later event to wake the engine"],"kind":"compound","name":"Level crossing","picture":"A road crosses a quiet branch line. The signal box says no train is coming, so the branch train never runs, and the crossing's lamp shows all clear.\n","runs":[{"expect":{"outputs":[{"equals":{"lamp":"all clear"},"output":"echo","step":"crossing_lamp"}],"status":"completed","steps":{"branch_train":{"runs":0,"status":"skipped"},"crossing_lamp":{"runs":1,"status":"completed"},"signal_box":{"runs":1,"status":"completed"}}},"name":"no train coming","timeout_seconds":10}],"trap":{"broken_looks_like":"branch_train is skipped but crossing_lamp is never scheduled, and the workflow stays running.\n","issue":25}},"dir":"level-crossing","drawing":"MS-32752","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"signal_box","type":"coil"}}],"series":[],"step":"signal_box"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"branch_train","type":"coil"}}],"series":[{"state":"finished","step":"signal_box","type":"contact"},{"expr":"signal_box.echo.train == 'coming'","step":"signal_box","type":"condition"}],"step":"branch_train"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"crossing_lamp","type":"coil"}}],"series":[{"state":"finished","step":"branch_train","type":"contact"},{"expr":"branch_train.status == 'skipped'","step":"branch_train","type":"condition"}],"step":"crossing_lamp"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"crossing_lamp"}],"ratings":[],"workflow":{"name":"machine_level_crossing","source":"# Level crossing: a crossing on a branch line. When no train is coming, the\n# branch train never runs, and the crossing's lamp shows all clear.\n#\n# Nothing else in this workflow finishes after the branch train is skipped.\n# Keep it that way: any later completion makes the engine check readiness\n# again, which would schedule the lamp and hide the bug this machine traps.\nname: machine_level_crossing\n\nactivities:\n  - key: signal_box\n    worker: std\n    activity_name: echo\n    parameters:\n      train: none\n    outputs:\n      - echo\n\n  - key: branch_train\n    worker: std\n    activity_name: echo\n    parameters:\n      train: passing the crossing\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: signal_box\n        conditions:\n          - \"{{ signal_box.echo.train == 'coming' }}\"\n\n  - key: crossing_lamp\n    worker: std\n    activity_name: echo\n    parameters:\n      lamp: all clear\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: branch_train\n        conditions:\n          - \"{{ branch_train.status == 'skipped' }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"signal_box","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ signal_box.echo.train == 'coming' }}"],"step":"signal_box"}],"key":"branch_train","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ branch_train.status == 'skipped' }}"],"step":"branch_train"}],"key":"crossing_lamp","worker":"std"}]}},{"card":{"edge":"A clinic's medicine locker waits for a patient's pickup code; with no code in time it skips the handover and books a return, and it refuses a code typed too late. Either way it closes out once.\n","functions":["on_timeout: skip, when nobody signals: the step is skipped without running, and the workflow carries on","a step that depends on the skipped step with no condition is skipped too","a step whose condition picks the skip ({{<step>.status == 'skipped'}}) runs","a join of two exclusive paths, with a status condition on each, runs once after whichever ran","a signal that arrives after the wait has timed out is refused"],"kind":"compound","name":"Parcel locker","picture":"A courier leaves a parcel in a locker, and the customer has a few seconds to collect it with a code. Collected, the locker prints a receipt. When nobody comes, the locker gives up, no receipt is printed, and the van takes the parcel back to the depot. A code typed after the locker has given up is refused. Either way the locker is closed out once.\n","runs":[{"expect":{"outputs":[{"equals":{"code":4417,"collected":"boots"},"output":"echo","step":"receipt"},{"equals":{"outcome":"collected","parcel":"boots"},"output":"echo","step":"close_out"}],"status":"completed","steps":{"close_out":{"runs":1,"status":"completed"},"deliver":{"runs":1,"status":"completed"},"locker":{"runs":1,"status":"completed"},"receipt":{"runs":1," ollect","type":"interrupt"}],"end":{"action":"run","step":"locker","type":"coil"}},{"contacts":[{"step":"locker","type":"timer_done"}],"end":{"action":"skip","step":"locker","type":"coil"}}],"series":[{"state":"completed","step":"deliver","type":"contact"}],"step":"locker"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"receipt","type":"coil"}}],"series":[{"state":"completed","step":"locker","type":"contact"}],"step":"receipt"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"return_to_depot","type":"coil"}}],"series":[{"state":"finished","step":"locker","type":"contact"},{"expr":"locker.status == 'skipped'","step":"locker","type":"condition"},{"preset":"2s","step":"return_to_depot","type":"delay"}],"step":"return_to_depot"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"close_out","type":"coil"}}],"series":[{"state":"finished","step":"receipt","type":"contact"},{"state":"finished","step":"return_to_depot","type":"contact"},{"branches":[[{"expr":"receipt.status == 'completed'","step":"receipt","type":"condition"}],[{"expr":"return_to_depot.status == 'completed'","step":"return_to_depot","type":"condition"}]],"type":"parallel"}],"step":"close_out"}],"pins":[{"dir":"in","kind":"input","name":"parcel"},{"dir":"in","kind":"signal","name":"collect","step":"locker"},{"dir":"out","kind":"output","name":"echo","step":"close_out"}],"ratings":[{"note":"on_timeout: skip","parameter":"Signal wait, locker (collect)","symbol":"tW(locker)","unit":"s","value":2},{"parameter":"Delay before return_to_depot","symbol":"tD(return_to_depot)","unit":"","value":"2s"}],"workflow":{"name":"machine_parcel_locker","source":"# Parcel locker: a courier leaves a parcel in a locker, and the customer has\n# a few seconds to collect it with the code from their text message. When\n# they collect it, a receipt is printed. When nobody comes, the locker gives\n# up (the wait times out and skips), the receipt is skipped with it, and the\n# parcel goes back to the depot. Either way the locker is closed out.\n#\n# locker waits with on_timeout: skip. receipt depends on it with no\n# condition, so it is skipped with the locker; return_to_depot depends on it\n# with a condition that picks the skip. close_out joins the two paths with a\n# status condition on each, so it runs after whichever one ran.\n#\n# The van takes two seconds to come back for the parcel (return_to_depot's\n# delay), so a code typed after the locker gave up reaches a running\n# workflow.\nname: machine_parcel_locker\n\nactivities:\n  - key: deliver\n    worker: std\n    activity_name: echo\n    parameters:\n      parcel: \"{{ INPUT.parcel }}\"\n    outputs:\n      - echo\n\n  - key: locker\n    worker: std\n    activity_name: echo\n    parameters:\n      parcel: \"{{ deliver.echo.parcel }}\"\n      code: \"{{ SIGNAL.code }}\"\n    settings:\n      wait_for_signal:\n        event_name: collect\n        timeout_seconds: 2\n        on_timeout: skip\n    outputs:\n      - echo\n    depends_on:\n      - deliver\n\n  - key: receipt\n    worker: std\n    activity_name: echo\n    parameters:\n      collected: \"{{ locker.echo.parcel }}\"\n      code: \"{{ locker.echo.code }}\"\n    outputs:\n      - echo\n    depends_on:\n      - locker\n\n  - key: return_to_depot\n    worker: std\n    activity_name: echo\n    parameters:\n      returned: \"{{ deliver.echo.parcel }}\"\n    settings:\n      delay: 2s\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: locker\n        conditions:\n          - \"{{ locker.status == 'skipped' }}\"\n\n  - key: close_out\n    worker: std\n    activity_name: echo\n    parameters:\n      parcel: \"{{ deliver.echo.parcel }}\"\n      outcome: \"{{ 'collected' if receipt.status == 'completed' else 'returned' }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: receipt\n        conditions:\n          - \"{{ receipt.status == 'completed' }}\"\n      - activity_key: return_to_depot\n        conditions:\n          - \"{{ return_to_depot.status == 'completed' }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"deliver","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"deliver"}],"key":"locker","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"locker"}],"key":"receipt","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ locker.status == 'skipped' }}"],"step":"locker"}],"key":"return_to_depot","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ receipt.status == 'completed' }}"],"step":"receipt"},{"conditions":["{{ return_to_depot.status == 'completed' }}"],"step":"return_to_depot"}],"key":"close_out","worker":"std"}]}},{"card":{"edge":"A ship's bilge pump runs a fixed number of strokes, then a level check runs once; a valve is flushed twice, then signed off once. Neither check may run after the first round and miss the rest.\n","functions":["a step after a two-step loop, depending on it with no condition, runs once, after the loop's last round","a step after a self-loop, depending on it with no condition, runs once, after the loop's last round","iteration_limit ends both loops"],"kind":"compound","name":"Pile driver","picture":"On a building site, the crane lifts the hammer and drops it on an oak pile, three blows in all. Then the surveyor measures how deep the pile went: three blows deep. The tamper packs the backfill around the pile twice, and the foreman signs off on a pile three blows deep, tamped twice.\n","runs":[{"expect":{"outputs":[{"equals":{"depth":3},"output":"echo","step":"survey"},{"equals":{"depth":3,"tamps":2},"output":"echo","step":"sign_off"}],"status":"completed","steps":{"crane":{"runs":1,"status":"completed"},"drop":{"runs":3,"status":"completed"},"lift":{"runs":3,"status":"completed"},"sign_off":{"runs":1,"status":"completed"},"survey":{"runs":1,"status":"completed"},"tamper":{"runs":2,"status":"completed"}}},"name":"three blows, two tamps","timeout_seconds":10}],"trap":{"broken_looks_like":"The surveyor measures after the first blow, a pile one blow deep, and never again; the tamper starts while the hammer is still driving, and the foreman signs off after the first tamp. On main #18 shows too: drop runs over and over on the first lift.\n","issue":40}},"dir":"pile-driver","drawing":"MS-74590","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"crane","type":"coil"}}],"series":[],"step":"crane"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"lift","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"crane","type":"contact"}],[{"step":"drop","type":"seal_in"},{"expr":"drop.status == 'completed'","step":"drop","type":"condition"}]],"type":"parallel"},{"default":false,"preset":3,"step":"lift","type":"counter"}],"step":"lift"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"drop","type":"coil"}}],"series":[{"state":"completed","step":"lift","type":"contact"}],"step":"drop"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"survey","type":"coil"}}],"series":[{"state":"completed","step":"drop","type":"contact"}],"step":"survey"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"tamper","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"survey","type":"contact"}],[{"step":"tamper","type":"seal_in"}]],"type":"parallel"},{"default":false,"preset":2,"step":"tamper","type":"counter"}],"step":"tamper"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"sign_off","type":"coil"}}],"series":[{"state":"completed","step":"tamper","type":"contact"}],"step":"sign_off"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"sign_off"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of lift","symbol":"N(lift)","unit":"rounds","value":3},{"note":"iteration_limit","parameter":"Rounds of tamper","symbol":"N(tamper)","unit":"rounds","value":2}],"workflow":{"name":"machine_pile_driver","source":"# Pile driver: the crane lifts the hammer and drops it on the pile, three\n# blows in all. Then the surveyor measures how deep the pile went, and the\n# tamper packs the backfill around it twice before the foreman signs off.\n#\n# Two loops, each with a step after it that depends on it with no condition:\n# - lift and drop are a two-step loop (lift's dependency on drop is the\n#   back-edge); survey depends on drop.\n# - tamper is a self-loop; sign_off depends on tamper.\n# A step after a loop is how the loop hands off its result: it must run once,\n# after the loop's last round, on its final output. It must not run after\n# the first round and miss the rest.\n#\n# The keys sort with crane first, so even the alphabetical back-edge search\n# (#26) finds drop -> lift. Keep it that way, so this machine traps one bug.\nname: machine_pile_driver\n\nactivities:\n  - key: crane\n    worker: std\n    activity_name: echo\n    parameters:\n      pile: oak\n    outputs:\n      - echo\n\n  - key: lift\n    worker: std\n    activity_name: echo\n    iteration_limit: 3\n    parameters:\n      blow: \"{{ (drop.echo.blow + 1) if drop.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - crane\n      - activity_key: drop\n        conditions:\n          - \"{{ drop.status == 'completed' }}\"\n\n  - key: drop\n    worker: std\n    activity_name: echo\n    parameters:\n      blow: \"{{ lift.echo.blow }}\"\n    outputs:\n      - echo\n    depends_on:\n      - lift\n\n  - key: survey\n    worker: std\n    activity_name: echo\n    parameters:\n      depth: \"{{ drop.echo.blow }}\"\n    outputs:\n      - echo\n    depends_on:\n      - drop\n\n  - key: tamper\n    worker: std\n    activity_name: echo\n    iteration_limit: 2\n    parameters:\n      tamp: \"{{ (tamper.echo.tamp + 1) if tamper.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - survey\n      - tamper\n\n  - key: sign_off\n    worker: std\n    activity_name: echo\n    parameters:\n      depth: \"{{ survey.echo.depth }}\"\n      tamps: \"{{ tamper.echo.tamp }}\"\n    outputs:\n      - echo\n    depends_on:\n      - tamper\n","steps":[{"activity":"echo","depends_on":[],"key":"crane","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"crane"},{"conditions":["{{ drop.status == 'completed' }}"],"step":"drop"}],"key":"lift","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"lift"}],"key":"drop","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"drop"}],"key":"survey","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"survey"},{"conditions":[],"step":"tamper"}],"key":"tamper","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"tamper"}],"key":"sign_off","worker":"std"}]}},{"card":{"edge":"A factory line controller acts, in parallel, only on the stations an order flags, and writes one combined report once every station has acted or been skipped. With no station flagged there's no report.\n","functions":["wide fan-out: one step starts twelve, each behind its own condition","wide fan-in: a join of twelve, each dependency with a status condition, waits for every branch to run or be skipped, then runs once","the join reads every branch's output, and sees a skipped branch as skipped","when every branch is skipped, the join has no applicable dependency and is skipped"],"kind":"compound","name":"Pipe organ","picture":"An organist plays a chord, and each of the twelve pipes of the octave sounds only if its key is held down. The wind chest gathers every pipe that sounded into one chord, once. With no key held, no pipe sounds and there's no chord.\n","runs":[{"expect":{"outputs":[{"equals":{"a":null,"a_sharp":null,"b":null,"c":"C","c_sharp":null,"d":null,"d_sharp":null,"e":"E","f":null,"f_sharp e pipes whose keys aren't held are skipped. chord depends on all twelve,\n# each with a status condition, so it waits for every pipe to sound or be\n# skipped, then runs once, and reads each pipe's note (null for a silent\n# pipe). With no key held, every pipe is skipped and so is the chord.\nname: machine_pipe_organ\n\nactivities:\n  - key: keyboard\n    worker: std\n    activity_name: echo\n    parameters:\n      keys: \"{{ INPUT.keys }}\"\n    outputs:\n      - echo\n\n  - key: c\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"C\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'C' in keyboard.echo.keys }}\"\n\n  - key: c_sharp\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"C#\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'C#' in keyboard.echo.keys }}\"\n\n  - key: d\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"D\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'D' in keyboard.echo.keys }}\"\n\n  - key: d_sharp\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"D#\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'D#' in keyboard.echo.keys }}\"\n\n  - key: e\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"E\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'E' in keyboard.echo.keys }}\"\n\n  - key: f\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"F\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'F' in keyboard.echo.keys }}\"\n\n  - key: f_sharp\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"F#\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'F#' in keyboard.echo.keys }}\"\n\n  - key: g\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"G\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'G' in keyboard.echo.keys }}\"\n\n  - key: g_sharp\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"G#\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'G#' in keyboard.echo.keys }}\"\n\n  - key: a\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"A\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'A' in keyboard.echo.keys }}\"\n\n  - key: a_sharp\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"A#\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'A#' in keyboard.echo.keys }}\"\n\n  - key: b\n    worker: std\n    activity_name: echo\n    parameters:\n      note: \"B\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keyboard\n        conditions:\n          - \"{{ 'B' in keyboard.echo.keys }}\"\n\n  - key: chord\n    worker: std\n    activity_name: echo\n    parameters:\n      c: \"{{ c.echo.note if c.status == 'completed' else none }}\"\n      c_sharp: \"{{ c_sharp.echo.note if c_sharp.status == 'completed' else none }}\"\n      d: \"{{ d.echo.note if d.status == 'completed' else none }}\"\n      d_sharp: \"{{ d_sharp.echo.note if d_sharp.status == 'completed' else none }}\"\n      e: \"{{ e.echo.note if e.status == 'completed' else none }}\"\n      f: \"{{ f.echo.note if f.status == 'completed' else none }}\"\n      f_sharp: \"{{ f_sharp.echo.note if f_sharp.status == 'completed' else none }}\"\n      g: \"{{ g.echo.note if g.status == 'completed' else none }}\"\n      g_sharp: \"{{ g_sharp.echo.note if g_sharp.status == 'completed' else none }}\"\n      a: \"{{ a.echo.note if a.status == 'completed' else none }}\"\n      a_sharp: \"{{ a_sharp.echo.note if a_sharp.status == 'completed' else none }}\"\n      b: \"{{ b.echo.note if b.status == 'completed' else none }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: c\n        conditions:\n          - \"{{ c.status == 'completed' }}\"\n      - activity_key: c_sharp\n        conditions:\n          - \"{{ c_sharp.status == 'completed' }}\"\n      - activity_key: d\n        conditions:\n          - \"{{ d.status == 'completed' }}\"\n      - activity_key: d_sharp\n        conditions:\n          - \"{{ d_sharp.status == 'completed' }}\"\n      - activity_key: e\n        conditions:\n          - \"{{ e.status == 'completed' }}\"\n      - activity_key: f\n        conditions:\n          - \"{{ f.status == 'completed' }}\"\n      - activity_key: f_sharp\n        conditions:\n          - \"{{ f_sharp.status == 'completed' }}\"\n      - activity_key: g\n        conditions:\n          - \"{{ g.status == 'completed' }}\"\n      - activity_key: g_sharp\n        conditions:\n          - \"{{ g_sharp.status == 'completed' }}\"\n      - activity_key: a\n        conditions:\n          - \"{{ a.status == 'completed' }}\"\n      - activity_key: a_sharp\n        conditions:\n          - \"{{ a_sharp.status == 'completed' }}\"\n      - activity_key: b\n        conditions:\n          - \"{{ b.status == 'completed' }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"keyboard","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ 'C' in keyboard.echo.keys }}"],"step":"keyboard"}],"key":"c","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ 'C#' in keyboard.echo.keys }}"],"step":"keyboard"}],"key":"c_sharp","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ 'D' i
