,{"conditions":["{{ b.status == 'completed' }}"],"step":"b"}],"key":"chord","worker":"std"}]}},{"card":{"edge":"A vehicle back at the depot uploads four files in parallel, and one that fails on a flaky link is retried after a pause. The trip is closed once all four are in, and stays open if that one never gets through.\n","functions":["fan-out to four branches, one with settings.retry","a join with no conditions waits while a branch is retried, and runs once with the retried branch's successful output","a branch that exhausts its retries fails, the join is skipped, the other branches still complete, and the workflow fails"],"kind":"compound","name":"Printing press","picture":"Four colour plates, cyan, magenta, yellow and black, print in parallel, and the press puts the page together once all four are down. The yellow plate smudges and is printed again; on a good run it takes on the second impression. If it never takes, the other three are printed but there's no page.\n","runs":[{"expect":{"outputs":[{"equals":{"rows":[{"clean":1,"impression":2,"plate":"yellow"}]},"output":"result","step":"yellow"},{"equals":{"page":"cyan+magenta+yellow+black","yellow_impression":2},"output":"echo","step":"press"}],"status":"completed","steps":{"black":{"runs":1,"status":"completed"},"cyan":{"runs":1,"status":"completed"},"ink":{"runs":1,"status":"completed"},"magenta":{"runs":1,"status":"completed"},"press":{"runs":1,"status":"completed"},"yellow":{"runs":1,"status":"completed"}}},"input":{"yellow_takes":2},"name":"yellow takes on the second impression","timeout_seconds":15},{"expect":{"status":"failed","steps":{"black":{"runs":1,"status":"completed"},"cyan":{"runs":1,"status":"completed"},"ink":{"runs":1,"status":"completed"},"magenta":{"runs":1,"status":"completed"},"press":{"runs":0,"status":"skipped"},"yellow":{"runs":0,"status":"failed"}}},"input":{"yellow_takes":9},"name":"yellow never takes","timeout_seconds":15}]},"dir":"printing-press","drawing":"MS-36862","ladder":[{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"ink","type":"coil"}}],"series":[],"step":"ink"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"cyan","type":"coil"}}],"series":[{"state":"completed","step":"ink","type":"contact"}],"step":"cyan"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"magenta","type":"coil"}}],"series":[{"state":"completed","step":"ink","type":"contact"}],"step":"magenta"},{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"yellow","type":"coil"}}],"series":[{"state":"completed","step":"ink","type":"contact"}],"step":"yellow"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"black","type":"coil"}}],"series":[{"state":"completed","step":"ink","type":"contact"}],"step":"black"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"press","type":"coil"}}],"series":[{"state":"completed","step":"cyan","type":"contact"},{"state":"completed","step":"magenta","type":"contact"},{"state":"completed","step":"yellow","type":"contact"},{"state":"completed","step":"black","type":"contact"}],"step":"press"}],"pins":[{"dir":"in","kind":"input","name":"yellow_takes"},{"dir":"in","kind":"secret","name":"shop_db_url"},{"dir":"out","kind":"output","name":"echo","step":"press"}],"ratings":[{"note":"fixed backoff, base 1 s","parameter":"Attempts, yellow","symbol":"A(yellow)","unit":"attempts","value":3}],"workflow":{"name":"machine_printing_press","source":"# Printing press: four colour plates, cyan, magenta, yellow and black, print\n# their impressions in parallel, and the press puts the page together once\n# all four are down. The yellow plate smudges until the impression the\n# input names; it may be printed three times in all (retry.max_attempts: 3).\n# If yellow never takes, there's no page.\n#\n# The yellow plate is a postgres_query on the test's own database that\n# counts its impressions in a sequence ink creates for this run, and fails\n# (division by zero) until the count reaches INPUT.yellow_takes. press\n# depends on all four plates with no conditions: it must wait while yellow\n# is retried, run once, and read yellow's successful impression.\nname: machine_printing_press\n\nactivities:\n  - key: ink\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: CREATE SEQUENCE \"shop_press_{{ WORKFLOW.id }}\"\n    outputs:\n      - result\n\n  - key: cyan\n    worker: std\n    activity_name: echo\n    parameters:\n      plate: cyan\n    outputs:\n      - echo\n    depends_on:\n      - ink\n\n  - key: magenta\n    worker: std\n    activity_name: echo\n    parameters:\n      plate: magenta\n    outputs:\n      - echo\n    depends_on:\n      - ink\n\n  - key: yellow\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: >-\n        WITH plate AS (SELECT nextval('\"shop_press_{{ WORKFLOW.id }}\"') AS impression)\n        SELECT 'yellow' AS plate, impression,\n          1 / (CASE WHEN impression >= {{ INPUT.yellow_takes }} THEN 1 ELSE 0 END) AS clean\n        FROM plate\n    settings:\n      retry:\n        max_attempts: 3\n        strategy: fixed\n        base_seconds: 1\n    outputs:\n      - result\n    depends_on:\n      - ink\n\n  - key: black\n    worker: std\n    activity_name: echo\n    parameters:\n      plate: black\n    outputs:\n      - echo\n    depends_on:\n      - ink\n\n  - key: press\n    worker: std\n    activity_name: echo\n    parameters:\n      page: \"{{ cyan.echo.plate }}+{{ magenta.echo.plate }}+{{ yellow.result.rows[0].plate }}+{{ black.echo.plate }}\"\n      yellow_impression: \"{{ yellow.result.rows[0].impression }}\"\n    outputs:\n      - echo\n    depends_on:\n      - cyan\n      - magenta\n      - yellow\n      - black\n","steps":[{"activity":"postgres_query","depends_on":[],"key":"ink","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"ink"}],"key":"cyan","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"ink"}],"key":"magenta","worker":"std"},{"activity":"postgres_query","depends_on":[{"conditions":[],"step":"ink"}],"key":"yellow","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"ink"}],"key":"black","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"cyan"},{"conditions":[],"step":"magenta"},{"conditions":[],"step":"yellow"},{"conditions":[],"step":"black"}],"key":"press","worker":"std"}]}},{"card":{"edge":"A gateway sends one reading to three processors in parallel and merges their results into one record, exactly once.\n","functions":["fan-out: one step starts three in parallel","fan-in: a step that waits for all three, and runs exactly once","outputs from several steps combined in one template"],"kind":"simple","name":"Prism and funnel","picture":"White light enters a prism and splits into red, green and blue beams. A funnel on the other side gathers the three beams back into one.\n","runs":[{"expect":{"outputs":[{"equals":{"mixed":"red+green+blue","source":"white"},"output":"echo","step":"funnel"}],"status":"completed","steps":{"beam":{"runs":1,"status":"completed"},"blue":{"runs":1,"status":"completed"},"funnel":{"runs":1,"status":"completed"},"green":{"runs":1,"status":"completed"},"red":{"runs":1,"status":"completed"}}},"name":"white light"}]},"dir":"prism-and-funnel","drawing":"MS-98733","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"beam","type":"coil"}}],"series":[],"step":"beam"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"red","type":"coil"}}],"series":[{"state":"completed","step":"beam","type":"contact"}],"step":"red"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"green","type":"coil"}}],"series":[{"state":"completed","step":"beam","type":"contact"}],"step":"green"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"blue","type":"coil"}}],"series":[{"state":"completed","step":"beam","type":"contact"}],"step":"blue"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"funnel","type":"coil"}}],"series":[{"state":"completed","step":"red","type":"contact"},{"state":"completed","step":"green","type":"contact"},{"state":"completed","step":"blue","type":"contact"}],"step":"funnel"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"funnel"}],"ratings":[],"workflow":{"name":"machine_prism_and_funnel","source":"# Prism and funnel: a beam of white light splits into red, green and blue,\n# which run in parallel, and a funnel gathers all three back into one.\nname: machine_prism_and_funnel\n\nactivities:\n  - key: beam\n    worker: std\n    activity_name: echo\n    parameters:\n      light: white\n    outputs:\n      - echo\n\n  - key: red\n    worker: std\n    activity_name: echo\n    parameters:\n      colour: red\n      from: \"{{ beam.echo.light }}\"\n    outputs:\n      - echo\n    depends_on:\n      - beam\n\n  - key: green\n    worker: std\n    activity_name: echo\n    parameters:\n      colour: green\n      from: \"{{ beam.echo.light }}\"\n    outputs:\n      - echo\n    depends_on:\n      - beam\n\n  - key: blue\n    worker: std\n    activity_name: echo\n    parameters:\n      colour: blue\n      from: \"{{ beam.echo.light }}\"\n    outputs:\n      - echo\n    depends_on:\n      - beam\n\n  - key: funnel\n    worker: std\n    activity_name: echo\n    parameters:\n      mixed: \"{{ red.echo.colour }}+{{ green.echo.colour }}+{{ blue.echo.colour }}\"\n      source: \"{{ red.echo.from }}\"\n    outputs:\n      - echo\n    depends_on:\n      - red\n      - green\n      - blue\n","steps":[{"activity":"echo","depends_on":[],"key":"beam","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"beam"}],"key":"red","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"beam"}],"key":"green","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"beam"}],"key":"blue","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"red"},{"conditions":[],"step":"green"},{"conditions":[],"step":"blue"}],"key":"funnel","worker":"std"}]}},{"card":{"edge":"A backup generator's controller tries to start the engine up to three times, pausing between tries, and calls for service if it never starts. The try count is kept in PostgreSQL, so each try sees the ones before it.\n","functions":["settings.retry: a step that fails is run again, up to max_attempts in all, after a fixed backoff","a step that fails and then succeeds within its retries completes once, with the successful attempt's output","a step that exhausts its retries fails, and so does the workflow","a step after it with no condition is skipped; one whose condition picks the failure runs","postgres_query on the test's own database, through {{SECRET.shop_db_url}}"],"kind":"compound","name":"Pull-start mower","picture":"Prime the carburettor, then pull the cord until the engine catches. On a good day it catches on the first pull; on a cold one, the third. A flooded engine doesn't catch in three pulls, so nobody mows and the mechanic is called, told it took three pulls.\n","runs":[{"expect":{"outputs":[{"equals":{"rows":[{"caught":1,"pull":1}]},"output":"result","step":"pull_cord"},{"equals":{"pulls":1},"output":"echo","step":"mow"}],"status":"completed","steps":{"call_mechanic":{"runs":0,"status":"skipped"},"mow":{"runs":1,"status":"completed"},"prime":{"runs":1,"status":"completed"},"pull_cord":{"runs":1,"status":"completed"}}},"input":{"catches_on":1},"name":"catches on the first pull","timeout_seconds":15},{"expect":{"outputs":[{"equals":{"rows":[{"caught":1,"pull":3}]},"output":"result","step":"pull_cord"},{"equals":{"pulls":3},"output":"echo","step":"mow"}],"status":"completed","steps":{"call_mechanic":{"runs":0,"status":"skipped"},"mow":{"runs":1,"status":"completed"},"prime":{"runs":1,"status":"completed"},"pull_cord":{"runs":1,"status":"completed"}}},"input":{"catches_on":3},"name":"catches on the third pull","timeout_seconds":15},{"expect":{"outputs":[{"equals":{"rows":[{"pulls":3}]},"output":"result","step":"call_mechanic"}],"status":"failed","steps":{"call_mechanic":{"runs":1,"status":"completed"},"mow":{"runs":0,"status":"skipped"},"prime":{"runs":1,"status":"completed"},"pull_cord":{"runs":0,"status":"failed"}}},"input":{"catches_on":9},"name":"flooded, never catches","timeout_seconds":15}]},"dir":"pull-start-mower","drawing":"MS-93536","ladder":[{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"prime","type":"coil"}}],"series":[],"step":"prime"},{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"pull_cord","type":"coil"}}],"series":[{"state":"completed","step":"prime","type":"contact"}],"step":"pull_cord"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"mow","type":"coil"}}],"series":[{"state":"completed","step":"pull_cord","type":"contact"}],"step":"mow"},{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"call_mechanic","type":"coil"}}],"series":[{"state":"finished","step":"pull_cord","type":"contact"},{"expr":"pull_cord.status == 'failed'","step":"pull_cord","type":"condition"}],"step":"call_mechanic"}],"pins":[{"dir":"in","kind":"input","name":"catches_on"},{"dir":"in","kind":"secret","name":"shop_db_url"},{"dir":"out","kind":"output","name":"echo","step":"mow"},{"dir":"out","kind":"output","name":"result","step":"call_mechanic"}],"ratings":[{"note":"fixed backoff, base 1 s","parameter":"Attempts, pull_cord","symbol":"A(pull_cord)","unit":"attempts","value":3}],"workflow":{"name":"machine_pull_start_mower","source":"# Pull-start mower: prime the carburettor, then pull the cord until the\n# engine catches. The input says which pull it catches on. The cord may be\n# pulled three times in all (retry.max_attempts: 3); a flooded engine that\n# never catches fails, and the mechanic is called instead of mowing.\n#\n# Each pull is a postgres_query on the test's own database\n# ({{SECRET.shop_db_url}}), counting pulls in a sequence that prime creates\n# for this run. A retry runs the same query again, and nextval keeps\n# counting across failed attempts, so the query fails (division by zero)\n# until the count reaches INPUT.catches_on. call_mechanic reads the count\n# after the last failed pull.\nname: machine_pull_start_mower\n\nactivities:\n  - key: prime\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: CREATE SEQUENCE \"shop_mower_{{ WORKFLOW.id }}\"\n    outputs:\n      - result\n\n  - key: pull_cord\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: >-\n        WITH cord AS (SELECT nextval('\"shop_mower_{{ WORKFLOW.id }}\"') AS pull)\n        SELECT pull, 1 / (CASE WHEN pull >= {{ INPUT.catches_on }} THEN 1 ELSE 0 END) AS caught\n        FROM cord\n    settings:\n      retry:\n        max_attempts: 3\n        strategy: fixed\n        base_seconds: 1\n    outputs:\n      - result\n    depends_on:\n      - prime\n\n  - key: mow\n    worker: std\n    activity_name: echo\n    parameters:\n      pulls: \"{{ pull_cord.result.rows[0].pull }}\"\n    outputs:\n      - echo\n    depends_on:\n      - pull_cord\n\n  - key: call_mechanic\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: SELECT last_value AS pulls FROM \"shop_mower_{{ WORKFLOW.id }}\"\n    outputs:\n      - result\n    depends_on:\n      - activity_key: pull_cord\n        conditions:\n          - \"{{ pull_cord.status == 'failed' }}\"\n","steps":[{"activity":"postgres_query","depends_on":[],"key":"prime","worker":"std"},{"activity":"postgres_query","depends_on":[{"conditions":[],"step":"prime"}],"key":"pull_cord","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"pull_cord"}],"key":"mow","worker":"std"},{"activity":"postgres_query","depends_on":[{"conditions":["{{ pull_cord.status == 'failed' }}"],"step":"pull_cord"}],"key":"call_mechanic","worker":"std"}]}},{"card":{"edge":"A point-of-sale terminal sends a payment down one of two paths, chosen by the input. The path not taken is marked skipped, and the sale still completes.\n","functions":["a condition on a dependency, reading the dependency's output","the branch whose condition is false is skipped","a workflow with a skipped branch still completes"],"kind":"simple","name":"Railway switch","picture":"A lever moves the points at a fork in the line. The train takes the track the lever chose, and the other track stays empty.\n","runs":[{"expect":{"outputs":[{"equals":{"train":"arrived on the left"},"output":"echo","step":"left_track"}],"status":"completed","steps":{"left_track":{"runs":1,"status":"completed"},"lever":{"runs":1,"status":"completed"},"right_track":{"runs":0,"status":"skipped"}}},"input":{"track":"left"},"name":"lever to the left"},{"expect":{"outputs":[{"equals":{"train":"arrived on the right"},"output":"echo","step":"right_track"}],"status":"completed","steps":{"left_track":{"runs":0,"status":"skipped"},"lever":{"runs":1,"status":"completed"},"right_track":{"runs":1,"status":"completed"}}},"input":{"track":"right"},"name":"lever to the right"}]},"dir":"railway-switch","drawing":"MS-62895","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"lever","type":"coil"}}],"series":[],"step":"lever"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"left_track","type":"coil"}}],"series":[{"state":"finished","step":"lever","type":"contact"},{"expr":"lever.echo.track == 'left'","step":"lever","type":"condition"}],"step":"left_track"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"right_track","type":"coil"}}],"series":[{"state":"finished","step":"lever","type":"contact"},{"expr":"lever.echo.track == 'right'","step":"lever","type":"condition"}],"step":"right_track"}],"pins":[{"dir":"in","kind":"input","name":"track"},{"dir":"out","kind":"output","name":"echo","step":"left_track"},{"dir":"out","kind":"output","name":"echo","step":"right_track"}],"ratings":[],"workflow":{"name":"machine_railway_switch","source":"# Railway switch: a lever sets the points, and the train goes down one track.\n# The other track is never used.\nname: machine_railway_switch\n\nactivities:\n  - key: lever\n    worker: std\n    activity_name: echo\n    parameters:\n      track: \"{{ INPUT.track }}\"\n    outputs:\n      - echo\n\n  - key: left_track\n    worker: std\n    activity_name: echo\n    parameters:\n      train: arrived on the left\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: lever\n        conditions:\n          - \"{{ lever.echo.track == 'left' }}\"\n\n  - key: right_track\n    worker: std\n    activity_name: echo\n    parameters:\n      train: arrived on the right\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: lever\n        conditions:\n          - \"{{ lever.echo.track == 'right' }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"lever","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ lever.echo.track == 'left' }}"],"step":"lever"}],"key":"left_track","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ lever.echo.track == 'right' }}"],"step":"lever"}],"key":"right_track","worker":"std"}]}},{"card":{"edge":"A depot gate controller cycles three vehicles through when the gate is unlocked, and skips the cycle, and the step after it, when the gate stays locked. A loop behind a skipped step is skipped too, and the day still closes.\n","functions":["a self-loop whose way in is a condition on the previous step's output, skipped when it's false","a self-loop behind a skipped step, skipped with it","a self-loop ended by iteration_limit, its parameters reading its own last output"],"kind":"compound","name":"Revolving door","picture":"At the lodge, the keeper unlocks the gate, and behind it a revolving door turns three times to let visitors into the lobby. Inside, when the front desk is staffed, the clerk rings the call bell twice for a porter. When the gate stays locked the door doesn't turn and the lobby stays empty; when the desk isn't staffed nobody rings the bell. Either way the day ends.\n","runs":[{"expect":{"outputs":[{"equals":{"ring":2},"output":"echo","step":"bell"}],"status":"completed","steps":{"bell":{"runs":2,"status":"completed"},"desk":{"runs":1,"status":"completed"},"door":{"runs":0,"status":"skipped"},"gate":{"runs":1,"status":"completed"},"keeper":{"runs":1,"status":"completed"},"lobby":{"runs":0,"status":"skipped"}}},"input":{"desk_staffed":true,"unlock":false},"name":"gate locked, desk staffed","timeout_seconds":10},{"expect":{"outputs":[{"equals":{"turn":3},"output":"echo","step":"door"}],"status":"completed","steps":{"bell":{"runs":0,"status":"skipped"},"desk":{"runs":0,"status":"skipped"},"door":{"runs":3,"status":"completed"},"gate":{"runs":1,"status":"completed"},"keeper":{"runs":1,"status":"completed"},"lobby":{"runs":1,"status":"completed"}}},"input":{"desk_staffed":false,"unlock":true},"name":"gate unlocked, desk unstaffed","timeout_seconds":10}],"trap":{"broken_looks_like":"A loop step's back-edge, its dependency on itself, counts before the step has ever run. Behind the locked gate the door turns three times anyway and the lobby fills. Behind the unstaffed desk, which is skipped, the bell waits for itself to finish, stays not_scheduled, and the workflow stays running until the run times out.\n","issue":38}},"dir":"revolving-door","drawing":"MS-65118","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"keeper","type":"coil"}}],"series":[],"step":"keeper"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"gate","type":"coil"}}],"series":[{"state":"completed","step":"keeper","type":"contact"}],"step":"gate"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"door","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"finished","step":"gate","type":"contact"},{"expr":"gate.echo.open","step":"gate","type":"condition"}],[{"step":"door","type":"seal_in"}]],"type":"parallel"},{"default":false,"preset":3,"step":"door","type":"counter"}],"step":"door"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"lobby","type":"coil"}}],"series":[{"state":"completed","step":"door","type":"contact"}],"step":"lobby"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"desk","type":"coil"}}],"series":[{"state":"finished","step":"keeper","type":"contact"},{"expr":"keeper.echo.desk_staffed","step":"keeper","type":"condition"}],"step":"desk"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"bell","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"desk","type":"contact"}],[{"step":"bell","type":"seal_in"}]],"type":"parallel"},{"default":false,"preset":2,"step":"bell","type":"counter"}],"step":"bell"}],"pins":[{"dir":"in","kind":"input","name":"desk_staffed"},{"dir":"in","kind":"input","name":"unlock"},{"dir":"out","kind":"output","name":"echo","step":"lobby"},{"dir":"out","kind":"output","name":"echo","step":"bell"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of door","symbol":"N(door)","unit":"rounds","value":3},{"note":"iteration_limit","parameter":"Rounds of bell","symbol":"N(bell)","unit":"rounds","value":2}],"workflow":{"name":"machine_revolving_door","source":"# Revolving door: the keeper says whether the gate is unlocked and whether\n# the front desk is staffed. Behind the gate a revolving door turns three\n# times, and visitors reach the lobby. At the desk, when it's staffed, the\n# clerk rings the call bell twice for a porter.\n#\n# Two self-loops, each with its dependency on itself as its back-edge, and a\n# different way in:\n# - The door's way in is a condition on the gate: the gate is open. When the\n#   gate is locked the condition is false, and the door must be skipped, and\n#   the lobby after it.\n# - The bell's way in is the desk, with no condition, and the desk has a\n#   condition of its own: it's staffed. When it isn't, the desk is skipped,\n#   and the bell must be skipped with it.\n# A back-edge points at a step that hasn't run yet the first time (here, the\n# loop step itself): it must not let the loop in, nor keep it waiting.\n#\n# The bell depends on the desk without a condition on purpose: a condition\n# reading a skipped step's output can't be evaluated, which fails the step\n# that carries it.\nname: machine_revolving_door\n\nactivities:\n  - key: keeper\n    worker: std\n    activity_name: echo\n    parameters:\n      unlock: \"{{ INPUT.unlock }}\"\n      desk_staffed: \"{{ INPUT.desk_staffed }}\"\n    outputs:\n      - echo\n\n  - key: gate\n    worker: std\n    activity_name: echo\n    parameters:\n      open: \"{{ keeper.echo.unlock }}\"\n    outputs:\n      - echo\n    depends_on:\n      - keeper\n\n  - key: door\n    worker: std\n    activity_name: echo\n    iteration_limit: 3\n    parameters:\n      turn: \"{{ (door.echo.turn + 1) if door.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: gate\n        conditions:\n          - \"{{ gate.echo.open }}\"\n      - door\n\n  - key: lobby\n    worker: std\n    activity_name: echo\n    parameters:\n      visitors: arrived\n    outputs:\n      - echo\n    depends_on:\n      - door\n\n  - key: desk\n    worker: std\n    activity_name: echo\n    parameters:\n      clerk: on duty\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: keeper\n        conditions:\n          - \"{{ keeper.echo.desk_staffed }}\"\n\n  - key: bell\n    worker: std\n    activity_name: echo\n    iteration_limit: 2\n    parameters:\n      ring: \"{{ (bell.echo.ring + 1) if bell.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - desk\n      - bell\n","steps":[{"activity":"echo","depends_on":[],"key":"keeper","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"keeper"}],"key":"gate","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ gate.echo.open }}"],"step":"gate"},{"conditions":[],"step":"door"}],"key":"door","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"door"}],"key":"lobby","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ keeper.echo.desk_staffed }}"],"step":"keeper"}],"key":"desk","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"desk"},{"conditions":[],"step":"bell"}],"key":"bell","worker":"std"}]}},{"card":{"edge":"A night-shift alert at an unstaffed site rings and waits for an acknowledgement, re-alerting up to three times before it gives up. Someone can snooze it, or acknowledge it and end it.\n","functions":["a wait_for_signal step in a self-loop waits again in every round","on_timeout: continue in every round of a loop: each round's wait times out on its own","each round takes its own signal; between rounds a signal finds no wait","the loop's exit step runs once, after the round that exits"],"kind":"compound","name":"Snooze alarm","picture":"The alarm rings and waits for someone to switch it off. Left alone, it snoozes and rings again, three rings in all, then gives up. Someone can snooze it by hand, or switch it off, and then the bedroom is quiet.\n","runs":[{"expect":{"outputs":[{"equals":{"rings":3,"switched_off":false},"output":"echo","step":"quiet"}],"status":"completed","steps":{"alarm":{"runs":3,"status":"completed"},"bedtime":{"runs":1,"status":"completed"},"quiet":{"runs":1,"status":"completed"}}},"name":"nobody switches it off","timeout_seconds":15},{"expect":{"outputs":[{"equals":{"rings":2,"switched_off":true},"output":"echo","step":"quiet"}],"status":"completed","steps":{"alarm":{"runs":2,"status":"completed"},"bedtime":{"runs":1,"status":"completed"},"quiet":{"runs":1,"status":"completed"}}},"name":"snoozed once, then switched off","signals":[{"data":{"off":false},"event":"switch","step":"alarm"},{"data":{"off":true},"event":"switch","step":"alarm"}],"timeout_seconds":15},{"expect":{"outputs":[{"equals":{"rings":1,"switched_off":true},"output":"echo","step":"quiet"}],"status":"completed","steps":{"alarm":{"runs":1,"status":"completed"},"bedtime":{"runs":1,"status":"completed"},"quiet":{"runs":1,"status":"completed"}}},"name":"switched off at the first ring","signals":[{"data":{"off":true},"event":"switch","step":"alarm"}],"timeout_seconds":15}],"trap":{"broken_looks_like":"The alarm's templates read {{ACTIVITY.iteration}}, never set before #32's fix, and {{SIGNAL.off}}, undefined before #37's fix. On main those template errors land on bedtime, which is marked failed although it ran (#19), the alarm never rings, and the workflow stays running. Before #29's fix a signaled round fails, and a wait in a loop can't take a second round's signal or timeout. Before #27's fix, quiet is skipped for good after the first ring doesn't exit the loop.\n","issues":[27,29,32,37]}},"dir":"snooze-alarm","drawing":"MS-33563","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"bedtime","type":"coil"}}],"series":[],"step":"bedtime"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"switch","seconds":1,"step":"alarm","type":"timer"}},{"contacts":[{"event":"switch","type":"interrupt"}],"end":{"action":"run","step":"alarm","type":"coil"}},{"contacts":[{"step":"alarm","type":"timer_done"}],"end":{"action":"continue","step":"alarm","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"bedtime","type":"contact"}],[{"step":"alarm","type":"seal_in"},{"expr":"not alarm.echo.off and alarm.echo.ring < 3","step":"alarm","type":"condition"}]],"type":"parallel"},{"default":false,"preset":5,"step":"alarm","type":"counter"}],"step":"alarm"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"quiet","type":"coil"}}],"series":[{"state":"finished","step":"alarm","type":"contact"},{"expr":"alarm.echo.off or alarm.echo.ring >= 3","step":"alarm","type":"condition"}],"step":"quiet"}],"pins":[{"dir":"in","kind":"signal","name":"switch","step":"alarm"},{"dir":"out","kind":"output","name":"echo","step":"quiet"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of alarm","symbol":"N(alarm)","unit":"rounds","value":5},{"note":"on_timeout: continue","parameter":"Signal wait, alarm (switch)","symbol":"tW(alarm)","unit":"s","value":1}],"workflow":{"name":"machine_snooze_alarm","source":"# Snooze alarm: the alarm rings, and waits for someone to switch it off.\n# Nobody does, so it snoozes (the wait times out and continues) and rings\n# again, three rings at most. Someone who reaches it can snooze it (off:\n# false) or switch it off (off: true). Then the bedroom is quiet.\n#\n# alarm is a self-loop whose every round waits for a signal: a round ends\n# with the signal, or with the timeout, with {{SIGNAL}} null. Its back-edge\n# goes round again while it isn't switched off and has rung fewer than\n# three times. quiet is the loop's exit, with the opposite condition.\n#\n# The ring number comes from {{ACTIVITY.iteration}}, the round being run,\n# as the signals guide's loop example counts rounds. A round's templates are\n# resolved when its wait ends, and then the step's own status is waiting,\n# not its last round's completed, so a count that tests\n# {{alarm.status == 'completed'}} would start again at 1 in every round.\nname: machine_snooze_alarm\n\nactivities:\n  - key: bedtime\n    worker: std\n    activity_name: echo\n    parameters:\n      room: bedroom\n    outputs:\n      - echo\n\n  - key: alarm\n    worker: std\n    activity_name: echo\n    iteration_limit: 5\n    parameters:\n      ring: \"{{ ACTIVITY.iteration + 1 }}\"\n      off: \"{{ SIGNAL.off | coalesce(false) }}\"\n    settings:\n      wait_for_signal:\n        event_name: switch\n        timeout_seconds: 1\n        on_timeout: continue\n    outputs:\n      - echo\n    depends_on:\n      - bedtime\n      - activity_key: alarm\n        conditions:\n          - \"{{ not alarm.echo.off and alarm.echo.ring < 3 }}\"\n\n  - key: quiet\n    worker: std\n    activity_name: echo\n    parameters:\n      rings: \"{{ alarm.echo.ring }}\"\n      switched_off: \"{{ alarm.echo.off }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: alarm\n        conditions:\n          - \"{{ alarm.echo.off or alarm.echo.ring >= 3 }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"bedtime","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"bedtime"},{"conditions":["{{ not alarm.echo.off and alarm.echo.ring < 3 }}"],"step":"alarm"}],"key":"alarm","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ alarm.echo.off or alarm.echo.ring >= 3 }}"],"step":"alarm"}],"key":"quiet","worker":"std"}]}},{"card":{"edge":"A delivery van's meter ticks once a mile, each tick reading its own mile count, the cost so far and the budget left, and it stops itself after the third mile.\n","functions":["{{ACTIVITY.iteration}}, {{ACTIVITY.accumulated_cost_usd}} and {{ACTIVITY.remaining_budget_usd}} in a step's own parameters","{{ACTIVITY.iteration}} in the condition on a step's own back-edge","a self-loop with an activity budget"],"kind":"simple","name":"Taxi meter","picture":"A taxi meter ticks once a mile. Each tick it shows the mile, the fare so far and how much of the passenger's $20 budget is left, and after the third mile it stops: the ride is over.\n","runs":[{"expect":{"outputs":[{"equals":{"display":"mile 3: $0.0 spent, $20.0 left","left":20,"mile":3,"spent":0},"output":"echo","step":"meter"}],"status":"completed","steps":{"meter":{"runs":3,"status":"completed"}}},"name":"a three-mile ride","timeout_seconds":10}],"trap":{"broken_looks_like":"ACTIVITY is never put in the template context, so the meter's parameters fail to resolve (\"undefined value\") before the first mile. On main that template error has no step to fail (#19): the meter never runs and the workflow never gets past created.\n","issue":32}},"dir":"taxi-meter","drawing":"MS-75317","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"meter","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"}],[{"step":"meter","type":"seal_in"},{"expr":"ACTIVITY.iteration < 3","step":"meter","type":"condition"}]],"type":"parallel"},{"default":false,"preset":5,"step":"meter","type":"counter"}],"step":"meter"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"meter"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of meter","symbol":"N(meter)","unit":"rounds","value":5},{"note":"on overrun: abort","parameter":"Budget, meter","symbol":"B(meter)","unit":"USD","value":20.0}],"workflow":{"name":"machine_taxi_meter","source":"# Taxi meter: the meter ticks once a mile for a three-mile ride. Each tick\n# reads the meter's own state through {{ACTIVITY.*}}: which mile this is,\n# what the ride has cost so far, and how much of the passenger's budget is\n# left. The meter itself decides when the ride is over, from its own round.\n#\n# echo costs nothing, so the fare stays at 0 and the whole budget is left.\nname: machine_taxi_meter\n\nactivities:\n  - key: meter\n    worker: std\n    activity_name: echo\n    iteration_limit: 5\n    parameters:\n      mile: \"{{ ACTIVITY.iteration + 1 }}\"\n      spent: \"{{ ACTIVITY.accumulated_cost_usd }}\"\n      left: \"{{ ACTIVITY.remaining_budget_usd }}\"\n      display: \"mile {{ ACTIVITY.iteration + 1 }}: ${{ ACTIVITY.accumulated_cost_usd }} spent, ${{ ACTIVITY.remaining_budget_usd }} left\"\n    settings:\n      budget:\n        limit: 20.00\n        action: abort\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: meter\n        conditions:\n          - \"{{ ACTIVITY.iteration < 3 }}\"\n","steps":[{"activity":"echo","depends_on":[{"conditions":["{{ ACTIVITY.iteration < 3 }}"],"step":"meter"}],"key":"meter","worker":"std"}]}},{"card":{"edge":"A cold room's controller warms the room a degree per round until it reaches the setpoint, and never switches the heater on when the room is already warm enough.\n","functions":["a condition on a self-loop's back-edge, reading the workflow's INPUT and {{<step>.iteration}}","{{<step>.iteration}} in a loop step's own parameters","a condition on the loop's way in, so a loop that isn't needed is skipped"],"kind":"simple","name":"Thermostat","picture":"A thermostat's dial says how warm the room is and how warm it should be. The heater warms the room a degree at a time and switches off when the room reaches the setpoint: three rounds on a cold morning, one on a mild one, and on a warm morning it never switches on.\n","runs":[{"expect":{"outputs":[{"equals":{"room":20,"round":3},"output":"echo","step":"heater"}],"status":"completed","steps":{"dial":{"runs":1,"status":"completed"},"heater":{"runs":3,"status":"completed"}}},"input":{"room":17,"setpoint":20},"name":"cold morning, 17 to 20 degrees","timeout_seconds":10},{"expect":{"outputs":[{"equals":{"room":20,"round":1},"output":"echo","step":"heater"}],"status":"completed","steps":{"dial":{"runs":1,"status":"completed"},"heater":{"runs":1,"status":"completed"}}},"input":{"room":19,"setpoint":20},"name":"mild morning, one degree short","timeout_seconds":10},{"expect":{"status":"completed","steps":{"dial":{"runs":1,"status":"completed"},"heater":{"runs":0,"status":"skipped"}}},"input":{"room":21,"setpoint":20},"name":"warm morning, heating off","timeout_seconds":10}],"trap":{"broken_looks_like":"The heater's {{heater.iteration}} isn't in the template context, and its condition reads INPUT from state_data, which is empty (#30). On main the heater's templates fail while the dial's completion is processed: the dial is marked failed although it ran, the heater never runs, and the workflow stays running (#19). On a warm morning the heater's back-edge also lets it in although the dial's condition is false (#38), so it switches on when it shouldn't.\n","issues":[30,38]}},"dir":"thermostat","drawing":"MS-95188","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"dial","type":"coil"}}],"series":[],"step":"dial"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"heater","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"finished","step":"dial","type":"contact"},{"expr":"dial.echo.room < dial.echo.setpoint","step":"dial","type":"condition"}],[{"step":"heater","type":"seal_in"},{"expr":"INPUT.room + heater.iteration < INPUT.setpoint","step":"heater","type":"condition"}]],"type":"parallel"},{"default":false,"preset":10,"step":"heater","type":"counter"}],"step":"heater"}],"pins":[{"dir":"in","kind":"input","name":"room"},{"dir":"in","kind":"input","name":"setpoint"},{"dir":"out","kind":"output","name":"echo","step":"heater"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of heater","symbol":"N(heater)","unit":"rounds","value":10}],"workflow":{"name":"machine_thermostat","source":"# Thermostat: the dial gives the room's temperature and the setpoint, both\n# in the workflow's input. The heater warms the room one degree a round, and\n# keeps going while the room is below the setpoint.\n#\n# The heater's condition reads INPUT and {{heater.iteration}}, the rounds it\n# has run so far; its parameters read them too.\n#\n# The heater only switches on when the dial shows the room below the\n# setpoint: that's the condition on its way in, its dependency on the dial.\n# On a warm morning the heater is skipped, and the workflow completes.\nname: machine_thermostat\n\nactivities:\n  - key: dial\n    worker: std\n    activity_name: echo\n    parameters:\n      room: \"{{ INPUT.room }}\"\n      setpoint: \"{{ INPUT.setpoint }}\"\n    outputs:\n      - echo\n\n  - key: heater\n    worker: std\n    activity_name: echo\n    iteration_limit: 10\n    parameters:\n      round: \"{{ heater.iteration + 1 }}\"\n      room: \"{{ INPUT.room + heater.iteration + 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - activity_key: dial\n        conditions:\n          - \"{{ dial.echo.room < dial.echo.setpoint }}\"\n      - activity_key: heater\n        conditions:\n          - \"{{ INPUT.room + heater.iteration < INPUT.setpoint }}\"\n","steps":[{"activity":"echo","depends_on":[],"key":"dial","worker":"std"},{"activity":"echo","depends_on":[{"conditions":["{{ dial.echo.room < dial.echo.setpoint }}"],"step":"dial"},{"conditions":["{{ INPUT.room + heater.iteration < INPUT.setpoint }}"],"step":"heater"}],"key":"heater","worker":"std"}]}},{"card":{"edge":"A self-service kiosk waits for the customer to choose, and when nobody does, the timer goes ahead with the default. A tap after the timer is refused, and doesn't run the step a second time.\n","functions":["on_timeout: continue: the step runs with {{SIGNAL}} null, and the step after it reads its output","a signal that arrives after the wait has timed out and continued is refused, and doesn't run the step again"],"kind":"simple","name":"Toaster","picture":"Bread goes in, and the toast waits for someone to pop it. Popped by hand, it comes out at the shade they chose. Left alone, the timer pops it, golden. Then it's buttered. Someone who reaches for the lever after the timer has popped it finds nothing to pop: the toast is made once, as the timer made it.\n","runs":[{"expect":{"outputs":[{"equals":{"buttered":"rye","popped_by":"Ravi","shade":"dark"},"output":"echo","step":"butter"}],"status":"completed","steps":{"butter":{"runs":1,"status":"completed"},"load":{"runs":1,"status":"completed"},"toast":{"runs":1,"status":"completed"}}},"input":{"bread":"rye"},"name":"popped by hand, dark","signals":[{"data":{"by":"Ravi","shade":"dark"},"event":"pop","step":"toast"}],"timeout_seconds":10},{"expect":{"outputs":[{"equals":{"buttered":"sourdough","popped_by":"timer","shade":"golden"},"output":"echo","step":"butter"}],"status":"completed","steps":{"butter":{"runs":1,"status":"completed"},"load":{"runs":1,"status":"completed"},"toast":{"runs":1,"status":"completed"}}},"input":{"bread":"sourdough"},"name":"the timer pops it","timeout_seconds":10},{"expect":{"outputs":[{"equals":{"bread":"brioche","popped_by":"timer","shade":"golden"},"output":"echo","step":"toast"},{"equals":{"buttered":"brioche","popped_by":"timer","shade":"golden"},"output":"echo","step":"butter"}],"status":"completed","steps":{"butter":{"runs":1,"status":"completed"},"load":{"runs":1,"status":"completed"},"toast":{"runs":1,"status":"completed"}}},"input":{"bread":"brioche"},"name":"a hand on the lever too late","signals":[{"data":{"by":"Ravi","shade":"dark"},"event":"pop","late":true,"step":"toast"}],"timeout_seconds":10}],"trap":{"broken_looks_like":"Before #37's fix, the toast's {{SIGNAL.*}} templates are undefined when it becomes ready, so it never waits. On main that template error lands on load, which is marked failed although it ran (#19); the toast is skipped without waiting or timing out, butter stays not_scheduled, and the workflow stays running. Before #29's fix, a toast popped by hand fails as soon as it's signaled.\n","issues":[29,37]}},"dir":"toaster","drawing":"MS-07719","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"load","type":"coil"}}],"series":[],"step":"load"},{"activity":"echo","outputs":[{"contacts":[],"end":{"event":"pop","seconds":2,"step":"toast","type":"timer"}},{"contacts":[{"event":"pop","type":"interrupt"}],"end":{"action":"run","step":"toast","type":"coil"}},{"contacts":[{"step":"toast","type":"timer_done"}],"end":{"action":"continue","step":"toast","type":"coil"}}],"series":[{"state":"completed","step":"load","type":"contact"}],"step":"toast"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"butter","type":"coil"}}],"series":[{"state":"completed","step":"toast","type":"contact"},{"preset":"2s","step":"butter","type":"delay"}],"step":"butter"}],"pins":[{"dir":"in","kind":"input","name":"bread"},{"dir":"in","kind":"signal","name":"pop","step":"toast"},{"dir":"out","kind":"output","name":"echo","step":"butter"}],"ratings":[{"note":"on_timeout: continue","parameter":"Signal wait, toast (pop)","symbol":"tW(toast)","unit":"s","value":2},{"parameter":"Delay before butter","symbol":"tD(butter)","unit":"","value":"2s"}],"workflow":{"name":"machine_toaster","source":"# Toaster: bread goes in, and the toast waits for someone to pop it. Popped\n# by hand, it comes out at the shade they chose. Left alone, the timer pops\n# it (the wait times out and continues), golden, with {{SIGNAL}} null. Then\n# it's buttered. A pop after the timer has popped it is refused, and the\n# toast is made once.\n#\n# The butter takes two seconds to soften (butter's delay), so a late pop\n# reaches a running workflow.\nname: machine_toaster\n\nactivities:\n  - key: load\n    worker: std\n    activity_name: echo\n    parameters:\n      bread: \"{{ INPUT.bread }}\"\n    outputs:\n      - echo\n\n  - key: toast\n    worker: std\n    activity_name: echo\n    parameters:\n      bread: \"{{ load.echo.bread }}\"\n      shade: \"{{ SIGNAL.shade | coalesce('golden') }}\"\n      popped_by: \"{{ SIGNAL.by | coalesce('timer') }}\"\n    settings:\n      wait_for_signal:\n        event_name: pop\n        timeout_seconds: 2\n        on_timeout: continue\n    outputs:\n      - echo\n    depends_on:\n      - load\n\n  - key: butter\n    worker: std\n    activity_name: echo\n    parameters:\n      buttered: \"{{ toast.echo.bread }}\"\n      shade: \"{{ toast.echo.shade }}\"\n      popped_by: \"{{ toast.echo.popped_by }}\"\n    settings:\n      delay: 2s\n    outputs:\n      - echo\n    depends_on:\n      - toast\n","steps":[{"activity":"echo","depends_on":[],"key":"load","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"load"}],"key":"toast","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"toast"}],"key":"butter","worker":"std"}]}},{"card":{"edge":"A packing line sends each batch down two parallel paths of different lengths, weighing and inspecting, and boxes it only when both are done: three batches in a row, each box with its own batch.\n","functions":["a loop with two parallel branches of different lengths that join again","the join (sack) runs once per round, after both branches of that round","iteration_limit ends the loop"],"kind":"compound","name":"Twin grindstone mill","picture":"A mill grinds each batch of grain between two grindstones, coarse then fine, while a sample of the batch goes through a sieve. The sack takes the flour and the sample of the same batch; then the hopper lets in the next. Three batches, three sacks, each with its own batch's flour.\n","runs":[{"expect":{"outputs":[{"equals":{"batch":3,"flour":3,"sample":3},"output":"echo","step":"sack"}],"status":"completed","steps":{"grain":{"runs":1,"status":"completed"},"hopper":{"runs":3,"status":"completed"},"sack":{"runs":3,"status":"completed"},"sieve":{"runs":3,"status":"completed"},"stone_coarse":{"runs":3,"status":"completed"},"stone_fine":{"runs":3,"status":"completed"}}},"name":"three batches","timeout_seconds":10}],"trap":{"broken_looks_like":"From the second batch on, the sack runs as soon as the sieve finishes, on the grindstones' flour from the batch before, and then again when they finish. On main #18 shows first: the grindstones and the sieve run once, and the sack runs 100 times on the first batch's flour.\n","issue":28}},"dir":"twin-grindstone-mill","drawing":"MS-87762","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"grain","type":"coil"}}],"series":[],"step":"grain"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"hopper","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"grain","type":"contact"}],[{"step":"sack","type":"seal_in"},{"expr":"sack.status == 'completed'","step":"sack","type":"condition"}]],"type":"parallel"},{"default":false,"preset":3,"step":"hopper","type":"counter"}],"step":"hopper"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"stone_coarse","type":"coil"}}],"series":[{"state":"completed","step":"hopper","type":"contact"}],"step":"stone_coarse"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"stone_fine","type":"coil"}}],"series":[{"state":"completed","step":"stone_coarse","type":"contact"}],"step":"stone_fine"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"sieve","type":"coil"}}],"series":[{"state":"completed","step":"hopper","type":"contact"}],"step":"sieve"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"sack","type":"coil"}}],"series":[{"state":"completed","step":"stone_fine","type":"contact"},{"state":"completed","step":"sieve","type":"contact"}],"step":"sack"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"sack"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of hopper","symbol":"N(hopper)","unit":"rounds","value":3}],"workflow":{"name":"machine_twin_grindstone_mill","source":"# Twin grindstone mill: each batch of grain from the hopper goes two ways.\n# The flour goes through two grindstones, coarse then fine; a sample goes\n# through the sieve, which is quicker. The sack takes the flour and the\n# sieve's sample of the same batch, and then the hopper lets in the next\n# batch: three batches in all.\n#\n# The sack joins a long branch (two steps) and a short one (one step) inside\n# the loop. It must wait for both branches of this batch, not run when the\n# sieve finishes, on the grindstones' flour from the batch before.\n#\n# The keys sort with grain first, so even the alphabetical back-edge search\n# (#26) finds sack -> hopper. Keep it that way, so this machine traps #28\n# alone.\nname: machine_twin_grindstone_mill\n\nactivities:\n  - key: grain\n    worker: std\n    activity_name: echo\n    parameters:\n      grain: wheat\n    outputs:\n      - echo\n\n  - key: hopper\n    worker: std\n    activity_name: echo\n    iteration_limit: 3\n    parameters:\n      batch: \"{{ (sack.echo.batch + 1) if sack.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - grain\n      - activity_key: sack\n        conditions:\n          - \"{{ sack.status == 'completed' }}\"\n\n  - key: stone_coarse\n    worker: std\n    activity_name: echo\n    parameters:\n      batch: \"{{ hopper.echo.batch }}\"\n    outputs:\n      - echo\n    depends_on:\n      - hopper\n\n  - key: stone_fine\n    worker: std\n    activity_name: echo\n    parameters:\n      batch: \"{{ stone_coarse.echo.batch }}\"\n    outputs:\n      - echo\n    depends_on:\n      - stone_coarse\n\n  - key: sieve\n    worker: std\n    activity_name: echo\n    parameters:\n      batch: \"{{ hopper.echo.batch }}\"\n    outputs:\n      - echo\n    depends_on:\n      - hopper\n\n  - key: sack\n    worker: std\n    activity_name: echo\n    parameters:\n      batch: \"{{ hopper.echo.batch }}\"\n      flour: \"{{ stone_fine.echo.batch }}\"\n      sample: \"{{ sieve.echo.batch }}\"\n    outputs:\n      - echo\n    depends_on:\n      - stone_fine\n      - sieve\n","steps":[{"activity":"echo","depends_on":[],"key":"grain","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"grain"},{"conditions":["{{ sack.status == 'completed' }}"],"step":"sack"}],"key":"hopper","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"hopper"}],"key":"stone_coarse","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"stone_coarse"}],"key":"stone_fine","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"hopper"}],"key":"sieve","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"stone_fine"},{"conditions":[],"step":"sieve"}],"key":"sack","worker":"std"}]}},{"card":{"edge":"A parking meter refuses a payment tapped while it's still booting, so it has to be tapped again. When the card reader glitches on the first try, the step retries with the same payment, without asking for it again.\n","functions":["a signal sent before the step waits is refused, and isn't kept for later","a signaled step with settings.retry that fails is run again, without waiting for another signal","a retry of a signaled step sees the same {{SIGNAL}}"],"kind":"compound","name":"Vending machine","picture":"The machine warms up when it's switched on, then waits for a coin. A coin pushed in while it's warming up drops straight out, and has to go in again. The coin mechanism jams on the first try and frees itself on the second, still holding the same coin, and the machine dispenses.\n","runs":[{"expect":{"outputs":[{"equals":{"rows":[{"coin":2,"freed":1,"try":2}]},"output":"result","step":"coin_slot"},{"equals":{"paid":2,"tries":2},"output":"echo","step":"dispense"}],"status":"completed","steps":{"coin_slot":{"runs":1,"status":"completed"},"dispense":{"runs":1,"status":"completed"},"power_on":{"runs":1,"status":"completed"}}},"name":"a coin too soon, then a coin that jams","signals":[{"data":{"coin":2},"early":true,"event":"coin","step":"coin_slot"},{"data":{"coin":2},"event":"coin","step":"coin_slot"}],"timeout_seconds":15}],"trap":{"broken_looks_like":"Before #37's fix, the coin slot's {{SIGNAL.coin}} is undefined when it becomes ready, so it never waits. On main that template error lands on power_on, which is marked failed although it ran (#19); the coin slot is skipped, dispense stays not_scheduled, and the workflow stays running. Before #29's fix, the coin slot fails as soon as the coin goes in.\n","issues":[29,37]}},"dir":"vending-machine","drawing":"MS-35222","ladder":[{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"action":"run","step":"power_on","type":"coil"}}],"series":[{"preset":"2s","step":"power_on","type":"delay"}],"step":"power_on"},{"activity":"postgres_query","outputs":[{"contacts":[],"end":{"event":"coin","seconds":6,"step":"coin_slot","type":"timer"}},{"contacts":[{"event":"coin","type":"interrupt"}],"end":{"action":"run","step":"coin_slot","type":"coil"}},{"contacts":[{"step":"coin_slot","type":"timer_done"}],"end":{"action":"fail","step":"coin_slot","type":"coil"}}],"series":[{"state":"completed","step":"power_on","type":"contact"}],"step":"coin_slot"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"dispense","type":"coil"}}],"series":[{"state":"completed","step":"coin_slot","type":"contact"}],"step":"dispense"}],"pins":[{"dir":"in","kind":"signal","name":"coin","step":"coin_slot"},{"dir":"in","kind":"secret","name":"shop_db_url"},{"dir":"out","kind":"output","name":"echo","step":"dispense"}],"ratings":[{"parameter":"Delay before power_on","symbol":"tD(power_on)","unit":"","value":"2s"},{"note":"on_timeout: fail","parameter":"Signal wait, coin_slot (coin)","symbol":"tW(coin_slot)","unit":"s","value":6},{"note":"fixed backoff, base 1 s","parameter":"Attempts, coin_slot","symbol":"A(coin_slot)","unit":"attempts","value":3}],"workflow":{"name":"machine_vending_machine","source":"# Vending machine: it warms up for two seconds when switched on, then waits\n# for a coin. A coin pushed in while it's still warming up is refused (the\n# wait hasn't begun) and must be inserted again. The coin mechanism jams on\n# the first try and runs again (retry.max_attempts: 3); the retry still has\n# the coin ({{SIGNAL}} is the same on every attempt), and doesn't wait for\n# another one. Then the machine dispenses.\n#\n# power_on creates this run's sequence and has a delay, so the coin slot\n# isn't waiting yet when the early coin arrives. coin_slot is a\n# postgres_query on the test's own database that counts its tries in the\n# sequence and fails (division by zero) on the first one.\nname: machine_vending_machine\n\nactivities:\n  - key: power_on\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: CREATE SEQUENCE \"shop_vend_{{ WORKFLOW.id }}\"\n    settings:\n      delay: 2s\n    outputs:\n      - result\n\n  - key: coin_slot\n    worker: std\n    activity_name: postgres_query\n    parameters:\n      db_url: \"{{ SECRET.shop_db_url }}\"\n      query: >-\n        WITH mechanism AS (SELECT nextval('\"shop_vend_{{ WORKFLOW.id }}\"') AS try)\n        SELECT try, {{ SIGNAL.coin }} AS coin,\n          1 / (CASE WHEN try >= 2 THEN 1 ELSE 0 END) AS freed\n        FROM mechanism\n    settings:\n      wait_for_signal:\n        event_name: coin\n        timeout_seconds: 6\n        on_timeout: fail\n      retry:\n        max_attempts: 3\n        strategy: fixed\n        base_seconds: 1\n    outputs:\n      - result\n    depends_on:\n      - power_on\n\n  - key: dispense\n    worker: std\n    activity_name: echo\n    parameters:\n      paid: \"{{ coin_slot.result.rows[0].coin }}\"\n      tries: \"{{ coin_slot.result.rows[0].try }}\"\n    outputs:\n      - echo\n    depends_on:\n      - coin_slot\n","steps":[{"activity":"postgres_query","depends_on":[],"key":"power_on","worker":"std"},{"activity":"postgres_query","depends_on":[{"conditions":[],"step":"power_on"}],"key":"coin_slot","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"coin_slot"}],"key":"dispense","worker":"std"}]}},{"card":{"edge":"An irrigation controller runs a two-step pump cycle, piston then valve, three times, the valve working on each stroke's latest output.\n","functions":["a two-step loop, the piston (head) and the valve (tail)","iteration_limit ends the loop","a loop step's parameters read the other step's latest output"],"kind":"compound","name":"Water pump","picture":"A hand pump at a well. Each stroke, the piston lifts water and the valve lets it out. Three strokes, three lots of water: the valve opens once per stroke, never on its own.\n","runs":[{"expect":{"outputs":[{"equals":{"stroke":3},"output":"echo","step":"piston"},{"equals":{"stroke":3},"output":"echo","step":"valve"}],"status":"completed","steps":{"intake":{"runs":1,"status":"completed"},"piston":{"runs":3,"status":"completed"},"valve":{"runs":3,"status":"completed"}}},"name":"three strokes","timeout_seconds":10}],"trap":{"broken_looks_like":"The valve runs again after each of its own runs, without a new stroke, until the default cap of 100 rounds, and the piston strokes on the valve's stale output. The workflow completes, with the valve run 100 times and the last stroke numbered 2.\n","issue":18}},"dir":"water-pump","drawing":"MS-79877","ladder":[{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"intake","type":"coil"}}],"series":[],"step":"intake"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"piston","type":"coil"}}],"series":[{"branches":[[{"type":"first_round"},{"state":"completed","step":"intake","type":"contact"}],[{"step":"valve","type":"seal_in"},{"expr":"valve.status == 'completed'","step":"valve","type":"condition"}]],"type":"parallel"},{"default":false,"preset":3,"step":"piston","type":"counter"}],"step":"piston"},{"activity":"echo","outputs":[{"contacts":[],"end":{"action":"run","step":"valve","type":"coil"}}],"series":[{"state":"completed","step":"piston","type":"contact"}],"step":"valve"}],"pins":[{"dir":"out","kind":"output","name":"echo","step":"valve"}],"ratings":[{"note":"iteration_limit","parameter":"Rounds of piston","symbol":"N(piston)","unit":"rounds","value":3}],"workflow":{"name":"machine_water_pump","source":"# Water pump: a hand pump. Each stroke, the piston lifts water and the valve\n# lets that stroke's water out. The piston strokes again once the valve has\n# let the last stroke out, three strokes in all.\n#\n# The piston numbers each stroke from the valve's last one, so the valve's\n# output says which stroke it let out.\nname: machine_water_pump\n\nactivities:\n  - key: intake\n    worker: std\n    activity_name: echo\n    parameters:\n      well: full\n    outputs:\n      - echo\n\n  - key: piston\n    worker: std\n    activity_name: echo\n    iteration_limit: 3\n    parameters:\n      stroke: \"{{ (valve.echo.stroke + 1) if valve.status == 'completed' else 1 }}\"\n    outputs:\n      - echo\n    depends_on:\n      - intake\n      - activity_key: valve\n        conditions:\n          - \"{{ valve.status == 'completed' }}\"\n\n  - key: valve\n    worker: std\n    activity_name: echo\n    parameters:\n      stroke: \"{{ piston.echo.stroke }}\"\n    outputs:\n      - echo\n    depends_on:\n      - piston\n","steps":[{"activity":"echo","depends_on":[],"key":"intake","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"intake"},{"conditions":["{{ valve.status == 'completed' }}"],"step":"valve"}],"key":"piston","worker":"std"},{"activity":"echo","depends_on":[{"conditions":[],"step":"piston"}],"key":"valve","worker":"std"}]}}],"results":[{"engine_version":"0.12.4","footprint":{"engine_pool_max_connections":5,"peak_engine_connections":5},"host":"m4","machine_footprints":{"bank-vault":{"events":24,"measured":3,"payload_bytes":2694,"peak_engine_connections":5,"queue_rows":6,"runs":3,"seconds":0.34684308199999997,"seconds_max":0.208232333},"dead-mans-switch":{"events":21,"measured":3,"payload_bytes":2094,"peak_engine_connections":5,"queue_rows":6,"runs":3,"seconds":0.19411475,"seconds_max":0.074396458},"domino-run":{"events":20,"measured":2,"payload_bytes":1730,"peak_engine_connections":5,"queue_rows":8,"runs":2,"seconds":0.145765584,"seconds_max":0.075056667},"draw
