# Example 7b: Complete Agentic Research (Iterative Workflows with Budget-Aware Loops)
#
# This is the COMPLETE implementation of Example 7 from mvp-workflows-implementation-plan.md.
# It demonstrates advanced features beyond the simplified 07a version.
#
# For a SIMPLER, SELF-CONTAINED introduction to loops (LLM-only, no external dependencies),
# see 07a-agentic-research-simple.yaml first.
#
# Input:
#   {"research_topic": "Recent advances in solid-state batteries"}
#
# What This Example Adds Beyond 07a (Advanced US-3.4 Features):
# ✓ Multiple LLM activities: Haiku for research + evaluation, Sonnet for reporting
# ✓ Multi-provider fallback: Haiku primary, Gemini fallback for research
# ✓ Every round's results kept: iteration_scoped: true makes {{search_information.result}}
#   the array of all rounds' results
# ✓ Dual success/failure paths (explicit publish_success and publish_failure activities)
# ✓ Round counter in templates and conditions: {{search_information.iteration}}
# ✓ Boolean conditions written as single expressions ({{ a and b }}, `in`, `<`, `>=`)
# ✓ Budget enforcement per activity across all rounds (settings.budget)
#
# Prerequisites:
# - ANTHROPIC_API_KEY for Claude models (Haiku 4.5 for research + evaluate, Sonnet 4.5 for compile)
# - GOOGLE_API_KEY (optional) for Gemini fallback on search_information
# - Examples environment (for Mailpit notifications)
#
# Workflow Pattern:
# search_information → evaluate_sufficiency → [loop back if CONTINUE] → compile_report → publish_success
#            ↑_____________________________|
#                                          └─→ [CONTINUE after 5 rounds] → publish_failure
#
# Budget-Aware Loop Behavior:
# - Each iteration of search_information costs ~$0.002 (Haiku 4.5)
# - Each iteration of evaluate_sufficiency costs ~$0.001 (Haiku 4.5)
# - With $0.50 budget per activity and a 5 iteration limit:
#   - Max theoretical iterations: 5 (well within budget)
#   - Max enforced iterations: 5 (iteration_limit)
#   - Loop will stop at whichever limit is reached first
# - Budget accumulates across ALL iterations (not per-iteration)
# - If an activity's budget is exceeded, that activity fails (action: abort), and so
#   does the workflow
#
# Expected Execution Flow (Success Scenario):
#
# 1. search_information (round 1, iteration 0): Haiku researches the topic
#    - Cost: ~$0.002, Total: $0.002
#    - Outputs: {{search_information.result}} = [result_1]
#
# 2. evaluate_sufficiency (round 1): Not sufficient yet → replies CONTINUE
#    - Cost: ~$0.001, Total: $0.003
#    - Loop back condition met → schedule search_information again
#
# 3. search_information (round 2, iteration 1): Haiku researches again with refined focus
#    - Cost: ~$0.002, Total: $0.005
#    - Prompt includes previous findings, so Haiku focuses on gaps
#    - Outputs: {{search_information.result}} = [result_1, result_2]
#
# 4. evaluate_sufficiency (round 2): Still not sufficient → CONTINUE
#    - Cost: ~$0.001, Total: $0.006
#    - Loop back condition met → schedule search_information again
#
# 5. search_information (round 3, iteration 2): Third search, comprehensive coverage
#    - Cost: ~$0.002, Total: $0.008
#    - Outputs: {{search_information.result}} = [result_1, result_2, result_3]
#
# 6. evaluate_sufficiency (round 3): Now sufficient → SUFFICIENT
#    - Cost: ~$0.001, Total: $0.009
#    - Loop back condition NOT met (the reply starts with SUFFICIENT)
#    - compile_report condition IS met
#
# 7. compile_report: Synthesize all findings from 3 rounds
#    - Cost: ~$0.020 (Sonnet 4.5), Total: $0.029
#    - Reads every round's findings from {{search_information.result}}
#
# 8. publish_success: Send report via email
#    - Includes: topic, iterations=3
#
# Total iterations: 3 (stopped by evaluate decision)
# Total cost: ~$0.029 (well under the activity budgets)
#
# Expected Execution Flow (Failure Scenario - Iteration Limit Reached):
#
# 1-4. [Same as above, but evaluate_sufficiency replies CONTINUE every round]
#
# 5. evaluate_sufficiency (round 5): Still insufficient after 5 rounds
#    - Loop back condition NOT met (search_information.iteration is 5)
#    - publish_failure condition IS met
#
# 6. publish_failure: Send failure report via email
#    - Includes: reason="Insufficient information after 5 iterations"
#    - Includes: the last evaluation, with its remaining gaps
#
# Loop Exit Scenarios:
# 1. Normal exit: evaluate replies SUFFICIENT (condition-based)
# 2. Iteration limit: 5 rounds without SUFFICIENT (iteration-based) → publish_failure
# 3. Budget exhausted: an activity exceeds its budget and fails (settings.budget)
# 4. Activity failure: any activity fails (error-based)
#
# Budget in conditions: an activity's accumulated cost and remaining budget are not
# available to conditions or to other activities' templates, so the loop can't exit
# early on a low remaining budget. Budget is enforced by settings.budget instead.
# An activity's own templates can read its budget: evaluate_sufficiency's prompt
# uses {{ACTIVITY.remaining_budget_usd}}.
#
# Differences from 07a (Simple Version):
#
# | Feature               | 07a (Simple)             | 07b (Complete)                            |
# |-----------------------|--------------------------|-------------------------------------------|
# | Research activity     | LLM simulates research   | Haiku 4.5 with Gemini fallback            |
# | Loop condition syntax | String matching          | String matching plus the round counter    |
# | Results storage       | Inline JSON              | Every round's result (iteration_scoped)   |
# | Array access          | Implicit (Jinja filters) | Explicit (map, join and last filters)     |
# | Failure handling      | Implicit (timeout/error) | Explicit publish_failure activity         |
# | Budget checks         | Activity-level only      | Activity-level only                       |
# | External dependencies | None (LLM-only)          | Anthropic API key (+ Google for fallback) |
# | Production readiness  | Educational demo         | Production-ready pattern                  |
#
# Key YAML Features Demonstrated (from mvp-workflows-implementation-plan.md lines 1376-1386):
# ✅ Loop back-edge (search_information depends on evaluate_sufficiency, with conditions)
# ✅ Iteration-scoped outputs: iteration_scoped: true
# ✅ Access all iteration results: {{activity_key.output_name}} (array of all rounds)
# ✅ Access the latest iteration: {{(activity_key.output_name | last)}}
# ✅ Round counter: {{activity_key.iteration}} - rounds completed so far (0 in the first round)
# ✅ Maximum iteration limits (prevent infinite loops)
# ✅ Boolean expressions with `and`, `in`, `<`, `>=`
# ✅ Multi-provider fallback: Haiku primary, Gemini fallback for research
#
# Implementation Notes:
# - Uses Claude Haiku 4.5 for research (falls back to Gemini 2.5 Flash Lite if unavailable)
# - Claude Haiku 4.5 for evaluation, Claude Sonnet 4.5 for report compilation
# - llm_prompt has a single output, `result`, with the reply text in `result.content`.
#   It doesn't split the reply's JSON into separate outputs, so the decision is read
#   from the text: evaluate_sufficiency starts its reply with SUFFICIENT or CONTINUE.
# - Future: When MCP tool support is added, search_information can use google_search
#   tool for real-time web-grounded research

name: agentic_research_complete
description: Complete iterative research workflow with model fallback, every round's results kept, and dual success/failure paths

activities:
  # Step 1: Iterative research via Haiku 4.5 (loops until sufficient)
  # Falls back to Gemini 2.5 Flash Lite if Haiku is unavailable.
  # Future: When MCP tool support is added, this activity can use google_search
  # for real-time web-grounded research.
  - key: search_information
    activity_name: llm_prompt
    iteration_scoped: true       # Keep every round's result: search_information.result is an array
    iteration_limit: 5           # Safety bound: max 5 iterations
    parameters:
      model:
        - anthropic/claude-haiku-4-5-20251001
        - google/gemini-2.5-flash-lite
      prompt: |
        You are a research assistant investigating the following topic:

        Research topic: {{INPUT.research_topic}}

        Current iteration: {{search_information.iteration}}

        {% if search_information.iteration > 0 %}
        Previous findings from {{search_information.result | length}} earlier iterations:
        {{search_information.result | map(attribute='content') | join('\n\n---\n\n')}}

        Focus on filling gaps and finding NEW information not covered above.
        {% else %}
        This is the first research iteration. Research broadly for key facts,
        recent developments, and authoritative sources on the topic.
        {% endif %}

        Provide thorough, detailed research findings with specific facts and data.
        Return your findings as structured JSON (no markdown):
        {
          "findings": "detailed research findings with specific facts and data",
          "sources": ["source1", "source2", "source3"],
          "coverage_areas": ["area1", "area2"],
          "gaps_remaining": ["gap1", "gap2"]
        }
      max_tokens: 2000
    outputs:
      - result
    settings:
      budget:
        limit: 0.50
        action: abort
    depends_on:
      # Loop: search depends on evaluate with conditions (all must hold)
      - activity_key: evaluate_sufficiency
        conditions:
          # Loop back if:
          # 1. Fewer than 5 rounds so far (redundant with iteration_limit, but explicit)
          # 2. evaluate said insufficient (its latest reply starts with CONTINUE)
          - "{{ search_information.iteration < 5 }}"
          - "{{ ((evaluate_sufficiency.result | last).content | trim | upper) is startingwith('CONTINUE') }}"

  # Step 2: Evaluate if gathered information is sufficient (after each search)
  - key: evaluate_sufficiency
    activity_name: llm_prompt
    iteration_scoped: true       # Keep every round's assessment for compile_report
    parameters:
      model: anthropic/claude-haiku-4-5-20251001
      prompt: |
        You are a research assistant. Determine if the gathered information
        is sufficient to answer the research question.

        Start your reply with exactly one word on its own line:
        - SUFFICIENT (if ready to compile the report)
        - CONTINUE (if more research is needed)
        Then explain why, and list the remaining information gaps.

        Research question: {{INPUT.research_topic}}
        Current iteration: {{search_information.iteration}}

        All information gathered across {{search_information.result | length}} iterations:
        {{search_information.result | map(attribute='content') | join('\n\n---\n\n')}}

        Current iteration's findings:
        {{(search_information.result | last).content}}

        Remaining budget: ${{ACTIVITY.remaining_budget_usd}}
      max_tokens: 200
    outputs:
      - result
    settings:
      budget:
        limit: 0.50
        action: abort
    depends_on:
      - search_information

  # Step 3: Compile comprehensive report (runs once, after loop exits via SUFFICIENT)
  - key: compile_report
    activity_name: llm_prompt
    parameters:
      model: anthropic/claude-sonnet-4-5-20250929
      prompt: |
        Compile a comprehensive research report from all gathered information.

        Topic: {{INPUT.research_topic}}
        Total iterations: {{search_information.iteration}}

        All research findings from {{search_information.result | length}} iterations:
        {{search_information.result | map(attribute='content') | join('\n\n---\n\n')}}

        Evaluation assessments from each iteration:
        {{evaluate_sufficiency.result | map(attribute='content') | join('\n\n---\n\n')}}

        Create a well-structured report that:
        1. Answers the research question comprehensively
        2. Cites sources from the search results
        3. Addresses all gaps identified during the research
        4. Provides actionable insights
      max_tokens: 4000
    outputs:
      - result
    settings:
      budget:
        limit: 1.00
        action: abort
    depends_on:
      - activity_key: evaluate_sufficiency
        conditions:
          # Only compile report when evaluate said sufficient (its latest reply
          # doesn't start with CONTINUE)
          - "{{ ((evaluate_sufficiency.result | last).content | trim | upper) is not startingwith('CONTINUE') }}"

  # Step 4a: Publish success result (after successful research completion)
  - key: publish_success
    activity_name: http_request
    parameters:
      method: POST
      url: "http://mailpit:8025/api/v1/send"
      headers:
        Content-Type: "application/json"
      body:
        From:
          Name: "Kruxia Flow Research"
          Email: "research@kruxiaflow.local"
        To:
          - Name: "Researcher"
            Email: "researcher@example.com"
        Subject: "Research Complete - {{INPUT.research_topic}}"
        Text: |
          Status: success
          Topic: {{INPUT.research_topic}}
          Iterations: {{search_information.iteration}}
          Workflow ID: {{WORKFLOW.id}}

          --- Report ---

          {{compile_report.result.content}}
    depends_on:
      - compile_report

  # Step 4b: Publish failure result (when the loop ends without sufficient information)
  - key: publish_failure
    activity_name: http_request
    parameters:
      method: POST
      url: "http://mailpit:8025/api/v1/send"
      headers:
        Content-Type: "application/json"
      body:
        From:
          Name: "Kruxia Flow Research"
          Email: "research@kruxiaflow.local"
        To:
          - Name: "Researcher"
            Email: "researcher@example.com"
        Subject: "Research Failed - {{INPUT.research_topic}}"
        Text: |
          Status: failed
          Topic: {{INPUT.research_topic}}
          Reason: Insufficient information after {{search_information.iteration}} iterations
          Iterations: {{search_information.iteration}}
          Workflow ID: {{WORKFLOW.id}}

          --- Last Assessment ---

          {{(evaluate_sufficiency.result | last).content}}
    depends_on:
      - activity_key: evaluate_sufficiency
        conditions:
          # Publish failure if evaluate still said insufficient (CONTINUE)
          # when the iteration limit was reached
          - "{{ ((evaluate_sufficiency.result | last).content | trim | upper) is startingwith('CONTINUE') and search_information.iteration >= 5 }}"
